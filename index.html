ll,"t":"mcq","s":"Route A returns <code>{\"error\": \"not found\"}<\/code> and route B returns <code>{\"msg\": \"invalid id\"}<\/code>. The slide 44 fix is…","o":["Return 200 for both","A consistent error envelope across the API (e.g. RFC 7807 Problem Details)","Use more status codes","Turn on CORS","Use XML"],"a":1,"w":""},{"id":"dwa-64","mod":"dwa","src":"Q64","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Header-based API versioning (<code>Accept: application/vnd.myapi.v2+json<\/code>) compared with <code>/v2/<\/code> path versioning…","o":["is more explicit and widely used","keeps URLs clean but is harder to debug in browsers","is required by REST","needs no server changes","can't run two versions at once"],"a":1,"w":"Path versioning is \"the most explicit and widely used pattern\" (slide 45)."},{"id":"dwa-65","mod":"dwa","src":"Q65","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which FastAPI docs page lets developers execute live calls against the backend?","o":["<code>/redoc<\/code>","<code>/docs<\/code> (Swagger UI)","<code>/openapi.yaml<\/code>","<code>/api<\/code>","<code>/health<\/code>"],"a":1,"w":"ReDoc is the read-only, stakeholder-friendly layout. <code>/openapi.json<\/code> is the raw spec (slide 46)."},{"id":"dwa-66","mod":"dwa","src":"Q66","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<code>const res = await fetch(url);<\/code> returns a 404. Which statement is true?","o":["<code>fetch<\/code> throws, so the <code>catch<\/code> block runs","<code>fetch<\/code> resolves; you must check <code>res.ok<\/code> yourself","The browser retries","<code>res.json()<\/code> is skipped automatically","CORS converts it to a 200"],"a":1,"w":"Network failures go to <code>catch<\/code>; HTTP errors \"must be checked manually via <code>res.ok<\/code>\" (slide 47)."},{"id":"dwa-67","mod":"dwa","src":"Q67","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<em>(Past-exam topic, transcript 1:37.)<\/em> Your page renders item titles from the API with <code>li.innerHTML = item.title<\/code>. What is the risk, and the fix?","o":["A slow page; use a CDN","Cross-site scripting; use <code>textContent<\/code> (or escape the output)","CORS; use <code>*<\/code>","SQL injection; use <code>innerText<\/code> on the server","No risk, because it's your own API"],"a":1,"w":"\"Never insert untrusted API strings directly into <code>.innerHTML<\/code>\" (slide 48). The data came from users."},{"id":"dwa-68","mod":"dwa","src":"Q68","wk":["2"],"off":false,"m":null,"t":"card","s":"What is spaghetti code, and why does slide 48 say manual DOM manipulation leads to it?","back":"<p>Code whose control flow and dependencies are tangled: \"everything living inside of things and nested if statements… unreadable, unmaintainable\" (transcript 1:36–1:37). As app state grows, hand-written <code>getElementById<\/code>/<code>createElement<\/code> updates scatter across the code, so the UI and the data \"desynchronize\" (slide 48). Remedies: separation of concerns, templates/components, OOP/SOLID/DRY, and reactive frameworks (Svelte in week 9).<\/p>"},{"id":"dwa-69","mod":"dwa","src":"Q69","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which pair of URLs is <strong>same-origin<\/strong>?","o":["<code>http://localhost:5173<\/code> and <code>http://localhost:8000<\/code>","<code>https://a.com<\/code> and <code>http://a.com<\/code>","<code>https://www.doc.gold.ac.uk/usr/560/<\/code> and <code>https://www.doc.gold.ac.uk/www/560/<\/code>","<code>http://localhost:3000<\/code> and <code>http://127.0.0.1:3000<\/code>","<code>https://google.com<\/code> and <code>https://doc.gold.ac.uk<\/code>"],"a":2,"w":"The protocol, host and port match; only the path differs. (A: port differs. B: protocol. D: host. E: host.)"},{"id":"dwa-70","mod":"dwa","src":"Q70","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A page on another origin fetches your API and gets a CORS error. What did your FastAPI server do?","o":["Blocked the request at the firewall","Never received it","Executed the route and logged it; the browser withheld the response from the script","Returned 403","Returned 422"],"a":2,"w":"\"CORS is NOT a server-side firewall\" (slide 50)."},{"id":"dwa-71","mod":"dwa","src":"Q71","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which request is sent directly, without a CORS preflight, according to slide 51?","o":["DELETE with JSON","PUT","A request with a custom header","A simple GET","A PATCH"],"a":3,"w":"(Background knowledge: a POST with <code>Content-Type: application/json<\/code> is also preflighted, so only form-type POSTs are \"simple\".)"},{"id":"dwa-72","mod":"dwa","src":"Q72","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In production, an API that uses session cookies should configure CORS with…","o":["<code>allow_origins=[\"*\"]<\/code>","the exact front-end origin(s), e.g. <code>[\"https://myapp.com\"]<\/code>","no middleware, because curl works","<code>allow_methods=[]<\/code>","<code>Access-Control-Allow-Origin: null<\/code>"],"a":1,"w":"\"Never push <code>allow_origins=['*']<\/code> to production if your endpoints handle authenticated session cookies!\" (slide 62)."},{"id":"dwa-73","mod":"dwa","src":"Q73","wk":["2"],"off":false,"m":null,"t":"mcq","s":"One $5/month VPS running Uvicorn handles about 1,000 req/s. That is roughly…","o":["8.64 million hits/day","86.4 million hits/day","864 million hits/day","1 million hits/day","100,000 hits/day"],"a":1,"w":"1,000 × 86,400 s (slide 52): \"vastly more traffic than 99% of web applications ever see\"."},{"id":"dwa-74","mod":"dwa","src":"Q74","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why are load balancers \"dangerous early on\" (slide 54)?","o":["They are expensive","They destroy in-memory state: sessions fragment and local-disk uploads 404 on the other server","They break HTTPS","They disable CORS","They only work with WSGI"],"a":1,"w":""},{"id":"dwa-75","mod":"dwa","src":"Q75","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Vertical scaling (slide 55) means…","o":["adding servers behind a round-robin load balancer","upgrading one server's CPU/RAM, with zero code or architecture changes","splitting into microservices","adding CDN edge nodes","adding read replicas"],"a":1,"w":"Horizontal scaling (A) is only for when vertical becomes uneconomic or you need high availability."},{"id":"dwa-76","mod":"dwa","src":"Q76","wk":["2"],"off":false,"m":null,"t":"mcq","s":"According to slide 56, what usually runs out first in a web architecture, and what's the fix?","o":["App-server CPU; more threads","Database connections; connection pooling (~20–30 pre-opened connections)","Disk space; compression","Bandwidth; a CDN","RAM; Electron"],"a":1,"w":""},{"id":"dwa-77","mod":"dwa","src":"Q77","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In <code>uvicorn main:app --reload --port 8000<\/code>, what does <code>main:app<\/code> mean?","o":["The <code>main<\/code> function in <code>app.py<\/code>","The module <code>main.py<\/code> and the application variable <code>app<\/code> inside it","The user <code>main<\/code> and group <code>app<\/code>","Port <code>main<\/code>, host <code>app<\/code>","A Docker image"],"a":1,"w":"<code>--reload<\/code> hot-reloads on save. By default it binds 127.0.0.1 (slide 60)."},{"id":"dwa-78","mod":"dwa","src":"Q78","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Typing a URL into the browser address bar can send…","o":["any HTTP method","only GET (with no custom headers)","GET and POST","only OPTIONS","GET and DELETE"],"a":1,"w":"(Slide 61.) Use Swagger UI or curl for the others."},{"id":"dwa-79","mod":"dwa","src":"Q79","wk":["2"],"off":false,"m":null,"t":"card","s":"Slide 29 says \"WSGI (PEP 3333)… created in 2003\". What's inaccurate?","back":"<p>WSGI was created in <strong>PEP 333 (2003)<\/strong>. <strong>PEP 3333 (2010)<\/strong> is its Python 3 revision, which is the current WSGI spec (background knowledge, check peps.python.org). See wsgi and asgi.<\/p>"},{"id":"dwa-80","mod":"dwa","src":"Q80","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Uvicorn runs <code>--port 8000<\/code> without <code>--host<\/code>. curl on the VM works, but <code>https://www.doc.gold.ac.uk/usr/560/<\/code> fails. Most likely cause?","o":["The venv isn't active","It is bound to 127.0.0.1, so the department proxy (another machine) can't connect; add <code>--host 0.0.0.0<\/code>","CORS","The router is mounted once","Port 8000 is privileged"],"a":1,"w":"(Sheet A5; L02 slide 60, transcript 0:08–0:09.)"},{"id":"dwa-81","mod":"dwa","src":"Q81","wk":["2"],"off":false,"m":null,"t":"card","s":"Why does Lab 2 (v2) set <code>FastAPI(root_path=f\"/usr/{SERVER_ID}\")<\/code>, and what did v1 do instead?","back":"<p>The department proxy forwards <code>/usr/&lt;ID&gt;/…<\/code> to the VM <strong>without stripping the prefix<\/strong>. <code>root_path<\/code> tells FastAPI about the prefix, so routes still match and Swagger fetches <code>/usr/&lt;ID&gt;/openapi.json<\/code> rather than <code>/openapi.json<\/code>. v1 mounted the same router twice (at <code>/<\/code> and at <code>/usr/&lt;ID&gt;<\/code>). v2 says not to.<\/p>"},{"id":"dwa-82","mod":"dwa","src":"Q82","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<code>/greet?name=Alex&amp;repeat=three<\/code> returns a JSON error. What is the status code, and does <code>greet_user<\/code> run?","o":["400, yes","404, no","422, no","500, yes","200, yes"],"a":2,"w":"Validation fails before the handler runs (sheet B2: \"Your route handler never even executed\")."},{"id":"dwa-83","mod":"dwa","src":"Q83","wk":["2"],"off":false,"m":null,"t":"mcq","s":"While the C1 console fetch from google.com is blocked by CORS, what should Terminal 1 (Uvicorn's log) show?","o":["Nothing: the request never left the browser","A log line for <code>GET /usr/&lt;ID&gt;/about<\/code>: the server handled it","A 422","A preflight OPTIONS only","A crash"],"a":1,"w":"A simple GET isn't preflighted, and CORS is enforced by the browser <em>after<\/em> the response arrives (slide 50)."},{"id":"dwa-84","mod":"dwa","src":"Q84","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<code>uvicorn<\/code> fails with \"Address already in use\". Which sheet or slide command fixes or diagnoses it?","o":["<code>chmod 755 8000<\/code>","<code>fuser -k 8000/tcp<\/code> (kill) or <code>lsof -i :8000<\/code> (find)","<code>pip install --upgrade pip<\/code>","<code>rm -rf venv<\/code>","<code>sudo reboot<\/code> only"],"a":1,"w":"(Sheet A5; slide 66.)"},{"id":"dwa-85","mod":"dwa","src":"Q85","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which POST body does Part D's <code>ItemCreate<\/code> reject?","o":["<code>{\"title\": \"USB\", \"price\": 5}<\/code>","<code>{\"title\": \"Desk Lamp\", \"price\": 19.99}<\/code>","<code>{\"title\": \"A\", \"price\": 10}<\/code>","<code>{\"title\": \"Mouse\", \"price\": 0.01}<\/code>","<code>{\"title\": \"Hub\", \"price\": \"24.50\"}<\/code>"],"a":2,"w":"<code>min_length=2<\/code>. (E is coerced from string to float in Pydantic's default lax mode, background knowledge. Try it and see.)"},{"id":"dwa-86","mod":"dwa","src":"Q86","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why did Lab 2's <code>items_db = []<\/code> lose its items (L03 slide 2)?","o":["CORS blocked the writes","It lived in server RAM, which is volatile, so a restart wiped it","Pydantic rejected them","SQLite was locked","The browser cached an old copy"],"a":1,"w":"\"Process restart = complete state loss.\""},{"id":"dwa-87","mod":"dwa","src":"Q87","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Two requests append to <code>data.json<\/code> at the same moment. Process A reads, B reads, A writes, B writes. What happens (slide 3)?","o":["Both writes are merged","The OS rejects B","B overwrites A's change, so A's data vanishes","The file is locked forever","Nothing, files are atomic"],"a":2,"w":"A <strong>race condition<\/strong>."},{"id":"dwa-88","mod":"dwa","src":"Q88","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is NOT one of the DBMS responsibilities on slide 5?","o":["Data integrity enforcement","Indexing","Crash recovery","Concurrency control","Rendering HTML templates"],"a":4,"w":""},{"id":"dwa-89","mod":"dwa","src":"Q89","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What does \"declarative\" mean for SQL (slide 5)?","o":["You declare variables first","You say WHAT data you want; the engine decides HOW to fetch it","Every query must be declared in a schema file","Queries run in declaration order","It only works with declared types"],"a":1,"w":""},{"id":"dwa-90","mod":"dwa","src":"Q90","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Slide 6 says NoSQL trades relational schema enforcement and integrity for what?","o":["Stronger ACID guarantees","Horizontal partitioning flexibility","Better joins","Smaller disk use","SQL compatibility"],"a":1,"w":"Examples: MongoDB (document), Redis (key-value), Cassandra (columnar), Neo4j (graph)."},{"id":"dwa-91","mod":"dwa","src":"Q91","wk":["3"],"off":false,"m":null,"t":"mcq","s":"In the relational model, a single row is also called a…","o":["attribute","field","tuple (an instance)","schema","entity type"],"a":2,"w":"Table = entity type, row = instance/tuple, column = attribute/field (slide 9)."},{"id":"dwa-92","mod":"dwa","src":"Q92","wk":["3"],"off":false,"m":null,"t":"mcq","s":"One customer places many orders. Where does the foreign key go (slide 12)?","o":["<code>customers.order_id<\/code>","<code>orders.customer_id<\/code>","A junction table is required","In both tables","Nowhere, use a JSON column"],"a":1,"w":"\"The Foreign Key ALWAYS resides on the 'Many' side.\""},{"id":"dwa-93","mod":"dwa","src":"Q93","wk":["3"],"off":false,"m":null,"t":"mcq","s":"How do you model \"a book has many genres and a genre has many books\" (slides 13–14)?","o":["A comma-separated <code>genres<\/code> column in <code>books<\/code>","An array column of genre IDs","A junction table with FKs to both, turning it into two 1:N relationships","Duplicate each book once per genre","Merge books and genres into one table"],"a":2,"w":"e.g. <code>book_genres(book_id, genre_id)<\/code>."},{"id":"dwa-94","mod":"dwa","src":"Q94","wk":["3"],"off":false,"m":null,"t":"mcq","s":"In crow's foot notation, a circle plus a three-pronged foot means…","o":["exactly one","zero or one","zero or many","one or many","many-to-many"],"a":2,"w":"Circle = optional, foot = many (slide 16)."},{"id":"dwa-95","mod":"dwa","src":"Q95","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Slide 11 says a strict 1:1 relationship is rare. What does it usually suggest?","o":["Use a junction table","Use a UUID","Those columns probably belong in the same table","Use NoSQL","Add ON DELETE CASCADE"],"a":2,"w":"If you do split it, the FK needs a UNIQUE constraint."},{"id":"dwa-96","mod":"dwa","src":"Q96","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is NOT a rule for a primary key (slide 20)?","o":["Unique across the table","Never NULL","Should never change","Should be a natural attribute such as email","Can span more than one column"],"a":3,"w":"Surrogate (artificial) keys are best practice. (E is true: composite keys, slide 26.)"},{"id":"dwa-97","mod":"dwa","src":"Q97","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What security risk does slide 21 link to auto-increment IDs?","o":["SQL injection","Business enumeration: crawling <code>/orders/1<\/code> to <code>/orders/5000<\/code>","XSS","Buffer overflow","Brute-forcing passwords"],"a":1,"w":"UUIDs are unpredictable but cost 16 bytes and fragment B-tree indexes."},{"id":"dwa-98","mod":"dwa","src":"Q98","wk":["3"],"off":false,"m":null,"t":"mcq","s":"With referential integrity on, you insert a book with <code>author_id = 999<\/code> and there's no author 999. What happens (slide 22)?","o":["The book is saved with a NULL author","Author 999 is created automatically","The database rejects the insert","It's saved and flagged","The authors table is truncated"],"a":2,"w":"(In SQLite only once <code>PRAGMA foreign_keys = ON<\/code>, Lab 3 B1.)"},{"id":"dwa-99","mod":"dwa","src":"Q99","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Deleting an Order should remove its OrderItems automatically. Which policy (slide 24)?","o":["RESTRICT","CASCADE","SET NULL","SET DEFAULT","NO DELETE"],"a":1,"w":"Use CASCADE for owned sub-resources."},{"id":"dwa-100","mod":"dwa","src":"Q100","wk":["3"],"off":false,"m":null,"t":"mcq","s":"You must never delete a Customer who still has active Invoices. Which policy?","o":["CASCADE","SET NULL","RESTRICT","SET DEFAULT","TRUNCATE"],"a":2,"w":"Slide 24 also calls it the default."},{"id":"dwa-101","mod":"dwa","src":"Q101","wk":["3"],"off":false,"m":null,"t":"mcq","s":"<code>ON DELETE SET NULL<\/code> only works if…","o":["the parent has no children","the child FK column allows NULL (no NOT NULL)","the table uses UUIDs","CASCADE is also set","the database is PostgreSQL"],"a":1,"w":"(Slide 25.)"},{"id":"dwa-102","mod":"dwa","src":"Q102","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What does <code>PRIMARY KEY (book_id, genre_id)<\/code> on <code>book_genres<\/code> prevent?","o":["A book having two genres","A genre having two books","The same book-genre pair being stored twice","Deleting books","NULL titles"],"a":2,"w":"(Slide 26.)"},{"id":"dwa-103","mod":"dwa","src":"Q103","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Deleting an author's last book also wipes out the author's details. Which anomaly is this?","o":["Insertion","Deletion","Update","Transitive","Referential"],"a":1,"w":"(Slide 28.)"},{"id":"dwa-104","mod":"dwa","src":"Q104","wk":["3"],"off":false,"m":null,"t":"mcq","s":"<code>items_ordered = 'Book A, Book B'<\/code> violates which normal form?","o":["1NF","2NF","3NF","BCNF only","None"],"a":0,"w":"Values must be atomic: no lists (slide 30)."},{"id":"dwa-105","mod":"dwa","src":"Q105","wk":["3"],"off":false,"m":null,"t":"mcq","s":"2NF is only relevant when a table has…","o":["a UUID key","a composite primary key","more than 10 columns","no foreign keys","a NULL column"],"a":1,"w":"No non-key column may depend on just part of the key (slide 31)."},{"id":"dwa-106","mod":"dwa","src":"Q106","wk":["3"],"off":false,"m":null,"t":"mcq","s":"<code>cust_zip<\/code> determines <code>cust_city<\/code> in the customers table. What is this, and which form does it break?","o":["Partial dependency, 2NF","Transitive dependency, 3NF","Repeating group, 1NF","Orphaned record, referential integrity","Nothing is wrong"],"a":1,"w":"\"The key, the whole key, and nothing but the key, so help me Codd\" (slide 32)."},{"id":"dwa-107","mod":"dwa","src":"Q107","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What's the slide 34 rule of thumb on denormalisation?","o":["Never denormalise","Denormalise from the start for speed","Normalise to 3NF first; denormalise only when benchmarks prove reads are too slow","Only normalise to 1NF","Denormalise all junction tables"],"a":2,"w":""},{"id":"dwa-108","mod":"dwa","src":"Q108","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which list is all DDL?","o":["SELECT, INSERT, UPDATE","CREATE, ALTER, DROP, TRUNCATE","INSERT, UPDATE, DELETE","SELECT, JOIN, GROUP BY","CREATE, INSERT, SELECT"],"a":1,"w":"C is DML; SELECT is DQL (slide 36)."},{"id":"dwa-109","mod":"dwa","src":"Q109","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why does slide 41 call <code>INSERT INTO books VALUES (1, '1984', 1, 9.99, 1949);<\/code> fragile?","o":["It's slower","It omits column names, so adding a column later breaks it","It can't insert numbers","It bypasses the PK","SQLite doesn't support it"],"a":1,"w":""},{"id":"dwa-110","mod":"dwa","src":"Q110","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What does <code>UPDATE books SET price = 0.00;<\/code> do?","o":["Updates the first row","Fails without WHERE","Sets every book's price to 0.00","Asks for confirmation","Updates only NULL prices"],"a":2,"w":"\"Zero Safety Net\" (slide 42)."},{"id":"dwa-111","mod":"dwa","src":"Q111","wk":["3"],"off":false,"m":null,"t":"mcq","s":"<code>SELECT * FROM books LIMIT 10 OFFSET 20;<\/code> returns which page at 10 per page?","o":["Page 1","Page 2","Page 3","Page 20","Page 30"],"a":2,"w":"It skips 20 rows (slide 45)."},{"id":"dwa-112","mod":"dwa","src":"Q112","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which query correctly finds authors with more than 3 books?","o":["<code>... WHERE COUNT(*) &gt; 3 GROUP BY author_id<\/code>","<code>... GROUP BY author_id HAVING COUNT(*) &gt; 3<\/code>","<code>... HAVING author_id &gt; 3<\/code>","<code>... ORDER BY COUNT(*) &gt; 3<\/code>","<code>... WHERE author_id &gt; 3<\/code>"],"a":1,"w":"WHERE filters rows before grouping; HAVING filters groups after (slide 49)."},{"id":"dwa-113","mod":"dwa","src":"Q113","wk":["3"],"off":false,"m":null,"t":"card","s":"Using the slide 52 data (three authors; García Márquez has no books), how many rows do INNER JOIN and LEFT JOIN of authors to books return, and why is there a difference?","back":"<p>INNER: 3 rows (Orwell ×2, Woolf ×1). LEFT: 4 rows, because LEFT keeps every author and fills García Márquez's book columns with NULL (slides 54, 56).<\/p>"},{"id":"dwa-114","mod":"dwa","src":"Q114","wk":["3"],"off":false,"m":null,"t":"card","s":"Name the engine for each, from slides 58–60: (a) a single file with one writer at a time; (b) a daemon on 5432 with MVCC and JSONB; (c) a daemon on 3306, \"read-heavy web apps\".","back":"<p>(a) SQLite · (b) PostgreSQL · (c) MySQL.<\/p>"},{"id":"dwa-115","mod":"dwa","src":"Q115","wk":["3"],"off":false,"m":null,"t":"mcq","s":"You open <code>bookshop.db<\/code> in a new session and insert a book with <code>author_id = 99<\/code>, which doesn't exist. It succeeds. Why?","o":["SQLite has no foreign keys","<code>PRAGMA foreign_keys = ON<\/code> is off by default and must be run on every new connection","AUTOINCREMENT created author 99","The FK used CASCADE","<code>.mode box<\/code> disables checks"],"a":1,"w":"(Sheet B1.)"},{"id":"dwa-116","mod":"dwa","src":"Q116","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is a SQLite dot-command rather than SQL?","o":["<code>SELECT * FROM books;<\/code>","<code>PRAGMA foreign_keys = ON;<\/code>","<code>.schema books<\/code>","<code>DROP TABLE books;<\/code>","<code>CREATE TABLE genres (...);<\/code>"],"a":2,"w":"Dot-commands control the shell and take no semicolon."},{"id":"dwa-117","mod":"dwa","src":"Q117","wk":["3"],"off":false,"m":null,"t":"mcq","s":"In Lab 3's schema, what happens when you try to delete George Orwell while his books exist?","o":["His books are deleted too","His books' <code>author_id<\/code> becomes NULL","The delete is refused (ON DELETE RESTRICT)","He's deleted and the books become orphans","It depends on <code>.mode<\/code>"],"a":2,"w":"(Sheet B2.) Deleting a <em>book<\/em> does cascade to its <code>book_genres<\/code> rows."},{"id":"dwa-118","mod":"dwa","src":"Q118","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which PostgreSQL function replaces SQLite's <code>GROUP_CONCAT<\/code> in Activity 2?","o":["<code>CONCAT_WS<\/code>","<code>STRING_AGG<\/code>","<code>ARRAY_JOIN<\/code>","<code>LISTAGG<\/code>","<code>GROUP_JOIN<\/code>"],"a":1,"w":""},{"id":"dwa-119","mod":"dwa","src":"Q119","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Moving the schema to PostgreSQL (Part E2), an INSERT with <code>\"Dystopian\"<\/code> in double quotes fails. Why?","o":["PostgreSQL has no TEXT type","Double quotes mean identifiers (table/column names); strings need single quotes","The genre already exists","SERIAL was missing","phpPgAdmin is read-only"],"a":1,"w":"(Sheet E2.)"},{"id":"dwa-120","mod":"dwa","src":"Q120","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Why can't you reach your VM's port 80 directly from home (slides 6, 10)?","o":["Port 80 is privileged","The VM sits on a private network inside the host, behind a firewall","Apache isn't installed","DNS doesn't resolve it","HTTPS is required"],"a":1,"w":""},{"id":"dwa-121","mod":"dwa","src":"Q121","wk":["1"],"off":false,"m":null,"t":"mcq","s":"For VM id 560, which host port forwards to the VM's SSH port 22?","o":["22","560","2560","8560","58560"],"a":2,"w":"2000 + ID (slide 11). 8560 → 80 and 58560 → 8000."},{"id":"dwa-122","mod":"dwa","src":"Q122","wk":["1"],"off":false,"m":null,"t":"mcq","s":"What does <code>ssh -N -L 9999:myserver:2560 you@doc.gold.ac.uk<\/code> set up?","o":["A web server on 9999","A tunnel: local port 9999 on your computer forwards to myserver port 2560 (your VM's SSH)","A VPN","A reverse proxy on the VM","A MySQL connection"],"a":1,"w":"Then <code>ssh -p9999 you@localhost<\/code> (slides 16–17)."},{"id":"dwa-123","mod":"dwa","src":"Q123","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which part of the VM guide is a slide error?","o":["HTTP is port 80","SSH is port 22","MySQL is port 3302","HTTPS is port 443","Custom apps often use 8000"],"a":2,"w":"MySQL is 3306 (L03 slide 60; the cheat sheet's 3306/3307)."},{"id":"dwa-124","mod":"dwa","src":"Q124","wk":["1"],"off":false,"m":null,"t":"card","s":"Give the four ways the guide lists to SSH into your VM, and which ones work off campus.","back":"<p>Browser (<code>/ssh/&lt;ID&gt;/<\/code>, anywhere) · direct <code>-p 2000+ID<\/code> (Goldsmiths network only) · via <code>doc.gold.ac.uk<\/code>, one step (<code>ssh -t … myserver ssh &lt;ID&gt;<\/code>) or two steps (anywhere) · the 9999 tunnel (anywhere).<\/p>"},{"id":"dwa-125","mod":"dwa","src":"Q125","wk":["3"],"off":false,"m":null,"t":"mcq","s":"According to the lecturer, when is a flat file (JSON or CSV) still a reasonable choice?","o":["Never in a web app","When the data is small and sensibly structured, e.g. a first version (MVP)","Only for images","When many users write at once","Only in Excel"],"a":1,"w":"\"If you've got a sensible enough structure and you don't have too much data, there's nothing wrong with a flat file hierarchy\" (pt1 l.126, 138). Not Excel (l.130)."},{"id":"dwa-126","mod":"dwa","src":"Q126","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What did the lecturer call \"the main\" responsibility of a DBMS?","o":["Indexing","Query compilation","Data integrity enforcement","Crash recovery","Backups"],"a":2,"w":"(pt1 l.254–256.)"},{"id":"dwa-127","mod":"dwa","src":"Q127","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which statement matches what the lecturer said about primary keys and UNIQUE?","o":["Every UNIQUE column is a primary key","All primary keys are unique, but not all unique columns are primary keys","A primary key may contain duplicates if it's composite","UNIQUE columns can't be text","A table can have two primary keys"],"a":1,"w":"e.g. <code>genres.name<\/code> is UNIQUE but not the PK (pt1 l.982)."},{"id":"dwa-128","mod":"dwa","src":"Q128","wk":["3"],"off":false,"m":null,"t":"mcq","s":"You add record 4 to a table with an auto-increment PK, delete it, then add a new record. What ID does the lecturer say it gets?","o":["4","5","0","NULL","An error"],"a":1,"w":"\"You'd be missing record four. That can be counterintuitive\" (pt1 l.628–632). (In SQLite that's guaranteed with the <code>AUTOINCREMENT<\/code> keyword.)"},{"id":"dwa-129","mod":"dwa","src":"Q129","wk":["3"],"off":false,"m":null,"t":"mcq","s":"How far does the lecturer take normalisation for this course?","o":["1NF","2NF","3NF","BCNF","5NF"],"a":2,"w":"\"For this course third normal form is ideal. That's all we need.\" BCNF exists but is out of scope (pt2 l.568–576)."},{"id":"dwa-130","mod":"dwa","src":"Q130","wk":["3"],"off":false,"m":null,"t":"mcq","s":"What habit did the lecturer recommend before running <code>DELETE FROM books WHERE id = 2;<\/code>?","o":["Back up the whole server","Run <code>SELECT * FROM books WHERE id = 2;<\/code> first and eyeball the result","Turn off foreign keys","Use DROP instead","Run it twice"],"a":1,"w":"\"There's no safety net here, so you have to create your own\" (pt2 l.832–844)."},{"id":"dwa-131","mod":"dwa","src":"Q131","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why does the lecturer say RESTRICT is a sensible default ON DELETE policy?","o":["It's the fastest","It deletes children automatically","Refusing by default is defensive coding: rules must be met before anything is processed","It sets FKs to NULL","It's the only one SQLite supports"],"a":2,"w":"\"Say no is a default way to go… That's resilient code. That's defensive coding\" (pt2 l.288–296)."},{"id":"dwa-132","mod":"dwa","src":"Q132","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The lecturer's story about hashed software licence keys being reverse engineered into key generators illustrates which idea?","o":["Defence in depth","Security by obscurity","Least privilege","Non-repudiation","Availability"],"a":1,"w":"(pt2 l.182–192.) It breaks the <strong>open design<\/strong> principle (NSS)."},{"id":"dwa-133","mod":"dwa","src":"Q133","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which of these did the lecturer say is <strong>out of scope<\/strong> for this course?","o":["Foreign keys","WHERE vs HAVING","B-tree index fragmentation","ON DELETE CASCADE","3NF"],"a":2,"w":"\"Not particularly relevant for the scope of this course\" (pt2 l.198)."},{"id":"dwa-134","mod":"dwa","src":"Q134","wk":["3"],"off":false,"m":null,"t":"card","s":"What did the lecturer ask level 6 students to do in the week 3 lab, and what did he warn about it?","back":"<p>\"Have a go at Postgres and MySQL today\" (Lab 3 Part E) (pt2 l.1108). Both are \"pretty tricky to set up\" (l.1060), and the auto-increment syntax differs, which breaks copy-pasted SQL (l.758–764).<\/p>"},{"id":"fyp-1","mod":"fyp","src":"Q1","t":"card","g":"Viva","s":"What is the most significant contribution of your project?","back":"<p>No model answer: this one is about your project. Say it out loud with PREP (point, reason, example, point), then check it against your evidence.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-2","mod":"fyp","src":"Q2","t":"card","g":"Viva","s":"Why did you choose this particular methodology?","back":"<p>No model answer: this one is about your project. Say it out loud with PREP (point, reason, example, point), then check it against your evidenc

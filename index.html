wer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-31","mod":"fyp","src":"Q31","t":"card","g":"Build phase","s":"What is the one feature that best proves the idea works?","back":"<p>No model answer: answer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-32","mod":"fyp","src":"Q32","t":"card","g":"Build phase","s":"If someone cloned my repo today, what would they need to run it?","back":"<p>No model answer: answer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-33","mod":"fyp","src":"Q33","t":"card","g":"Build phase","s":"What might go wrong if a marker followed my instructions exactly?","back":"<p>No model answer: answer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-34","mod":"fyp","src":"Q34","t":"card","g":"Build phase","s":"What is real functionality, and what is still presentation only?","back":"<p>No model answer: answer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-35","mod":"fyp","src":"Q35","t":"card","g":"Build phase","s":"If I had 90 seconds to prove the value of my project, what would I show?","back":"<p>No model answer: answer it honestly for where your project is today.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-36","mod":"fyp","src":"Q36","t":"card","g":"Method checks","s":"What are the FA1 deadline and length, and what is the deadline conflict?","back":"<p>1,500–2,000 words (excluding references and supporting material), A–F progress grade. Deadline: Mon 9 Nov 2026 (header, VLE) vs Fri 6 Nov 2026 (the brief's checklist, both guides). Unresolved; aim for 6 Nov.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-37","mod":"fyp","src":"Q37","t":"card","g":"Method checks","s":"How is the final mark calculated?","back":"<p>Raw /10 per area: Design ×2 + Technical ×4 + Testing ×1 + Written Documentation &amp; Exhibition ×3 = /100. The viva has no separate percentage.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-38","mod":"fyp","src":"Q38","t":"card","g":"Method checks","s":"What happens if you skip the exhibition?","back":"<p>The final grade can't be finalised. The poster and presentation are mandatory and marked inside the 30% area.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-39","mod":"fyp","src":"Q39","t":"card","g":"Method checks","s":"Give the PoV template and one HMW for it.","back":"<p>[User] needs [need] because [insight]; e.g. \"How might we…?\" questions derived from it.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-40","mod":"fyp","src":"Q40","t":"card","g":"Method checks","s":"Functional or non-functional: \"The system shall encrypt stored passwords\"?","back":"<p>Non-functional (security), though it can also be phrased as a functional constraint; FA1 lists security under non-functional.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-41","mod":"fyp","src":"Q41","t":"card","g":"Method checks","s":"Which DFD connections are illegal?","back":"<p>Entity–entity, entity–store, store–store.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-42","mod":"fyp","src":"Q42","t":"card","g":"Method checks","s":"«include» vs «extend»?","back":"<p>Include: mandatory shared behaviour, base → included. Extend: optional behaviour, extension → base.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-43","mod":"fyp","src":"Q43","t":"card","g":"Method checks","s":"What makes an artefact \"working\" for a marker?","back":"<p>At least one meaningful feature works end-to-end and can be run, tested or demonstrated; behaviour over appearance.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-44","mod":"fyp","src":"Q44","t":"card","g":"Method checks","s":"What must an AI-use declaration contain under the module's \"Partial\" policy?","back":"<p>The AI system(s), the specific use, the prompts used, and how the output was used.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-45","mod":"fyp","src":"Q45","t":"card","g":"Method checks","s":"Name the six stages of Gibbs' cycle.","back":"<p>Description, Feelings, Evaluation, Analysis, Conclusion, Action plan.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-46","mod":"fyp","src":"Q46","t":"card","g":"Method checks","s":"IMRaD: where does interpretation go?","back":"<p>Discussion, not Results.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-47","mod":"fyp","src":"Q47","t":"card","g":"Method checks","s":"In the week 2 lecture, why did the MyCode activation code count as a design failure?","back":"<p>16 characters of digits, letters and symbols is secure \"for computer scientists\" but \"a nightmare\" for real users: security designed without empathy (L02 §9.3).<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-48","mod":"fyp","src":"Q48","t":"card","g":"Method checks","s":"Contrast the \"quick solution\" and the design-thinking answer to \"I can't get a haircut at the weekend\".","back":"<p>Quick: an \"Uber for barbers\" that comes to your house. Empathy-led: the user wants speed, not a visit, so book a barber's seat and a barber to meet you there (L02 §9.5).<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-49","mod":"fyp","src":"Q49","t":"card","g":"Method checks","s":"What is a journey map, and how did the airport example turn it into ideas?","back":"<p>\"A description of the steps that take place for something to happen\", revealing how people feel at each step. The worst step (queues) and the step <em>before<\/em> the airport (dragging the case) each gave software ideas: ticketing, self bag-drop, home bag collection.<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-50","mod":"fyp","src":"Q50","t":"card","g":"Method checks","s":"Pitch check: state your idea as \"How might we X?\" + \"I propose Y\". What must each half contain?","back":"<p>HMW: a user and a need, not a technology. I propose: a concrete software artefact that answers it (week 2 task; point of view and how might we).<\/p>","wk":[],"off":false,"m":null},{"id":"fyp-51","mod":"fyp","src":"Q51","t":"card","g":"Method checks","s":"Define is \"the top level of your software engineering specification\". What does that mean for FA1?","back":"<p>The problem statement comes before requirements and the solution: FA1's Problem &gt; Research &gt; Needs &gt; Requirements &gt; Solution chain (L02 §9.11, fyp fa1 brief).<\/p>","wk":[],"off":false,"m":null}],"log":[{"date":"2026-10-07","mod":"nss","topic":"Week 1 part 1, chunks 1–2 (CIA, FIPS 199, passive vs active)","n":3,"of":6,"score":"3/6","official":false,"mock":false},{"date":"2026-10-07","mod":"nss","topic":"Week 1 part 1, chunk 3 (X.800 vs RFC 4949, mechanisms, threat vs attack)","n":1,"of":3,"score":"1/3","official":false,"mock":false},{"date":"2026-10-07","mod":"nss","topic":"Recap of the weak spots (3 fresh questions)","n":3,"of":3,"score":"3/3","official":false,"mock":false},{"date":"2026-10-09","mod":"nss","topic":"Week 1 part 2: X.800 security services (incl. 2 warm-up re-tests)","n":8,"of":13,"score":"8/13","official":false,"mock":false},{"date":"2026-10-09","mod":"nss","topic":"Design principles 1–8, re-teach, separation vs least privilege","n":6,"of":9,"score":"6/9","official":false,"mock":false},{"date":"2026-10-09","mod":"nss","topic":"Design principles 9–13","n":5,"of":5,"score":"5/5","official":false,"mock":false},{"date":"2026-10-10","mod":"nss","topic":"<strong>Official Learn week 1 quiz<\/strong>, 2nd attempt (15 Qs, 4 options, 22 min)","n":13,"of":15,"score":"<strong>13/15 (86.67%)<\/strong>","official":true,"mock":false},{"date":"2026-10-10","mod":"nss","topic":"The 2 Learn misses explained (2/2) + old weak spots re-tested (5/7)","n":7,"of":9,"score":"7/9","official":false,"mock":false},{"date":"2026-10-11","mod":"nss","topic":"Weak spots + attack trees, then attack surface (surface × depth matrix 3/3 after a fix)","n":6,"of":7,"score":"6/7","official":false,"mock":false},{"date":"2026-10-11","mod":"nss","topic":"Weak-spots round (10 fresh 5-option MCQs; 1 follow-up right)","n":9,"of":10,"score":"9/10","official":false,"mock":false},{"date":"2026-10-12","mod":"nss","topic":"Week 1 finish: origin vs nonrepudiation warm-up, NIST definition + 10 challenges, 8 motives + threat scenarios, authenticity vs accountability + H/M/L, Lab 01 incidents","n":10,"of":14,"score":"<strong>10/14<\/strong>","official":false,"mock":false},{"date":"2026-10-12","mod":"nss","topic":"Data-state sort after the re-teach (transit / rest / use, open answers)","n":3,"of":3,"score":"3/3","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"NCSC: 10 Steps + CAF (taught, then checked)","n":6,"of":6,"score":"<strong>6/6<\/strong>","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"Data states: MCQs 0/3, open sort states 3/3, names 1/2, closed-book 1/2","n":5,"of":10,"score":"5/10","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"Network stack: 4/4 open-book (looked back), closed-book 1/6, then 2/2 after the first-letter fix","n":3,"of":8,"score":"3/8 closed-book","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"Day in the life (DHCP, ARP, DNS, order) + 3-way handshake + SYN flood","n":9,"of":11,"score":"<strong>9/11<\/strong>","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"Security at each layer, symmetric vs asymmetric, which key does what, hashing + 2 re-tests (router reads IP, side channel)","n":11,"of":12,"score":"<strong>11/12<\/strong>","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"PGP: 5 services + order, which key does what, why compress, key ID, key rings, web of trust","n":11,"of":15,"score":"<strong>11/15<\/strong>","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"IPsec: why IPsec, transport vs tunnel, AH vs ESP, SA, IKE, SAD/SPD one-liners","n":9,"of":10,"score":"<strong>9/10<\/strong>","official":false,"mock":false},{"date":"2026-10-13","mod":"nss","topic":"<strong>Test 1 mock<\/strong> (20 five-option MCQs, weeks 1–2, closed-book, 30 min)","n":17,"of":20,"score":"<strong>17/20 (85%)<\/strong>","official":false,"mock":true},{"date":"2026-10-13","mod":"nss","topic":"Mock misses re-tested: PGP order ✅, FIPS 199 ✅, side channel 1/2 (CPU sound ❌, power ✅)","n":3,"of":4,"score":"3/4","official":false,"mock":true},{"date":"2026-10-14","mod":"nss","topic":"<strong>Official Learn Week 2 Recap Quiz<\/strong> (12 Qs: 3–4 options, T/F, 2 short answers; 5 min 45 s, rushed)","n":5,"of":12,"score":"<strong>5/12 (41.67%)<\/strong>","official":true,"mock":false}],"built":"2026-10-18T11:35","public":true};</script>
<script>(() => {
  "use strict";

  const D = window.UNI;
  const S = D.site;
  const MODS = S.modules;
  const ORDER = ["nss", "dwa", "fyp", "certs"];
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const main = $("#main");
  const pop = $("#pop");

  // ------------------------------------------------------------ storage (private windows can throw)
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem("uni." + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem("uni." + key, JSON.stringify(value)); } catch (e) { /* storage unavailable: the page still works */ }
    },
  };

  // ------------------------------------------------------------ text
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
  const strip = (h) => String(h).replace(/<[^>]+>/g, "");

  // ------------------------------------------------------------ dates
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MOL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const TODAY = (() => {
    const q = new URLSearchParams(location.search).get("today");
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return parse(q);
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  })();
  const days = (a, b) => Math.round((b - a) / 864e5);
  const short = (d) => `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
  const longDate = (d) => `${WDL[d.getDay()]} ${d.getDate()} ${MOL[d.getMonth()]}`;
  const until = (n) => (n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `${n} days` : `${-n} days ago`);
  const inDays = (n) => (n === 0 ? "today" : n === 1 ? "tomorrow" : n > 0 ? `in ${n} days` : `${-n} days ago`);

  const WEEKS = S.term.weeks.map((w, i, all) => ({
    ...w,
    from: parse(w.start),
    to: i < all.length - 1 ? parse(all[i + 1].start) : new Date(parse(S.term.end).getTime() + 3 * 864e5),
  }));
  const weekNow = () => WEEKS.find((w) => TODAY >= w.from && TODAY < w.to) || null;
  const weekName = (k) => (k === "R" ? "Reading week" : `Week ${k}`);

  // ------------------------------------------------------------ question stats on this device
  const Q = D.questions;
  const QBY = Object.fromEntries(Q.map((q) => [q.id, q]));
  const stats = store.get("qstats", {});
  function record(q, ok) {
    const s = stats[q.id] || { r: 0, w: 0, streak: 0 };
    if (ok) { s.r += 1; s.streak = (s.streak || 0) + 1; } else { s.w += 1; s.streak = 0; s.miss = iso(new Date()); }
    stats[q.id] = s;
    store.set("qstats", stats);
  }
  // A miss clears after two right answers in a row on this device.
  const isMissed = (q) => (q.m || (stats[q.id] && stats[q.id].w > 0)) && !(stats[q.id] && stats[q.id].streak >= 2);
  const missedLabel = (q) => (stats[q.id] && stats[q.id].miss && stats[q.id].streak < 2 && !q.m ? "on this device" : q.m ? (q.m.match(/^\d/) ? `on ${q.m}` : `in ${q.m}`) : "");

  // ------------------------------------------------------------ shared builders
  const bub = (cls, label = "", attrs = "") => `<span class="bub ${cls}" ${attrs}>${label}</span>`;
  function bubRow(done, total) {
    let h = "";
    for (let i = 0; i < total; i += 1) h += bub(i < done ? "is-done" : "", "", `style="--i:${i}"`);
    return `<div class="bubrow" aria-hidden="true">${h}</div>`;
  }
  function footer() {
    const built = new Date(D.built);
    return `<footer class="foot"><p>Built from your study wiki on ${short(built)} at ${pad(built.getHours())}:${pad(built.getMinutes())}. Dates and course facts come from the course files: anything not confirmed says <em>unknown</em>, <em>likely</em> or <em>sources conflict</em>.</p><p>Ticks, scores and dates update when Claude logs a session and rebuilds. Drills you do here are saved on this device only.</p></footer>`;
  }
  const modTag = (code) => (MODS[code] ? `<span class="tag">${esc(MODS[code].code)}</span>` : "");

  function upcoming() {
    return S.deadlines
      .map((d) => ({ ...d, from: parse(d.date), to: parse(d.end || d.alt || d.date) }))
      .filter((d) => d.to >= TODAY)
      .sort((a, b) => a.from - b.from);
  }
  function dateLabel(d) {
    if (d.alt) {
      const a = parse(d.date), b = parse(d.alt);
      return `${WD[a.getDay()]} ${a.getDate()}${a.getMonth() !== b.getMonth() ? " " + MO[a.getMonth()] : ""} or ${short(b)}`;
    }
    if (d.end) return `${short(parse(d.date))} to ${short(parse(d.end))}`;
    return short(parse(d.date));
  }
  const SURE = { likely: "likely", expected: "expected", conflict: "sources conflict", either: "one of two dates" };

  function nextAssessment(code) {
    return upcoming().find((d) => d.module === code && d.kind === "assessment");
  }
  function mainWork(code) {
    return MODS[code].work.find((w) => w.total) || null;
  }
  function moduleSummary(code) {
    const m = MODS[code];
    const parts = [];
    const res = (m.results || []).find((r) => r.score != null);
    if (res) parts.push(`<strong>${esc(res.label)}: ${res.score}/${res.of}</strong>`);
    const w = mainWork(code);
    if (w && !res) parts.push(`<strong>${esc(w.title.split(":")[0])}: ${w.doneCount} of ${w.total} steps</strong>`);
    const n = nextAssessment(code);
    if (n) parts.push(`${esc(n.title)} ${inDays(days(TODAY, n.from))}${n.sure ? ` (${SURE[n.sure]})` : ""}`);
    return parts.join(". ") + (parts.length ? "." : "");
  }

  // ------------------------------------------------------------ the answer sheet (term grid)
  function stateOf(code, w) {
    const wk = MODS[code].weeks[w.key];
    if (!wk) return w.from > TODAY ? "is-future" : "is-quiet";
    if (wk.state === "done") return "is-done";
    if (wk.state === "part") return "is-part";
    if (wk.state === "todo") return "is-todo";
    return w.from > TODAY ? "is-future" : "is-todo";
  }
  function answerSheet() {
    const now = weekNow();
    const codes = ["nss", "dwa", "fyp"];
    let i = 0;
    const head = WEEKS.map((w) => `<th scope="col" class="${now && now.key === w.key ? "now" : ""}">${w.key === "R" ? "RW" : w.key}${now && now.key === w.key ? '<span class="vh"> (this week)</span>' : ""}</th>`).join("");
    const rows = codes.map((code) => {
      const cellsHtml = WEEKS.map((w) => {
        const wk = MODS[code].weeks[w.key] || {};
        const cls = stateOf(code, w) + (wk.weak ? " is-weak" : "");
        const label = `${MODS[code].code} ${weekName(w.key)}${wk.topic ? ": " + wk.topic : ""}`;
        return `<td class="wk${now && now.key === w.key ? " now" : ""}"><button type="button" class="wk-btn" data-wk="${code}:${w.key}" aria-label="${esc(label)}" aria-haspopup="dialog">${bub(cls, w.key === "R" ? "–" : w.key, `style="--i:${i++}"`)}</button>${wk.mark ? `<span class="wk-mark">${esc(wk.mark)}</span>` : ""}</td>`;
      }).join("");
      return `<tr><th scope="row"><a href="#/m/${code}">${MODS[code].code}</a></th>${cellsHtml}<td class="sum">${moduleSummary(code)}</td></tr>`;
    }).join("");
    const sums = codes.map((c) => `<p><strong>${MODS[c].code}</strong>: ${moduleSummary(c)}</p>`).join("");
    return `<section class="answer" aria-labelledby="as-h">
      <div class="answer-head"><h2 id="as-h">${esc(S.term.name)}, week by week</h2>
        <div class="legend" aria-hidden="true"><span>${bub("is-done")} done</span><span>${bub("is-part")} started</span><span>${bub("is-todo")} not started</span><span>${bub("is-future")} coming up</span><span>${bub("is-weak")} weak spot</span></div></div>
      <div class="grid-scroll"><table class="sheet-table pre-fill"><thead><tr><th><span class="vh">Module</span></th>${head}<th><span class="vh">Summary</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row-sums">${sums}</div>
    </section>`;
  }
  function weekPop(code, key, anchor) {
    const m = MODS[code];
    const wk = m.weeks[key] || {};
    const w = WEEKS.find((x) => x.key === key);
    const date = wk.date ? short(parse(wk.date)) : short(w.from);
    const html = `<h3>${esc(m.code)} ${esc(weekName(key))}</h3><p class="muted">${esc(date)}${wk.topic ? ": " + esc(wk.topic) : ""}</p>
      ${wk.note ? `<p>${rich(wk.note)}</p>` : `<p class="muted">${w.from > TODAY ? "Not taught yet." : "Nothing logged for this week yet."}</p>`}
      ${wk.markNote ? `<p><strong>${esc(wk.markNote)}</strong></p>` : ""}
      <a class="btn btn-line" href="#/m/${code}">Open ${esc(m.code)}</a>`;
    openPop(anchor, html);
  }

  // ------------------------------------------------------------ popover
  let popAnchor = null;
  function openPop(anchor, html) {
    closePop();
    pop.innerHTML = html;
    pop.hidden = false;
    popAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2 + window.scrollX), window.scrollX + document.documentElement.clientWidth - w - 16);
    pop.style.left = `${left}px`;
    pop.style.top = `${r.bottom + window.scrollY + 10}px`;
    requestAnimationFrame(() => pop.classList.add("is-open"));
  }
  function closePop() {
    if (pop.hidden) return;
    pop.classList.remove("is-open");
    pop.hidden = true;
    if (popAnchor) popAnchor.setAttribute("aria-expanded", "false");
    popAnchor = null;
  }
  document.addEventListener("click", (e) => {
    const wkBtn = e.target.closest("[data-wk]");
    if (wkBtn) {
      if (popAnchor === wkBtn) { closePop(); return; }
      const [code, key] = wkBtn.dataset.wk.split(":");
      weekPop(code, key, wkBtn);
      return;
    }
    if (!e.target.closest("#pop")) closePop();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !pop.hidden) { const a = popAnchor; closePop(); if (a) a.focus(); }
  });

  // ------------------------------------------------------------ Today
  function heroTask() {
    const done = store.get("done", {});
    return S.tasks
      .map((t) => ({ ...t, n: days(TODAY, parse(t.date)) }))
      .filter((t) => t.n >= 0 && t.n <= 3 && !done[t.date + t.title])
      .sort((a, b) => a.n - b.n)[0];
  }
  function missedPool(code) {
    return Q.filter((q) => (!code || q.mod === code) && q.t === "mcq" && isMissed(q));
  }
  const minutes = (n, mode) => Math.max(1, Math.round(n * (mode === "cards" ? 0.5 : 0.75)));

  function viewToday() {
    const now = weekNow();
    const task = heroTask();
    const missed = missedPool("nss").length ? missedPool("nss") : missedPool();
    const drillMod = missedPool("nss").length ? "nss" : missed[0] ? missed[0].mod : "nss";
    const drillN = Math.min(10, missed.length || 10);
    const drillHref = `#/drill?mod=${drillMod}&mode=${missed.length ? "missed" : "mixed"}&n=${drillN}&go=1`;
    const nextDue = upcoming().find((d) => d.kind === "assessment" || d.kind === "task");

    let weekLine = "";
    if (now) {
      weekLine = `${weekName(now.key)}`;
      const nxt = WEEKS[WEEKS.indexOf(now) + 1];
      if (nxt && days(TODAY, nxt.from) === 1) weekLine += ` ends today. ${weekName(nxt.key)} starts tomorrow`;
    } else if (TODAY < WEEKS[0].from) weekLine = "Term starts soon";
    else weekLine = "Term 1 teaching has finished";

    let hero;
    if (task) {
      const when = task.n === 0 ? "Due today" : task.n === 1 ? "Due tomorrow" : `Due ${short(parse(task.date))}, in ${task.n} days`;
      hero = `<section class="hero" aria-labelledby="hero-h">
        <p class="when">${modTag(task.module)} ${esc(when)}</p>
        <h1 id="hero-h"><span class="hl">${esc(task.title)}</span></h1>
        <p class="lead">${rich(task.detail)}</p>
        <div class="btn-row"><a class="btn btn-ink" href="${esc(task.link)}">Open ${esc(MODS[task.module].code)} progress</a>
        <button class="btn btn-line" type="button" data-done="${esc(task.date + task.title)}">Mark as done on this device</button></div>
      </section>`;
    } else {
      hero = `<section class="hero" aria-labelledby="hero-h">
        <p class="when">Nothing due in the next three days</p>
        <h1 id="hero-h"><span class="hl">Re-test what you got wrong</span></h1>
        <p class="lead">${missed.length ? `${plural(missed.length, "question")} you've missed are in the pool.` : "No misses logged yet."} A ${drillN}-question drill takes about ${minutes(drillN)} minutes.${nextDue ? ` Next deadline: ${esc(nextDue.title)}, ${esc(dateLabel(nextDue))} (${until(days(TODAY, nextDue.from))}${nextDue.sure ? ", " + SURE[nextDue.sure] : ""}).` : ""}</p>
        <div class="btn-row"><a class="btn btn-ink" href="${drillHref}">Start ${drillN} questions</a><a class="btn btn-line" href="#/drill">Choose a different drill</a></div>
      </section>`;
    }

    const up = upcoming();
    const firstN = 8;
    const dueRows = up.map((d, idx) => {
      const n = days(TODAY, d.from);
      const soon = (d.kind === "assessment" || d.kind === "task") && n >= 0 && n <= 7;
      const meta = [d.module !== "all" ? modTag(d.module) : "", d.weight ? `<span class="tag tag-soft">${esc(d.weight)}</span>` : "", d.sure ? `<span>${esc(SURE[d.sure])}</span>` : "", d.note ? `<span>${esc(d.note)}</span>` : ""].filter(Boolean).join("");
      const a = d.from;
      return `<li class="due is-${esc(d.kind)}"${idx >= firstN ? " hidden" : ""}>
        <div class="due-date"><span>${WD[a.getDay()]}</span><b>${a.getDate()} ${MO[a.getMonth()]}</b></div>
        <div><p class="due-title">${esc(d.title)}${d.alt ? ` <span class="muted">(${esc(dateLabel(d))})</span>` : ""}</p>${meta ? `<div class="due-meta">${meta}</div>` : ""}</div>
        <div class="due-left${soon ? " soon" : ""}">${n < 0 ? "on now" : until(n)}</div></li>`;
    }).join("");

    const weak = S.weak.map((w) => `<li><a href="#/m/${w.module}/revise?trap=${w.trap}">
        <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px">${bub("is-red", String(w.trap))}
        <div><p class="weak-t">${esc(w.title)}</p><p class="weak-h">${esc(w.hook)}</p><p class="weak-m">Missed ${esc(w.missed)}</p></div></div></a></li>`).join("");

    const recent = D.log.slice(-5).reverse().map(sessionRow).join("");

    main.innerHTML = `
      <p class="eyebrow">${esc(longDate(TODAY))}. ${esc(weekLine)}.</p>
      <div style="margin-top:var(--s3)">${hero}</div>
      ${answerSheet()}
      <div class="today-grid">
        <section aria-labelledby="up-h">
          <div class="block-head"><h2 class="section-title" id="up-h">Coming up</h2><p>Days left are counted from today.</p></div>
          <ul class="ruled" id="due-list">${dueRows}</ul>
          ${up.length > firstN ? `<button class="btn btn-quiet" type="button" data-more style="margin-top:var(--s3)">Show all ${up.length} dates</button>` : ""}
        </section>
        <aside aria-labelledby="weak-h">
          <div class="block-head"><h2 class="section-title" id="weak-h">Re-test these first</h2></div>
          <ul class="ruled weak">${weak}</ul>
          <div class="drill-card">
            <h3>Drill your misses</h3>
            <p>${missed.length ? `${plural(missed.length, "question")} you've got wrong before. Two right answers in a row clears one.` : "Nothing missed yet. A mixed drill finds your weak spots."}</p>
            <a class="btn btn-ink" href="${drillHref}">Start ${drillN} questions, about ${minutes(drillN)} min</a>
          </div>
        </aside>
      </div>
      <section class="block" aria-labelledby="rec-h">
        <div class="block-head"><h2 class="section-title" id="rec-h">Latest sessions</h2><a class="btn btn-quiet" href="#/log">Open the full log</a></div>
        <ul class="ruled">${recent}</ul>
      </section>
      <p class="mark-note">${esc(S.term.next)}</p>
      ${footer()}`;

    requestAnimationFrame(() => requestAnimationFrame(() => { const t = $(".sheet-table"); if (t) t.classList.remove("pre-fill"); }));
    const more = $("[data-more]");
    if (more) more.addEventListener("click", () => { $$("#due-list li[hidden]").forEach((li) => { li.hidden = false; }); more.remove(); });
    const doneBtn = $("[data-done]");
    if (doneBtn) doneBtn.addEventListener("click", () => { const d = store.get("done", {}); d[doneBtn.dataset.done] = true; store.set("done", d); render(); });
  }

  function sessionRow(s, withDate = true, hidden = false) {
    const pct = s.n != null && s.of ? Math.round((s.n / s.of) * 100) : null;
    const d = parse(s.date);
    return `<li class="sess${withDate ? "" : " no-date"}"${hidden ? " hidden" : ""}>
      <span class="sess-date">${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}</span>
      <p class="sess-topic">${modTag(s.mod)}${s.topic}</p>
      <div class="score">${pct != null ? `<b class="${s.official ? "official" : ""}">${s.n}/${s.of}</b><span class="bar" title="${pct}%. The mark at 90% is the mock target"><i style="--w:${Math.min(100, pct)}%"></i></span><span class="vh">${pct}%</span>` : `<b>${s.score}</b>`}</div>
    </li>`;
  }

  // ------------------------------------------------------------ Modules index (phone tab)
  function viewModules() {
    const rows = ORDER.map((code) => {
      const m = MODS[code];
      const w = mainWork(code);
      const qn = Q.filter((q) => q.mod === code).length;
      const n = nextAssessment(code);
      return `<li style="padding:18px 0"><a href="#/m/${code}" style="text-decoration:none;display:grid;gap:6px">
        <span class="mod-code">${bub(m.code.length > 3 ? "wide" : "", esc(m.code))}<span style="font:600 var(--fs-21)/1.2 var(--serif)">${esc(m.name)}</span></span>
        <span class="muted" style="font-size:var(--fs-14)">${n ? `${esc(n.title)}: ${esc(dateLabel(n))} (${until(days(TODAY, n.from))}${n.sure ? ", " + SURE[n.sure] : ""})` : esc(m.markNote)}</span>
        ${w ? `<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${bubRow(w.doneCount, w.total)}<span class="count"><strong>${w.doneCount}</strong> of ${w.total} steps in ${esc(w.title.split(":")[0])}</span></span>` : ""}
        ${qn ? `<span class="count">${qn} practice questions</span>` : ""}</a></li>`;
    }).join("");
    main.innerHTML = `<div class="mod-head"><p class="eyebrow">${esc(S.term.name)}</p><h1>Modules</h1></div>
      <ul class="ruled" style="margin-top:var(--s5)">${rows}</ul>${footer()}`;
  }

  // ------------------------------------------------------------ module pages
  function viewModule(code, sub, q) {
    const m = MODS[code];
    const hasRevise = !!document.getElementById(`tpl-${code}-revise`) || code === "certs";
    const hasSheet = !!document.getElementById(`tpl-${code}-sheet`);
    if ((sub === "revise" && !hasRevise) || (sub === "sheet" && !hasSheet)) sub = "progress";
    const qn = Q.filter((x) => x.mod === code).length;
    const seg = [["progress", "Progress"], hasRevise && code !== "certs" ? ["revise", "Revise"] : null, hasSheet ? ["sheet", "Cheat sheet"] : null]
      .filter(Boolean)
      .map(([k, label]) => `<a href="#/m/${code}${k === "progress" ? "" : "/" + k}"${sub === k ? ' aria-current="page"' : ""}>${label}</a>`).join("");
    let body = "";
    if (sub === "revise") body = reviseView(code, q);
    else if (sub === "sheet") body = sheetView(code);
    else body = progressView(code);
    main.innerHTML = `
      <header class="mod-head">
        <span class="mod-code">${bub(m.code.length > 3 ? "wide" : "", esc(m.code))}<span class="eyebrow">${esc(m.who)}. ${esc(m.slot)}.</span></span>
        <h1>${esc(m.name)}</h1>
        <p class="mod-depth">${esc(m.depth)}</p>
      </header>
      <div class="subnav">${seg.split("</a>").length > 2 ? `<nav class="seg" aria-label="${esc(m.code)} pages">${seg}</nav>` : "<span></span>"}
        ${qn ? `<a class="btn btn-line" href="#/drill?mod=${code}">Drill ${esc(m.code)}: ${qn} questions</a>` : ""}</div>
      <div id="sub">${body}</div>
      ${footer()}`;
    if (sub === "revise") wireRevise(code, q);
    if (sub === "sheet") wireSheet();
    if (sub === "progress") {
      requestAnimationFrame(() => $$(".pre-fill", main).forEach((el) => el.classList.remove("pre-fill")));
      const more = $("[data-more-scores]");
      if (more) more.addEventListener("click", () => { $$("#score-list li[hidden]").forEach((li) => { li.hidden = false; }); more.remove(); });
    }
  }

  function progressView(code) {
    const m = MODS[code];
    let html = "";
    if (m.marks.length) {
      const segs = m.marks.map((k) => `<span style="flex-grow:${k.pct}" title="${esc(k.label)} ${k.pct}%"></span>`).join("");
      const list = m.marks.map((k) => `<div><b>${k.pct}%</b><span class="k">${esc(k.label)}</span><p>${rich(k.note)}</p></div>`).join("");
      html += `<section class="block" aria-labelledby="marks-h"><h2 class="section-title" id="marks-h">Where the marks are</h2>
        <div class="marks-bar" aria-hidden="true">${segs}</div><div class="marks-list">${list}</div><p class="mark-note">${rich(m.markNote)}</p>`;
      if (m.results.length) {
        html += `<div class="results">${m.results.map((r) => r.score != null ? `<div class="result"><div><span class="result-score circled">${r.score}</span></div><div><p><strong>${esc(r.label)}: ${r.score}/${r.of}</strong>, result ${esc(short(parse(r.date)))}</p>
          <div class="vs"><span class="bar"><i style="--w:${Math.round((r.score / r.of) * 100)}%"></i></span><span>target 80+</span></div><p>${rich(r.note || "")}</p></div></div>`
          : `<div class="result"><div><span class="result-score muted">?</span></div><div><p><strong>${esc(r.label)}</strong></p><p>${rich(r.pending)}</p></div></div>`).join("")}</div>`;
      }
      html += `</section>`;
    } else if (m.markNote) {
      html += `<p class="lead block">${rich(m.markNote)}</p>`;
    }

    const work = m.work.map((w, idx) => workItem(w, idx === 0)).join("");
    const weekKeys = Object.keys(m.weeks);
    const now = weekNow();
    const weeks = WEEKS.filter((w) => m.weeks[w.key]).map((w) => {
      const wk = m.weeks[w.key];
      const cls = stateOf(code, w) + (wk.weak ? " is-weak" : "");
      return `<li class="${now && now.key === w.key ? "is-now" : ""}">${bub(cls, w.key === "R" ? "–" : w.key)}
        <p class="w-when"><b>${esc(weekName(w.key))}</b>${esc(short(parse(wk.date)))}${now && now.key === w.key ? "<br>this week" : ""}</p>
        <div class="w-body"><p class="w-topic">${esc(wk.topic || "")}${wk.mark ? ` <span class="tag">${esc(wk.mark)}</span>` : ""}</p>${wk.note ? `<p class="w-note">${rich(wk.note)}</p>` : ""}${wk.markNote ? `<p class="w-note"><strong>${esc(wk.markNote)}</strong></p>` : ""}</div></li>`;
    }).join("");

    html += `<div class="two-col block">
      <section aria-labelledby="work-h"><div class="block-head"><h2 class="section-title" id="work-h">${code === "certs" ? "Plan" : "Assessed work"}</h2>${m.work.some((w) => w.card) ? "<p>Ticks come from your progress cards.</p>" : ""}</div><div class="work">${work}</div></section>
      ${weekKeys.length ? `<section aria-labelledby="weeks-h"><div class="block-head"><h2 class="section-title" id="weeks-h">Week by week</h2></div><ul class="ruled weeks pre-fill">${weeks}</ul></section>` : ""}
    </div>`;

    const log = D.log.filter((s) => s.mod === code);
    if (log.length) {
      const scored = log.filter((s) => s.n != null);
      const mocks = scored.filter((s) => s.mock);
      const best = mocks.sort((a, b) => b.n / b.of - a.n / a.of)[0];
      html += `<section class="block" aria-labelledby="sc-h"><div class="block-head"><h2 class="section-title" id="sc-h">Scores</h2>
        <p>${plural(log.length, "session")} logged.${best ? ` Best mock ${best.n}/${best.of} (${Math.round((best.n / best.of) * 100)}%).` : ""} The mark on each bar is the 90% mock target.</p></div>
        <ul class="ruled" id="score-list">${log.slice().reverse().map((s, k) => sessionRow(s, true, k >= 8)).join("")}</ul>
        ${log.length > 8 ? `<button class="btn btn-quiet" type="button" data-more-scores style="margin-top:var(--s3)">Show all ${log.length} sessions</button>` : ""}</section>`;
    }
    if (m.unknown.length) {
      html += `<section class="block" aria-labelledby="unk-h"><div class="block-head"><h2 class="section-title" id="unk-h">Still unknown</h2><p>Ask the lecturer. Nothing here is guessed.</p></div>
        <ul class="unknowns">${m.unknown.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></section>`;
    }
    return html;
  }

  const STATUS = { "in-progress": "In progress", "not-started": "Not started", waiting: "Waiting", submitted: "Submitted", marked: "Marked" };
  function workItem(w, isMain) {
    let due = "";
    if (w.due) {
      const n = days(TODAY, parse(w.due));
      due = `<p class="work-due">Due <strong>${esc(short(parse(w.due)))}</strong>, ${until(n)}${w.weight ? `. Worth ${esc(w.weight)}` : ""}</p>`;
    } else if (w.dueNote) {
      due = `<p class="work-due">${esc(w.dueNote)}</p>`;
    } else if (w.weight) {
      due = `<p class="work-due">Worth ${esc(w.weight)}</p>`;
    }
    const doneList = (w.done || []).length ? `<ul class="done-list">${w.done.map((d) => `<li>${bub("is-done")}<span>${rich(d)}</span></li>`).join("")}</ul>` : "";
    const progress = w.total ? `<div style="display:grid;gap:8px"><div class="pre-fill">${bubRow(w.doneCount, w.total)}</div><p class="count"><strong>${w.doneCount}</strong> of ${w.total} checklist steps done</p></div>` : "";
    const checks = w.groups && w.groups.length ? `<details class="fold"><summary>Show the full checklist</summary><div class="checks">${w.groups.map((g) => `<div><h4>${g.name}</h4><ul>${g.items.map((it) => `<li class="chk${it.d ? " is-done" : ""}${it.sub ? " sub" : ""}"><span class="chk-b" aria-hidden="true"></span><span><span class="vh">${it.d ? "Done: " : "To do: "}</span>${it.t}</span></li>`).join("")}</ul></div>`).join("")}</div></details>` : "";
    return `<article class="work-item${isMain && w.due ? " is-main" : ""}">
      <div class="work-top"><h3>${esc(w.title)}</h3><span class="status s-${esc(w.status)}">${esc(STATUS[w.status] || w.status)}</span></div>
      ${due}${doneList}${progress}
      ${w.next ? `<p class="work-next"><b>Next:</b> ${rich(w.next)}</p>` : ""}
      ${checks}
    </article>`;
  }

  // revise
  const CHIP = {
    traps: "Traps", high: "High-yield", concepts: "Definitions", cia: "CIA", fips: "Impact levels", attacks: "Attacks", threats: "Motives + scenarios",
    incidents: "Real incidents", standards: "Standards", ncsc: "NCSC", services: "Services", principles: "Principles", surface: "Surface", trees: "Trees",
    stack: "Stack", dns: "Day in the life", layers: "Layers + keys", hashing: "Hashing", pgp: "PGP", ipsec: "IPsec", watch: "Watch out",
    marks: "Marks", milestones: "Milestones", viva: "Viva", meeting: "Supervision", topics: "All topics",
  };
  function reviseView(code) {
    const tpl = document.getElementById(`tpl-${code}-revise`);
    const holder = document.createElement("div");
    holder.appendChild(tpl.content.cloneNode(true));
    const m = MODS[code];
    if (m.topics && m.topics.length) {
      const ratings = store.get(`rate.${code}`, {});
      const items = m.topics.map((t, i) => `<li><div class="topic-t">${t.t}${t.stars ? `<span class="stars" aria-label="${t.stars} stars: the lecturer stressed it">${"★".repeat(t.stars)}</span>` : ""}<span class="topic-w">${t.where}${t.exam ? `. Examinable: ${t.exam}` : ""}</span></div>
        <div class="rate" role="group" aria-label="Your confidence, 0 to 5">${[0, 1, 2, 3, 4, 5].map((n) => `<button type="button" data-rate="${i}:${n}" aria-pressed="${ratings[i] === n}" aria-label="${n} out of 5">${n}</button>`).join("")}</div></li>`).join("");
      holder.insertAdjacentHTML("beforeend", `<section id="${code}-topics" class="rv"><div class="sec-head"><span class="label">${m.topics.length} topics from the revision sheet. ★ = the lecturer stressed it</span><h2>All topics: rate your confidence</h2>
        <p>Tap 0 to 5 for each. Your ratings stay on this device; copy them and paste them to Claude to log them in the wiki.</p></div>
        <div class="btn-row"><button class="btn btn-line" type="button" data-copy-rates>Copy my ratings</button><span class="count" id="rate-count"></span></div>
        <ul class="ruled topics">${items}</ul></section>`);
    }
    const ids = $$("section.rv", holder).map((s) => s.id);
    const chips = ids.map((id) => `<li><button type="button" class="chip" data-jump="${id}">${esc(CHIP[id.split("-").slice(1).join("-")] || id)}</button></li>`).join("");
    return `<nav class="chips" aria-label="Topics"><ul>${chips}</ul></nav>${holder.innerHTML}<div class="btn-row block"><a class="btn btn-ink" href="#/drill?mod=${code}">Drill ${esc(MODS[code].code)} now</a></div>`;
  }
  function wireRevise(code, q) {
    $$("[data-jump]", main).forEach((b) => b.addEventListener("click", () => {
      const el = document.getElementById(b.dataset.jump);
      if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }));
    const chipFor = (id) => $(`[data-jump="${id}"]`, main);
    const io = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          $$("[data-jump]", main).forEach((c) => c.classList.remove("is-on"));
          const c = chipFor(en.target.id);
          if (c) { c.classList.add("is-on"); c.scrollIntoView({ block: "nearest", inline: "nearest" }); }
        }
      });
    }, { rootMargin: "-90px 0px -70% 0px" }) : null;
    if (io) $$("section.rv", main).forEach((s) => io.observe(s));

    const ratings = store.get(`rate.${code}`, {});
    const countEl = $("#rate-count");
    const showCount = () => { if (countEl) countEl.textContent = `${Object.keys(ratings).length} of ${(MODS[code].topics || []).length} rated`; };
    showCount();
    main.addEventListener("click", (e) => {
      const r = e.target.closest("[data-rate]");
      if (!r) return;
      const [i, n] = r.dataset.rate.split(":").map(Number);
      ratings[i] = n;
      store.set(`rate.${code}`, ratings);
      $$(`[data-rate^="${i}:"]`, main).forEach((b) => b.setAttribute("aria-pressed", String(b === r)));
      showCount();
    });
    const copy = $("[data-copy-rates]");
    if (copy) copy.addEventListener("click", async () => {
      const lines = (MODS[code].topics || []).map((t, i) => (ratings[i] != null ? `- ${strip(t.t)}: ${ratings[i]}/5` : null)).filter(Boolean);
      const text = `${MODS[code].code} confidence ratings (${short(TODAY)}):\n${lines.join("\n")}`;
      try { await navigator.clipboard.writeText(text); copy.textContent = "Copied. Paste it to Claude"; }
      catch (e) { copy.textContent = "Copy failed: select the list by hand"; }
    });
    const trap = q && q.get("trap");
    if (trap) {
      const li = $$(".trap", main).find((el) => (el.querySelector(".trap-n") || {}).textContent === trap);
      if (li) { li.classList.add("is-target"); li.id = "trap-" + trap; setTimeout(() => li.scrollIntoView({ block: "center" }), 60); }
    }
  }

  // cheat sheet
  function sheetView(code) {
    const tpl = document.getElementById(`tpl-${code}-sheet`);
    const holder = document.createElement("div");
    holder.appendChild(tpl.content.cloneNode(true));
    return `<div class="filter"><label class="vh" for="find">Find in the cheat sheet</label><input id="find" type="search" placeholder="Find a term, acronym or port" autocomplete="off"><output id="find-n" aria-live="polite"></output></div>${holder.innerHTML}`;
  }
  function wireSheet() {
    const input = $("#find");
    const out = $("#find-n");
    const rows = $$(".sheet-part tbody tr, .sheet-part li", main);
    input.addEventListener("input", () => {
      const v = input.value.trim().toLowerCase();
      let n = 0;
      rows.forEach((r) => { const hit = !v || r.textContent.toLowerCase().includes(v); r.classList.toggle("is-hidden", !hit); if (hit && v) n += 1; });
      out.textContent = v ? plural(n, "match", "matches") : "";
    });
  }

  // ------------------------------------------------------------ drill
  let run = null;
  let timer = null;

  function poolFor(o) {
    return Q.filter((q) => q.mod === o.mod && (o.mode === "cards" || q.t === "mcq")
      && (!o.weeks.length || !q.wk.length || q.wk.some((w) => o.weeks.includes(w)))
      && (!o.official || q.off));
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function pick(o) {
    let pool = poolFor(o);
    if (o.mode === "missed") {
      const missed = shuffle(pool.filter(isMissed));
      const unseen = shuffle(pool.filter((q) => !isMissed(q) && !stats[q.id]));
      const rest = shuffle(pool.filter((q) => !isMissed(q) && stats[q.id]));
      pool = missed.concat(unseen, rest);
    } else {
      pool = shuffle(pool.slice());
    }
    const n = o.mode === "mock" ? 20 : o.n === "all" ? pool.length : Number(o.n) || 10;
    return pool.slice(0, n);
  }
  const NOSHUFFLE = /\b(all of the above|none of the above|both [a-e]\b|[a-e] and [a-e]\b)/i;
  const NAMES_LETTERS = /(?:^|[\s(,;/])(?:[a-eA-E](?:\)|\s*=|\s+is\b|\s+and\s+[a-eA-E]\b|,\s*[a-eA-E]\b|\s*\/)|[b-eB-E](?=[\s,:]))/; // "a = repudiation", "C and D are…", "c contradicts…"
  function prepare(q) {
    if (q.t !== "mcq") return { q, order: [] };
    const order = q.o.map((_, i) => i);
    // keep the bank's order when an option or the explanation refers to options by letter
    if (q.o.length > 2 && !q.o.some((o) => NOSHUFFLE.test(strip(o))) && !NAMES_LETTERS.test(strip(q.w || ""))) shuffle(order);
    return { q, order };
  }

  function viewDrill(params) {
    if (run && !params.get("mod")) { renderRun(); return; }
    const want = {
      mod: MODS[params.get("mod")] ? params.get("mod") : "nss",
      mode: params.get("mode") || "",
      n: params.get("n") || "10",
      weeks: (params.get("weeks") || "").split(",").filter(Boolean),
      official: params.get("official") === "1",
    };
    if (params.get("go") === "1") { startRun(want); return; }
    renderSetup(want);
  }

  function renderSetup(o) {
    const counts = Object.fromEntries(["nss", "dwa", "fyp"].map((c) => [c, Q.filter((q) => q.mod === c).length]));
    const mcqs = Q.filter((q) => q.mod === o.mod && q.t === "mcq").length;
    const missedN = missedPool(o.mod).length;
    if (!o.mode) o.mode = o.mod === "fyp" ? "cards" : missedN ? "missed" : "mixed";
    if (!mcqs) o.mode = "cards";
    const weekSet = [...new Set(Q.filter((q) => q.mod === o.mod).flatMap((q) => q.wk))].sort();
    const radio = (name, value, label, checked, small = "", disabled = false) => `<label class="pick"><input type="radio" name="${name}" value="${value}"${checked ? " checked" : ""}${disabled ? " disabled" : ""}><span>${label}${small ? ` <small>${small}</small>` : ""}</span></label>`;
    const box = (name, value, label, checked) => `<label class="pick box"><input type="checkbox" name="${name}" value="${value}"${checked ? " checked" : ""}><span>${label}</span></label>`;
    main.innerHTML = `
      <div class="mod-head"><p class="eyebrow">${run ? "You have a drill in progress. Starting a new one replaces it." : "Retrieval practice: answer first, then check."}</p><h1>Set up a drill</h1></div>
      <form class="setup" id="setup">
        <fieldset class="field"><legend>Module</legend><div class="opts-row">
          ${["nss", "dwa", "fyp"].map((c) => radio("mod", c, MODS[c].code, o.mod === c, `${counts[c]}`)).join("")}</div></fieldset>
        <fieldset class="field"><legend>Kind of drill</legend><div class="opts-row">
          ${radio("mode", "missed", "Missed first", o.mode === "missed", missedN ? `${missedN} waiting` : "none yet", !mcqs)}
          ${radio("mode", "mixed", "Mixed", o.mode === "mixed", "random", !mcqs)}
          ${radio("mode", "mock", "Mock test", o.mode === "mock", "20 in 30 min", !mcqs)}
          ${radio("mode", "cards", "Flashcards", o.mode === "cards", "say it, then check")}</div>
          <p class="hint">A mock matches the NSS test: 20 five-option questions, 30 minutes, no feedback until you hand in.</p></fieldset>
        ${weekSet.length ? `<fieldset class="field"><legend>Weeks</legend><div class="opts-row">${weekSet.map((w) => box("weeks", w, weekName(w), o.weeks.includes(w))).join("")}
          ${o.mod === "nss" ? box("official", "1", "Official Learn quizzes only", o.official) : ""}</div><p class="hint">Leave them all off for every week.</p></fieldset>` : ""}
        <fieldset class="field" id="len"><legend>Length</legend><div class="opts-row">
          ${["10", "20", "all"].map((n) => radio("n", n, n === "all" ? "All" : n, String(o.n) === n)).join("")}</div></fieldset>
        <div class="btn-row"><button class="btn btn-ink" type="submit" id="go">Start</button><span class="count" id="go-n"></span></div>
      </form>${footer()}`;
    const form = $("#setup");
    const read = () => {
      const fd = new FormData(form);
      return { mod: fd.get("mod"), mode: fd.get("mode") || "mixed", n: fd.get("n") || "10", weeks: fd.getAll("weeks"), official: fd.get("official") === "1" };
    };
    const refresh = () => {
      const cur = read();
      if (cur.mod !== o.mod) { renderSetup({ mod: cur.mod, mode: "", n: cur.n, weeks: [], official: false }); return; }
      const pool = poolFor(cur);
      const n = cur.mode === "mock" ? Math.min(20, pool.length) : cur.n === "all" ? pool.length : Math.min(Number(cur.n), pool.length);
      $("#len").hidden = cur.mode === "mock";
      $("#go").disabled = !n;
      $("#go").textContent = n ? (cur.mode === "mock" ? `Start the mock: ${n} questions, 30 minutes` : `Start ${plural(n, cur.mode === "cards" ? "card" : "question")}, about ${minutes(n, cur.mode)} min`) : "Nothing matches";
      $("#go-n").textContent = n ? `${pool.length} in the pool` : "Turn a filter off";
    };
    form.addEventListener("change", refresh);
    form.addEventListener("submit", (e) => { e.preventDefault(); startRun(read()); });
    refresh();
  }

  function startRun(o) {
    const list = pick(o);
    if (!list.length) { renderSetup(o); return; }
    run = { o, items: list.map(prepare), i: 0, answers: [], cardsAgain: [], done: false, ends: o.mode === "mock" ? Date.now() + 30 * 60 * 1000 : null };
    if (location.hash !== "#/drill") { history.replaceState(null, "", "#/drill"); }
    renderRun();
  }

  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function tick() {
    const el = $("#timer");
    if (!run || !run.ends) { stopTimer(); return; }
    const ms = run.ends - Date.now();
    if (ms <= 0) { stopTimer(); handIn(); return; }
    if (el) {
      const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
      el.textContent = `${m}:${pad(s)} left`;
      el.classList.toggle("low", ms < 5 * 60000);
    }
  }

  function renderRun() {
    if (!run) { renderSetup({ mod: "nss", mode: "", n: "10", weeks: [], official: false }); return; }
    if (run.done) { renderResults(); return; }
    const item = run.items[run.i];
    if (run.o.mode === "cards") { renderCard(item); return; }
    const q = item.q;
    const ans = run.answers[run.i];
    const mock = run.o.mode === "mock";
    const total = run.items.length;
    const dots = run.items.map((_, k) => {
      const a = run.answers[k];
      const cls = mock ? (a != null ? "is-done" : "") : a == null ? "" : a.ok ? "is-done" : "is-red";
      return mock ? `<button type="button" class="wk-btn" data-goto="${k}" aria-label="Question ${k + 1}${a != null ? ", answered" : ""}">${bub(cls + (k === run.i ? " is-current" : ""))}</button>` : bub(cls);
    }).join("");
    if (!item.pre) item.pre = { missed: !!(q.m || isMissed(q)), label: missedLabel(q) || "before" }; // as it stood before this attempt
    const flags = [item.pre.missed ? `<span class="tag tag-red">You missed this ${esc(item.pre.label)}</span>` : "", ...q.wk.map((w) => `<span class="tag tag-soft">${weekName(w)}</span>`), q.off ? '<span class="tag tag-soft">Official Learn quiz</span>' : ""].filter(Boolean).join("");
    const opts = item.order.map((oi, k) => {
      const chosen = ans && ans.choice === oi;
      let cls = chosen ? " is-chosen" : "";
      if (ans && !mock) cls += oi === q.a ? " is-right" : chosen ? " is-wrong" : "";
      const text = ans && !mock && oi === q.a ? `<span class="hl">${q.o[oi]}</span>` : q.o[oi];
      return `<li><button type="button" class="opt${cls}" data-opt="${oi}"${ans && !mock ? " disabled" : ""} aria-pressed="${chosen ? "true" : "false"}">${bub(chosen ? "" : "", "ABCDE"[k])}<span class="opt-text">${text}</span><span class="mark" aria-hidden="true"><svg><use href="#${oi === q.a ? "i-tick" : "i-cross"}"/></svg></span></button></li>`;
    }).join("");
    let why = "";
    if (ans && !mock) {
      const letter = "ABCDE"[item.order.indexOf(q.a)];
      why = `<div class="why ${ans.ok ? "is-right" : "is-wrong"}" id="why" role="status"><b>${ans.ok ? "Correct." : `Not quite. The answer is ${letter}.`}</b>${q.w ? q.w : ""}</div>`;
    }
    const last = run.i === total - 1;
    const nextBtn = mock
      ? `<div class="next-row sticky">${run.i > 0 ? '<button class="btn btn-line" type="button" data-prev>Previous</button>' : ""}${last ? '<button class="btn btn-ink" type="button" data-handin>Hand in</button>' : '<button class="btn btn-ink" type="button" data-next>Next question</button>'}<span class="kbd">Keys: <kbd>A</kbd>–<kbd>E</kbd> to choose, <kbd>Enter</kbd> for next</span></div>`
      : ans ? `<div class="next-row sticky"><button class="btn btn-ink" type="button" data-next>${last ? "See your score" : "Next question"}</button><span class="kbd">Press <kbd>Enter</kbd></span></div>`
        : `<p class="kbd">Press <kbd>A</kbd>–<kbd>E</kbd> or tap an answer.</p>`;
    main.innerHTML = `
      <div class="run-top"><span class="count">${mock ? "Mock test" : MODS[run.o.mod].code}: question ${run.i + 1} of ${total}</span>
        ${mock ? '<span class="timer" id="timer" role="timer"></span>' : ""}
        <button class="btn btn-quiet" type="button" data-end>${mock ? "Hand in now" : "End drill"}</button></div>
      <div class="bubrow" style="margin:-12px 0 var(--s5)">${dots}</div>
      <article class="paper" aria-labelledby="stem">
        <div class="q-num" aria-hidden="true">${run.i + 1}</div>
        <div class="q-body">
          ${flags ? `<div class="q-flags">${flags}</div>` : ""}
          <p class="q-stem" id="stem">${q.s}</p>
          <ol class="options" type="A">${opts}</ol>
          ${why}
          ${nextBtn}
        </div>
      </article>`;
    if (mock) { stopTimer(); tick(); timer = setInterval(tick, 1000); }
    const w = $("#why");
    if (w) requestAnimationFrame(() => { w.classList.add("is-in"); if (matchMedia("(max-width: 759px)").matches) w.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
  }

  function choose(oi) {
    if (!run || run.done) return;
    const item = run.items[run.i];
    const mock = run.o.mode === "mock";
    if (run.answers[run.i] && !mock) return;
    const ok = oi === item.q.a;
    run.answers[run.i] = { choice: oi, ok };
    if (!mock) record(item.q, ok);
    renderRun();
    if (!mock) { const n = $("[data-next]"); if (n) n.focus({ preventScroll: true }); }
  }
  function next() {
    if (!run) return;
    if (run.i < run.items.length - 1) { run.i += 1; renderRun(); window.scrollTo(0, 0); }
    else if (run.o.mode === "mock") handIn();
    else { finish(); }
  }
  function handIn() {
    if (!run) return;
    stopTimer();
    run.items.forEach((it, k) => { const a = run.answers[k]; if (a) record(it.q, a.ok); });
    finish();
  }
  function finish() {
    run.done = true;
    const right = run.answers.filter((a) => a && a.ok).length;
    const total = run.o.mode === "cards" ? run.items.length : run.items.length;
    const hist = store.get("history", []);
    hist.push({ date: iso(new Date()), mod: run.o.mod, mode: run.o.mode, n: right, of: total });
    store.set("history", hist.slice(-200));
    renderResults();
    window.scrollTo(0, 0);
  }

  function renderCard(item) {
    const q = item.q;
    const st = run.answers[run.i];
    const total = run.items.length;
    const back = q.t === "mcq"
      ? `<ol class="card-opts" type="A">${q.o.map((o, i) => `<li${i === q.a ? ' class="is-right"' : ""}>${i === q.a ? `<strong>${o}</strong>` : o}</li>`).join("")}</ol>${q.w ? `<p>${q.w}</p>` : ""}`
      : q.back || "<p>No model answer in the bank.</p>";
    main.innerHTML = `
      <div class="run-top"><span class="count">${MODS[run.o.mod].code} flashcards: card ${run.i + 1} of ${total}</span><button class="btn btn-quiet" type="button" data-end>End</button></div>
      ${bubRow(run.answers.filter(Boolean).length, total)}
      <article class="card-face block" aria-labelledby="stem">
        <div class="q-flags">${q.g ? `<span class="tag tag-soft">${esc(q.g)}</span>` : ""}${q.wk.map((w) => `<span class="tag tag-soft">${weekName(w)}</span>`).join("")}</div>
        <p class="q-stem" id="stem">${q.s}</p>
        <div class="card-back" id="back" ${st || run.reveal ? "" : "hidden"}>${back}</div>
        <div class="btn-row">${run.reveal ? `<button class="btn btn-ink" type="button" data-got>Got it</button><button class="btn btn-line" type="button" data-not>Not yet</button>` : `<button class="btn btn-ink" type="button" data-show>Show the answer</button><span class="kbd">Press <kbd>Space</kbd></span>`}</div>
      </article>`;
  }
  function cardVerdict(ok) {
    const item = run.items[run.i];
    run.answers[run.i] = { ok };
    if (!ok && !item.again) run.items.push({ ...item, again: true });
    run.reveal = false;
    if (run.i < run.items.length - 1) { run.i += 1; renderRun(); } else finish();
  }

  function renderResults() {
    const mock = run.o.mode === "mock";
    const cards = run.o.mode === "cards";
    const total = cards ? run.items.filter((it) => !it.again).length : run.items.length;
    const right = cards ? run.items.filter((it, k) => !it.again && run.answers[k] && run.answers[k].ok).length : run.answers.filter((a) => a && a.ok).length;
    const pct = total ? Math.round((right / total) * 100) : 0;
    const need = Math.max(0, Math.ceil(total * 0.9) - right);
    const wrong = run.items.map((it, k) => ({ it, a: run.answers[k] })).filter((x) => !cards && (!x.a || !x.a.ok));
    const review = wrong.map(({ it, a }) => {
      const q = it.q;
      return `<li><p class="q-stem">${q.s}</p>
        ${a ? `<p class="ans-wrong">You chose <s>${q.o[a.choice]}</s></p>` : '<p class="muted">Not answered</p>'}
        <p class="ans-right">Answer: ${"ABCDE"[it.order.indexOf(q.a)]}) ${q.o[q.a]}</p>${q.w ? `<p>${q.w}</p>` : ""}</li>`;
    }).join("");
    const verdict = pct >= 90 ? "That's at the 90% mock target." : need === 1 ? "One more right answer gets you to 90%, the mock target in your first-class plan." : `${need} more right answers get you to 90%, the mock target in your first-class plan.`;
    main.innerHTML = `
      <div class="result-head">
        <p class="eyebrow">${MODS[run.o.mod].code} ${mock ? "mock test" : cards ? "flashcards" : run.o.mode === "missed" ? "drill, missed first" : "drill"}, marked</p>
        <div class="big-score" id="big"><b>${right}/${total}</b><svg viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M30 70 C 18 26, 120 6, 172 30 C 206 48, 188 104, 108 110 C 46 114, 8 94, 26 48"/></svg></div>
        <p class="lead">${pct}%. ${cards ? `You said "not yet" to ${plural(total - right, "card")}.` : verdict}</p>
      </div>
      ${review ? `<section class="block"><h2 class="section-title" style="margin-bottom:var(--s4)">What you missed</h2><ol class="review">${review}</ol></section>` : ""}
      <div class="btn-row block">
        ${wrong.length ? `<button class="btn btn-ink" type="button" data-retry>${wrong.length === 1 ? "Re-test the one you missed" : `Re-test the ${wrong.length} you missed`}</button>` : ""}
        <a class="btn ${wrong.length ? "btn-line" : "btn-ink"}" href="#/drill?mod=${run.o.mod}" data-new>Set up another drill</a>
        <a class="btn btn-quiet" href="#/">Back to today</a></div>
      ${footer()}`;
    const big = $("#big");
    requestAnimationFrame(() => requestAnimationFrame(() => big.classList.add("is-in")));
    const retry = $("[data-retry]");
    if (retry) retry.addEventListener("click", () => {
      const o = run.o;
      run = { o: { ...o, mode: o.mode === "mock" ? "mixed" : o.mode }, items: wrong.map((x) => prepare(x.it.q)), i: 0, answers: [], done: false, ends: null };
      renderRun();
      window.scrollTo(0, 0);
    });
    $("[data-new]").addEventListener("click", () => { run = null; });
  }

  // drill events
  main.addEventListener("click", (e) => {
    if (!run || location.hash.indexOf("#/drill") !== 0) return;
    const opt = e.target.closest("[data-opt]");
    if (opt) { choose(Number(opt.dataset.opt)); return; }
    if (e.target.closest("[data-next]")) { next(); return; }
    if (e.target.closest("[data-prev]")) { run.i = Math.max(0, run.i - 1); renderRun(); return; }
    if (e.target.closest("[data-handin]")) { handIn(); return; }
    const go = e.target.closest("[data-goto]");
    if (go) { run.i = Number(go.dataset.goto); renderRun(); return; }
    if (e.target.closest("[data-end]")) {
      if (run.o.mode === "mock") handIn();
      else if (run.answers.some(Boolean)) finish();
      else { run = null; renderSetup({ mod: "nss", mode: "", n: "10", weeks: [], official: false }); }
      return;
    }
    if (e.target.closest("[data-show]")) { run.reveal = true; renderRun(); const g = $("[data-got]"); if (g) g.focus({ preventScroll: true }); return; }
    if (e.target.closest("[data-got]")) { cardVerdict(true); return; }
    if (e.target.closest("[data-not]")) { cardVerdict(false); }
  });
  document.addEventListener("keydown", (e) => {
    if (!run || run.done || location.hash.indexOf("#/drill") !== 0) return;
    if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (run.o.mode === "cards") {
      if ((k === " " || k === "enter") && !run.reveal) { e.preventDefault(); run.reveal = true; renderRun(); }
      return;
    }
    const item = run.items[run.i];
    const idx = "abcde".indexOf(k) >= 0 ? "abcde".indexOf(k) : "12345".indexOf(k);
    if (idx >= 0 && idx < item.order.length) { e.preventDefault(); choose(item.order[idx]); return; }
    if ((k === "enter" || k === "arrowright") && (run.answers[run.i] || run.o.mode === "mock") && !e.target.closest("button")) { e.preventDefault(); next(); }
    if (k === "arrowleft" && run.o.mode === "mock" && run.i > 0) { run.i -= 1; renderRun(); }
  });

  // ------------------------------------------------------------ log
  function viewLog(params) {
    const f = params.get("mod") || "all";
    const log = D.log.filter((s) => f === "all" || s.mod === f).slice().reverse();
    const byDay = {};
    log.forEach((s) => { (byDay[s.date] = byDay[s.date] || []).push(s); });
    const scored = D.log.filter((s) => s.n != null);
    const answered = scored.filter((s) => !s.official || s.of <= 30).reduce((t, s) => t + s.of, 0);
    const firstDay = D.log.length ? parse(D.log[0].date) : TODAY;
    const mocks = scored.filter((s) => s.mock);
    const best = mocks.slice().sort((a, b) => b.n / b.of - a.n / a.of)[0];
    const hist = store.get("history", []).slice().reverse();
    const chips = [["all", "All"], ["nss", "NSS"], ["dwa", "DWA"], ["fyp", "FYP"]].map(([k, l]) => `<a class="chip${f === k ? " is-on" : ""}" href="#/log${k === "all" ? "" : "?mod=" + k}"${f === k ? ' aria-current="page"' : ""} style="text-decoration:none">${l}</a>`).join("");
    main.innerHTML = `
      <div class="mod-head"><p class="eyebrow">Every logged study session, newest first</p><h1>Study log</h1>
        <p class="lead">${plural(D.log.length, "session")} since ${esc(short(firstDay))}, about ${answered} questions answered in sessions.${best ? ` Best mock ${best.n}/${best.of} (${Math.round((best.n / best.of) * 100)}%); the target is 90%+ before each test.` : ""}</p></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s5)">${chips}</div>
      ${Object.keys(byDay).length ? Object.entries(byDay).map(([day, list]) => `<section class="log-day"><h3>${esc(longDate(parse(day)))}</h3><ul class="ruled">${list.map((s) => sessionRow(s, false)).join("")}</ul></section>`).join("")
        : `<p class="lead block">No sessions logged for ${esc(f.toUpperCase())} yet. Your first quiz will show up here once Claude logs it.</p>`}
      <section class="block" aria-labelledby="dev-h"><div class="block-head"><h2 class="section-title" id="dev-h">On this device</h2><p>Drills you've done here. They don't sync.</p></div>
        ${hist.length ? `<ul class="ruled">${hist.slice(0, 30).map((h) => `<li class="sess"><span class="sess-date">${esc(short(parse(h.date)))}</span><p class="sess-topic">${modTag(h.mod)}${esc({ missed: "Missed first", mixed: "Mixed drill", mock: "Mock test", cards: "Flashcards" }[h.mode] || h.mode)}</p><div class="score"><b>${h.n}/${h.of}</b><span class="bar"><i style="--w:${h.of ? Math.round((h.n / h.of) * 100) : 0}%"></i></span></div></li>`).join("")}</ul>`
          : `<p class="muted">Nothing yet. <a href="#/drill">Start a drill</a> and it'll appear here.</p>`}</section>
      ${footer()}`;
  }

  // ------------------------------------------------------------ router
  const TITLES = { today: "Today", modules: "Modules", drill: "Drill", log: "Log" };
  function render() {
    const raw = location.hash.replace(/^#/, "") || "/";
    if (!raw.startsWith("/")) return;
    const [path, query] = raw.split("?");
    const parts = path.split("/").filter(Boolean);
    const params = new URLSearchParams(query || "");
    closePop();
    if (!(parts[0] === "drill")) stopTimer();
    let key = "today";
    if (parts[0] === "m" && MODS[parts[1]]) { key = parts[1]; viewModule(parts[1], parts[2] || "progress", params); }
    else if (parts[0] === "modules") { key = "modules"; viewModules(); }
    else if (parts[0] === "drill") { key = "drill"; viewDrill(params); }
    else if (parts[0] === "log") { key = "log"; viewLog(params); }
    else viewToday();
    $$("[data-route]").forEach((a) => {
      const r = a.dataset.route;
      const on = r === key || (r === "modules" && MODS[key]);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.title = `${MODS[key] ? MODS[key].code : TITLES[key]}: Uni Pocket Edition`;
    if (!params.get("trap")) window.scrollTo(0, 0);
  }

  // theme
  const themeBtn = $("#theme");
  const sysDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : sysDark());
  const labelTheme = () => themeBtn.setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  themeBtn.addEventListener("click", () => {
    const t = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    store.set("theme", t);
    labelTheme();
  });
  labelTheme();

  $("[data-skip]").addEventListener("click", (e) => { e.preventDefault(); main.focus(); });
  const now = weekNow();
  $("#today-line").textContent = `${short(TODAY)}${now ? `, ${weekName(now.key).toLowerCase()}` : ""}`;

  window.addEventListener("hashchange", () => { render(); main.focus({ preventScroll: true }); });
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline copy unavailable */ });
  }
})();
</script>
</body>
</html>

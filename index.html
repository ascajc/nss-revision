<section id="nss-standards" class="rv">
  <div class="sec-head">
    <span class="label">Slides 22, 27, 28–29, 40</span>
    <h2>Three documents, three publishers</h2>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Document</th><th>One word</th><th>Publisher</th><th>Answers</th></tr></thead>
      <tbody>
        <tr><td class="key mono">FIPS 199</td><td>rating</td><td>NIST (US government)</td><td>What must we protect, and how bad is a loss?</td></tr>
        <tr><td class="key mono">X.800</td><td>architecture</td><td>ITU-T (UN telecoms)</td><td>How do we structure security?</td></tr>
        <tr><td class="key mono">RFC 4949</td><td>vocabulary</td><td>IETF (internet standards)</td><td>What does each word mean exactly?</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <span class="label">Lecturer, transcript 1:33</span>
    <p>"X.800, it gives the architecture level of cybersecurity. The RFC gives the vocabulary of cybersecurity."</p>
  </div>

  <h3>X.800's three core concepts</h3>
  <div class="flow" role="list">
    <div class="node" role="listitem"><b>Attack</b><span>Any action that compromises an organisation's information security</span></div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="node" role="listitem"><b>Service</b><span>Counters attacks. <strong>What</strong> you get, e.g. confidentiality</span></div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="node" role="listitem"><b>Mechanism</b><span>Detects, prevents or recovers. <strong>How</strong> you get it, e.g. encryption</span></div>
  </div>
  <p>Encryption is a <strong>mechanism</strong>, so it is never one of the X.800 <em>services</em>.</p>

  <h3>RFC 4949: threat vs attack</h3>
  <div class="split">
    <div class="panel"><span class="label">Threat</span><p>A <strong>potential</strong> for violation: a circumstance or capability that <em>could</em> cause harm.</p></div>
    <div class="panel"><span class="label">Attack</span><p>An actual assault that derives from an <strong>intelligent threat</strong>: a <em>deliberate</em> attempt to evade security.</p></div>
  </div>
  <p>"Threat is the potential, attack is the action."</p>
</section>

<section id="nss-ncsc" class="rv">
  <div class="sec-head">
    <span class="label">Slides 36–38, 60, reading for the commute</span>
    <h2>UK guidance: NCSC, 10 Steps and CAF</h2>
    <p>Whether the 10 Steps and CAF are in Test 1 is <strong>unknown</strong>, so know the headlines, not every detail.</p>
  </div>

  <h3>Who the NCSC is</h3>
  <p>The UK's <strong>National Cyber Security Centre</strong>, part of <strong>GCHQ</strong>. Its predecessor was <strong>CESG</strong>. The lecturer: "If you want to dig deep in cybersecurity, especially about the UK systems and policies, this is the best source where you'll find <strong>validated</strong> information" (transcript 1:07). A lot of other material "is around the States, a lot of it is outdated".</p>
  <ul>
    <li>responds to and manages <strong>major cyber incidents</strong></li>
    <li>publishes <strong>guidance, best practice and frameworks</strong> for organisations of all sizes</li>
    <li>works with <strong>law enforcement, intelligence agencies and international partners</strong></li>
    <li>supports the secure development and use of <strong>emerging technologies</strong></li>
    <li>promotes <strong>cyber resilience</strong> across government, industry, academia and civil society</li>
  </ul>

  <h3>The 3 bodies on slide 60</h3>
  <div class="table">
    <table>
      <thead><tr><th>Body</th><th>What it is</th><th>Publishes</th></tr></thead>
      <tbody>
        <tr><td class="key">NIST</td><td>US federal agency: measurement science, standards and technology</td><td><strong>FIPS</strong> + <strong>Special Publications (SP)</strong>, worldwide impact; also the NIST Cybersecurity Framework</td></tr>
        <tr><td class="key">ISOC</td><td>Internet Society: professional membership society, home of the <strong>IETF</strong> and <strong>IAB</strong></td><td>Internet standards as <strong>RFCs</strong> (e.g. RFC 4949)</td></tr>
        <tr><td class="key">NCSC</td><td>UK authority, part of GCHQ</td><td><strong>10 Steps</strong>, <strong>CAF</strong>, guidance</td></tr>
      </tbody>
    </table>
  </div>

  <h3>10 Steps to Cyber Security (slides 36–37)</h3>
  <p>First published in <strong>2012 by CESG</strong>, refreshed around <strong>2021</strong> for cloud, home and mobile working, ransomware and a new <strong>supply chain</strong> section. Audience: <strong>security professionals and technical staff in medium and large organisations</strong>. Board members get the separate <strong>Cyber Security Board Toolkit</strong> (2019). It's <strong>guidance</strong>, not a standard or a certification.</p>
  <div class="callout"><span class="label">The ring around it</span><p>Understand your organisation's <strong>risks</strong> → implement appropriate <strong>mitigations</strong> → <strong>prepare</strong> for cyber incidents. <strong>Risk management sits in the centre</strong>: start there.</p></div>
  <div class="table">
    <table>
      <thead><tr><th>Group</th><th>Step</th><th>NCSC wording</th></tr></thead>
      <tbody>
        <tr><td class="key">Centre</td><td><strong>Risk management</strong></td><td>take a risk-based approach to securing your data and systems</td></tr>
        <tr><td class="key">People</td><td>Engagement and training</td><td>collaboratively build security that works for people in your organisation</td></tr>
        <tr><td class="key">People</td><td>Identity and access management</td><td>control <strong>who and what</strong> can access your systems and data</td></tr>
        <tr><td class="key">Your stuff</td><td>Asset management</td><td><strong>know what</strong> data and systems you have and what business need they support</td></tr>
        <tr><td class="key">Your stuff</td><td>Architecture and configuration</td><td><strong>design, build, maintain and manage</strong> systems securely</td></tr>
        <tr><td class="key">Your stuff</td><td>Vulnerability management</td><td>keep your systems protected <strong>throughout their lifecycle</strong></td></tr>
        <tr><td class="key">Your stuff</td><td>Data security</td><td>protect data <strong>where it is vulnerable</strong></td></tr>
        <tr><td class="key">Watch + respond</td><td>Logging and monitoring</td><td>design your systems to be able to <strong>detect and investigate</strong> incidents</td></tr>
        <tr><td class="key">Watch + respond</td><td>Incident management</td><td><strong>plan your response</strong> to cyber incidents <strong>in advance</strong></td></tr>
        <tr><td class="key">Outside</td><td>Supply chain security</td><td>collaborate with your <strong>suppliers and partners</strong></td></tr>
      </tbody>
    </table>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Trap: logging vs incident</span><p><strong>Detect and investigate</strong> → logging and monitoring. <strong>Plan the response in advance</strong> → incident management.</p></div>
    <div class="panel"><span class="label">Link to Lab 01</span><p>MOVEit + SolarWinds → <strong>supply chain security</strong> (and vulnerability management). Colonial Pipeline → <strong>incident management</strong>.</p></div>
  </div>

  <h3>Guideline vs framework vs standard (CAF video)</h3>
  <div class="table">
    <table>
      <thead><tr><th>Term</th><th>Means</th></tr></thead>
      <tbody>
        <tr><td class="key">Guideline</td><td>a <strong>recommended</strong> strategy, not mandatory</td></tr>
        <tr><td class="key">Framework</td><td>a <strong>structured set of guidelines</strong>: a blueprint or roadmap</td></tr>
        <tr><td class="key">Standard</td><td><strong>specific criteria</strong>, more rigid (voluntary or mandatory)</td></tr>
      </tbody>
    </table>
  </div>

  <h3>Cyber Assessment Framework, CAF (slide 38, video)</h3>
  <p>An NCSC <strong>framework</strong> for assessing an organisation's cyber security, aimed especially at <strong>critical infrastructure</strong> (energy, water, transport, health).</p>
  <div class="flow four" role="list">
    <div class="node" role="listitem"><b>4 objectives</b><span>A, B, C, D</span></div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="node" role="listitem"><b>14 principles</b><span>e.g. B2 = identity and access control</span></div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="node" role="listitem"><b>Contributing outcomes</b><span>what good looks like</span></div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="node" role="listitem"><b>IGPs</b><span>Indicators of Good Practice: achieved / partially achieved / not achieved</span></div>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Objective</th><th>Focus</th><th>Hook</th></tr></thead>
      <tbody>
        <tr><td class="key">A</td><td>Managing security risk: reduce it to an acceptable level (proactive)</td><td><strong>A</strong>ssess risk</td></tr>
        <tr><td class="key">B</td><td>Protecting against cyber attack</td><td><strong>B</strong>lock</td></tr>
        <tr><td class="key">C</td><td>Detecting cyber security events</td><td><strong>C</strong>atch</td></tr>
        <tr><td class="key">D</td><td>Minimising the impact of incidents: <strong>resilience</strong>, withstand and recover</td><td><strong>D</strong>amage control</td></tr>
      </tbody>
    </table>
  </div>
  <ul>
    <li><strong>Profiles:</strong> <strong>baseline</strong> (foundational) and <strong>enhanced</strong> (higher-risk organisations). The organisation chooses.</li>
    <li>IGPs show <em>how</em> good practice looks: not just "have MFA" but what good MFA looks like.</li>
  </ul>
  <div class="callout"><span class="label">The big trap</span><p><strong>You can't be "CAF certified".</strong> CAF is a <strong>self-assessment</strong> tool for continual improvement. <strong>ISO 27001 is the certification.</strong> The NIST CSF and ISO 27001 are broader (any sector); CAF is more specific to critical infrastructure.</p></div>
</section>

<section id="nss-services" class="rv">
  <div class="sec-head">
    <span class="label">Slides 24, 41–47, X.800</span>
    <h2>The five security services (+ availability)</h2>
    <p>A service is the <strong>promise</strong> ("nobody can read this"). A mechanism is <strong>how</strong> the promise is kept (encryption).</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Service</th><th>The promise</th><th>Watch for</th></tr></thead>
      <tbody>
        <tr><td class="key">Authentication</td><td>The party or message is who it claims to be</td><td><strong>Peer entity</strong>: both sides of a live connection (e.g. two TCP modules); stops masquerade and replay. <strong>Data origin</strong>: the source of <em>one</em> message, suits email, and does <em>not</em> stop duplication or modification</td></tr>
        <tr><td class="key">Access control</td><td>Limits who can reach which hosts and applications</td><td>Needs authentication first, so rights can be tailored to each user</td></tr>
        <tr><td class="key">Data confidentiality</td><td>Protects data from <strong>passive</strong> attacks: nobody can <strong>see</strong> it</td><td><strong>Traffic-flow confidentiality</strong> hides source, destination, frequency and length</td></tr>
        <tr><td class="key">Data integrity</td><td>Received exactly as sent: nobody <strong>changed</strong> it</td><td><strong>Connection-oriented</strong> = the whole stream: no duplication, insertion, modification, reordering, replay or destruction (so it also helps against DoS). <strong>Connectionless</strong> = single messages, modification only. Active attacks → <strong>detect</strong>, not prevent</td></tr>
        <tr><td class="key">Nonrepudiation</td><td>Neither side can deny the message</td><td><strong>Both directions</strong>: proof of who sent it, and proof that it was received</td></tr>
        <tr><td class="key">Availability service</td><td>Keeps the system usable</td><td>Counters DoS. X.800 treats it as a property of the other services</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <span class="label">Campus picture</span>
    <p>The card reader checking that the card is really yours = <strong>authentication</strong>. The list of rooms your card opens = <strong>access control</strong>. A signed, dated form that proves you handed in your coursework = <strong>nonrepudiation</strong>.</p>
  </div>
  <p>Encryption, digital signatures and the rest are <strong>mechanisms</strong>, never services.</p>
</section>

<section id="nss-principles" class="rv">
  <div class="sec-head">
    <span class="label">Slides 48–50, 13 principles</span>
    <h2>Security design principles</h2>
    <p>1–8 are about <strong>who gets in and how much they can do</strong>. 9–13 are about <strong>how the system is built</strong>. The lecturer said "so 12", but slide 48 lists 13.</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>#</th><th>Principle</th><th>Means</th><th>University building picture</th></tr></thead>
      <tbody>
        <tr><td>1</td><td class="key">Economy of mechanism</td><td>Keep it simple and small</td><td>One main entrance with one card reader, not 12 side doors</td></tr>
        <tr><td>2</td><td class="key">Fail-safe defaults</td><td>Default = <strong>no</strong> access; grant by permission</td><td>Your card opens only rooms you've been added to; a new room stays locked</td></tr>
        <tr><td>3</td><td class="key">Complete mediation</td><td>Check <strong>every</strong> access, every time</td><td>Tap your card at every door, not just the front gate</td></tr>
        <tr><td>4</td><td class="key">Open design</td><td>Mechanism public, only the key secret</td><td>Everyone knows how card readers work; only your card is unique</td></tr>
        <tr><td>5</td><td class="key">Separation of privilege</td><td><strong>Two or more</strong> conditions (e.g. MFA)</td><td>The exam-paper safe needs two staff with two keys</td></tr>
        <tr><td>6</td><td class="key">Least privilege</td><td>Minimum rights for the job (RBAC)</td><td>The cleaner's card opens classrooms, not the exam office</td></tr>
        <tr><td>7</td><td class="key">Least common mechanism</td><td>Share as little as possible <strong>between users</strong></td><td>Each student has their own locker, not one shared cupboard</td></tr>
        <tr><td>8</td><td class="key">Psychological acceptability</td><td>Easy enough that people don't bypass it</td><td>10 minutes of checks to get in → people prop the doors open</td></tr>
        <tr><td>9</td><td class="key">Isolation</td><td>Keep apart: (1) public vs critical, (2) users from each other, (3) the security tools themselves</td><td>Reception walled off from the exam office; separate lockers; the CCTV room locked</td></tr>
        <tr><td>10</td><td class="key">Encapsulation</td><td>Isolation with <strong>designated entry points</strong> (object-oriented)</td><td>You get your transcript only at the student services counter, never inside the records room</td></tr>
        <tr><td>11</td><td class="key">Modularity</td><td>Separate, protected, upgradeable security modules</td><td>One card system for every building, upgraded on its own</td></tr>
        <tr><td>12</td><td class="key">Layering</td><td>Several overlapping protections = <strong>defence in depth</strong></td><td>Gate guard + ID card + locked office + CCTV; if one fails, the rest still stand</td></tr>
        <tr><td>13</td><td class="key">Least astonishment</td><td>Behaves the way users expect</td><td>The "Fire exit" sign really leads outside</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <span class="label">Lecturer's examples</span>
    <p>Isolation: Learn marks and official results sit in <strong>separate systems</strong>. Layering: logging in passes the browser, the authenticator and the password. Least privilege: students see their modules but can't edit marks.</p>
  </div>
  <h3>Trigger words</h3>
  <div class="table">
    <table>
      <thead><tr><th>The question says…</th><th>Answer</th></tr></thead>
      <tbody>
        <tr><td>simple, small</td><td class="key">Economy of mechanism</td></tr>
        <tr><td>default, unless allowed, deny by default</td><td class="key">Fail-safe defaults</td></tr>
        <tr><td>every access, each time, no caching</td><td class="key">Complete mediation</td></tr>
        <tr><td>published algorithm, secret key, obscurity</td><td class="key">Open design</td></tr>
        <tr><td>two, both, multi-factor</td><td class="key">Separation of privilege</td></tr>
        <tr><td>only what's needed, minimum rights</td><td class="key">Least privilege</td></tr>
        <tr><td>sharing between users</td><td class="key">Least common mechanism</td></tr>
        <tr><td>users bypass it</td><td class="key">Psychological acceptability</td></tr>
        <tr><td>kept separate, public vs critical</td><td class="key">Isolation</td></tr>
        <tr><td>only through methods, interface, entry point</td><td class="key">Encapsulation</td></tr>
        <tr><td>module, upgrade one part, reused by many</td><td class="key">Modularity</td></tr>
        <tr><td>multiple, overlapping, if one fails</td><td class="key">Layering</td></tr>
        <tr><td>surprise, expected, intuitive</td><td class="key">Least astonishment</td></tr>
      </tbody>
    </table>
  </div>
  <h3>Look-alike pairs</h3>
  <div class="table">
    <table>
      <thead><tr><th>If the question says…</th><th>Answer</th><th>Not</th></tr></thead>
      <tbody>
        <tr><td>one shared crypto library used by many protocols</td><td class="key">Modularity</td><td>Least common mechanism (users sharing)</td></tr>
        <tr><td>password <strong>and</strong> code: one gate, two things</td><td class="key">Separation of privilege</td><td>Layering</td></tr>
        <tr><td>several gates in a row, "if one fails…"</td><td class="key">Layering</td><td>Separation of privilege</td></tr>
        <tr><td>reached only through methods or a counter</td><td class="key">Encapsulation</td><td>Isolation</td></tr>
        <tr><td>block everything unless a rule allows it</td><td class="key">Fail-safe defaults</td><td>Complete mediation</td></tr>
      </tbody>
    </table>
  </div>
</section>

<section id="nss-surface" class="rv">
  <div class="sec-head">
    <span class="label">Slides 51–52</span>
    <h2>Attack surface</h2>
    <p><strong>The reachable and exploitable vulnerabilities in a system.</strong> Every port, form, parser and person an attacker can reach is a door.</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Category</th><th>Covers</th></tr></thead>
      <tbody>
        <tr><td class="key">Network</td><td>Enterprise network, WAN or Internet: protocol vulnerabilities (e.g. for DoS), link disruption, intruder attacks</td></tr>
        <tr><td class="key">Software</td><td>Application, utility or OS code, especially <strong>web server software</strong></td></tr>
        <tr><td class="key">Human</td><td>Personnel or outsiders: <strong>social engineering, human error, trusted insiders</strong></td></tr>
      </tbody>
    </table>
  </div>
  <p>Slide 51 examples: open ports on outward-facing servers and the code listening on them · services inside a firewall · code that processes incoming data, email, XML and office documents · SQL and web forms · an employee with sensitive access who is vulnerable to social engineering.</p>
  <h3>Surface × depth (slide 52)</h3>
  <div class="table">
    <table>
      <thead><tr><th></th><th>Small surface</th><th>Large surface</th></tr></thead>
      <tbody>
        <tr><td class="key">Deep layering</td><td class="low">Low risk</td><td class="med">Medium risk</td></tr>
        <tr><td class="key">Shallow layering</td><td class="med">Medium risk</td><td class="high">High risk</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <span class="label">Count the bad things</span>
    <p>Large surface = 1 bad thing. Shallow layering = 1 bad thing. <strong>0 → low, 1 → medium, 2 → high.</strong> Shrink the surface (fewer doors) <em>and</em> deepen the layering (more locks behind each door): the two complement each other.</p>
  </div>
</section>

<section id="nss-trees" class="rv">
  <div class="sec-head">
    <span class="label">Slides 53–59</span>
    <h2>Attack trees</h2>
    <p><strong>A branching, hierarchical data structure that represents a set of potential techniques for exploiting security vulnerabilities.</strong></p>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Parts</span><ul><li><strong>Root</strong>: the attacker's goal (the security incident)</li><li><strong>Branches</strong>: subgoals, refined step by step</li><li><strong>Leaves</strong>: different ways to <em>initiate</em> the attack</li><li>Branches can be <strong>labelled</strong> with difficulty, cost or risk to compare paths</li></ul></div>
    <div class="panel"><span class="label">AND vs OR</span><ul><li><strong>OR</strong>: any <em>one</em> child is enough. Defender must block <strong>every</strong> child</li><li><strong>AND</strong>: <em>all</em> children are needed. Defender blocks <strong>one</strong> child and the branch dies</li></ul></div>
  </div>
  <h3>Change a final grade on the school portal (slides 57–58)</h3>
  <ul class="tree">
    <li><span class="root">Change a final grade</span><span class="gate or">OR</span>
      <ul>
        <li>A. Steal the teacher's password<span class="gate or">OR</span>
          <ul>
            <li>Phishing email</li>
            <li>Shoulder surfing</li>
            <li>Hardware keylogger<span class="gate and">AND</span>
              <ul><li>Physical access to the desk</li><li>Plug in a USB keylogger</li></ul>
            </li>
          </ul>
        </li>
        <li>B. Access an unlocked computer<span class="gate and">AND</span>
          <ul><li>Teacher leaves the desk unattended</li><li>Open the portal and edit the grade</li></ul>
        </li>
        <li>C. Exploit a software defect<span class="gate or">OR</span>
          <ul><li>SQL injection</li><li>Guess the default password</li></ul>
        </li>
      </ul>
    </li>
  </ul>
  <div class="table">
    <table>
      <thead><tr><th>Method</th><th>Difficulty</th><th>Risk of getting caught</th><th>Defence</th></tr></thead>
      <tbody>
        <tr><td class="key">Phishing email</td><td>Low</td><td>Low to medium</td><td>MFA</td></tr>
        <tr><td class="key">Unattended computer</td><td>Very low</td><td>Very high</td><td>Auto-lock after 2 min</td></tr>
        <tr><td class="key">Shoulder surfing</td><td>Low</td><td>High</td><td>Privacy screen filters</td></tr>
        <tr><td class="key">SQL injection</td><td>High</td><td>Low</td><td>Sanitise input fields</td></tr>
      </tbody>
    </table>
  </div>
  <div class="callout">
    <span class="label">Why B is easy to defend</span>
    <p>It's an <strong>AND</strong> branch, so removing one condition (auto-lock the screen) kills the whole branch. Other examples on the slides: Schneier's "open safe" tree (P = possible, I = impossible) and internet banking (all OR nodes; user terminal, comms channel, banking server).</p>
  </div>
  <p class="source">Lecturer: "Anybody who's interested in working in the red team… this should be really burnt in your brain" (transcript 1:43).</p>
</section>

<section id="nss-stack" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 5–13</span>
    <h2>The network stack</h2>
    <p>"We split the tasks into smaller layers… each task in a layer" (captions l.118–126). Going <strong>down</strong> at the sender, each layer adds a header (<strong>encapsulation</strong>); going <strong>up</strong> at the receiver, each strips one.</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Layer</th><th>Job</th><th>Adds</th><th>Examples</th></tr></thead>
      <tbody>
        <tr><td class="key">Application</td><td>encodes the message for both ends</td><td>the data</td><td>HTTP(S), DNS, DHCP, PGP</td></tr>
        <tr><td class="key">Transport</td><td>numbered chunks, to the right <strong>process</strong></td><td class="loss"><strong>Ports</strong></td><td>TCP (handshake, reliable), UDP (quick)</td></tr>
        <tr><td class="key">Network / Internet</td><td>start to end, <strong>routing</strong></td><td class="loss"><strong>IP addresses</strong></td><td>IPv4, IPv6, IPsec</td></tr>
        <tr><td class="key">Link (MAC)</td><td>to the <strong>next hop</strong></td><td class="loss"><strong>MAC addresses</strong></td><td>Ethernet, Wi-Fi</td></tr>
        <tr><td class="key">Physical</td><td>bits → <strong>signals</strong></td><td>—</td><td>fibre, radio</td></tr>
      </tbody>
    </table>
  </div>
  <p class="mono">[ MAC hdr | IP hdr | TCP/UDP hdr | data ]</p>
  <div class="split">
    <div class="panel"><span class="label">Receiving (slide 12)</span><p>Up to the <strong>network</strong> layer. For this host → up through the <strong>port</strong> to the app. Not for this host → <strong>routing</strong>, back down and out another card (a router). Hop by hop (slide 13).</p></div>
    <div class="panel"><span class="label">Trap: layer numbers</span><p>The slides use three numbering schemes ("Layer 3" = transport on slide 6, network on slide 10). Read the <strong>names</strong>: transport = ports, network = IPs, link = MACs.</p></div>
  </div>
  <p class="source">Peer layers: each header "speaks to" the same layer on the other side (l.256). Ports named in the lecture: 80 (web), 22 (SSH).</p>
</section>

<section id="nss-dns" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 14–20</span>
    <h2>Day in the life: DHCP → ARP → DNS → TCP → HTTP</h2>
    <p>You type <span class="mono">www.google.com</span>, but computers route by IP address. The <strong>Domain Name System</strong> turns the name into the number.</p>
  </div>
  <ol class="steps">
    <li><p>"<strong>Who am I?</strong>" <strong>DHCP</strong> (Host <em>Configuration</em>) gives the laptop its own IP, the first-hop router's IP and the DNS server's IP. Broadcast to everyone, over UDP (quick)</p></li>
    <li><p>"<strong>Who's next door?</strong>" <strong>ARP</strong> (Address <em>Resolution</em>) turns the router's IP into its <strong>MAC</strong>. Before DNS, before HTTP</p></li>
    <li class="dns"><p>"<strong>Where's Google?</strong>" <strong>DNS</strong> (Domain <em>Name</em>) turns the name into Google's <strong>IP</strong>. The query goes in UDP → IP → Ethernet</p></li>
    <li><p>"<strong>Can we talk?</strong>" <strong>TCP</strong> handshake: SYN → SYN-ACK → ACK</p></li>
    <li><p>"<strong>Give me the page.</strong>" <strong>HTTP</strong> request and reply</p></li>
  </ol>
  <h3>The 3-way handshake</h3>
  <div class="table">
    <table>
      <thead><tr><th>#</th><th>Message</th><th>Means</th></tr></thead>
      <tbody>
        <tr><td class="key">1 · laptop →</td><td><strong>SYN</strong> (synchronise)</td><td>"Hi, can we connect?"</td></tr>
        <tr><td class="key">2 · ← Google</td><td><strong>SYN-ACK</strong></td><td>"Got it (ACK). Hi back (SYN), can you hear me?"</td></tr>
        <tr><td class="key">3 · laptop →</td><td><strong>ACK</strong> (acknowledge)</td><td>"Yes, got yours."</td></tr>
      </tbody>
    </table>
  </div>
  <p><strong>Why three:</strong> after step 2 the laptop knows both directions work, but Google doesn't know the laptop got its reply. The ACK tells it (captions l.378–418). Only <strong>TCP</strong> (reliable) handshakes; <strong>UDP</strong> (quick) doesn't, which is why DHCP and DNS use it.</p>
  <div class="split">
    <div class="panel"><span class="label">Passive risk</span><p>Plain DNS isn't encrypted, so an eavesdropper sees every site you look up.</p></div>
    <div class="panel"><span class="label">Active risk</span><p>Spoofing or poisoning the reply sends you to a fake site.</p></div>
    <div class="panel"><span class="label">SYN flood (background)</span><p>Thousands of SYNs, never the final ACK: the server's half-open connections fill up and real users can't connect. Active, DoS, hits <strong>availability</strong>.</p></div>
  </div>
  <p class="source">Defences such as DNSSEC and DNS over HTTPS, and the SYN flood, are background knowledge, not on the slides.</p>
</section>

<section id="nss-layers" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 21–25</span>
    <h2>Security at each layer + which key does what</h2>
    <p>"They are <strong>definitely the most important protocols</strong>." The names give the layer away.</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>Layer</th><th>Protocol</th><th>Protects</th><th>Slide 22</th></tr></thead>
      <tbody>
        <tr><td class="key">Application</td><td><strong>PGP</strong>, S/MIME</td><td>the <strong>message itself</strong> (email), even while stored on servers</td><td>embedded in the application itself</td></tr>
        <tr><td class="key">Transport</td><td><strong>SSL/TLS</strong> (Transport Layer Security)</td><td>the <strong>connection</strong> (HTTPS padlock)</td><td><strong>application-agnostic</strong></td></tr>
        <tr><td class="key">Network</td><td><strong>IPsec</strong> (IP security)</td><td><strong>every IP packet</strong>, any app; VPNs</td><td>covers all applications · <strong>customisation for specific apps is difficult</strong></td></tr>
      </tbody>
    </table>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Symmetric</span><p>Same secret key locks and unlocks → <strong>confidentiality</strong>, fast. Problem: <strong>key distribution</strong> ("that's why we rely more on asymmetric").</p></div>
    <div class="panel"><span class="label">Asymmetric (public-key)</span><p>A linked pair: public (anyone) + private (owner only). Gives <strong>authentication and integrity</strong> with signed hashes (slide 23).</p></div>
  </div>
  <div class="table">
    <table>
      <thead><tr><th>You want to…</th><th>Use</th></tr></thead>
      <tbody>
        <tr><td class="key">send a secret</td><td class="loss"><strong>their public</strong> key</td></tr>
        <tr><td class="key">sign as yourself</td><td class="loss"><strong>your private</strong> key (checked with your public)</td></tr>
      </tbody>
    </table>
  </div>
  <p class="source">Hybrid (added explanation): asymmetric sends the symmetric key, the symmetric key encrypts the data. PGP, TLS and Lab 02 (RSA + AES).</p>
</section>

<section id="nss-hashing" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 23, 31, 46 + captions</span>
    <h2>Hashing vs encryption</h2>
    <p>A <strong>hash function</strong> turns any amount of data into a short, <strong>fixed-size</strong> value (a <strong>message digest</strong>). It's <strong>one-way</strong>: you can't get the data back. Same data → same hash; a tiny change → a completely different hash. So it gives <strong>integrity</strong>, not confidentiality.</p>
  </div>
  <div class="callout">
    <span class="label">Lecturer's analogies</span>
    <p><strong>Paint:</strong> yellow + blue = green, but from the green you can't tell how much of each went in. <strong>Counting the Es</strong> in a long text: the count lets you check the text, but it can't rebuild it.</p>
  </div>
  <div class="table">
    <table>
      <thead><tr><th></th><th>Hash</th><th>Encryption</th></tr></thead>
      <tbody>
        <tr><td class="key">Reversible?</td><td><strong>No</strong>, one-way</td><td><strong>Yes</strong>, with the key</td></tr>
        <tr><td class="key">Output size</td><td>Fixed (SHA-1 = 160 bits, SHA-256 = 256)</td><td>About the input's size</td></tr>
        <tr><td class="key">Gives you</td><td class="loss">Integrity (detects change)</td><td class="loss">Confidentiality</td></tr>
      </tbody>
    </table>
  </div>
  <h3>Hash vs MAC vs signature</h3>
  <div class="table">
    <table>
      <thead><tr><th></th><th>What it is</th><th>Proves who made it?</th><th>Where on the slides</th></tr></thead>
      <tbody>
        <tr><td class="key">Plain hash</td><td>hash(data)</td><td>No: an attacker can change the data <em>and</em> recompute the hash</td><td>—</td></tr>
        <tr><td class="key">MAC / HMAC</td><td>Hash with a <strong>shared secret key</strong></td><td>Yes, someone with the key (no nonrepudiation)</td><td>IPsec AH; SSL Record step 3</td></tr>
        <tr><td class="key">Digital signature</td><td>The hash encrypted with the sender's <strong>private key</strong></td><td>Yes, plus <strong>nonrepudiation</strong></td><td>PGP: 160-bit SHA digest (slide 31)</td></tr>
      </tbody>
    </table>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Trap: MAC ≠ MAC address</span><p>In AH and SSL, <strong>MAC = message authentication code</strong>. In the data-link header it's a hardware address.</p></div>
    <div class="panel"><span class="label">Why both?</span><p>Encryption keeps the data <strong>secret</strong>; the hash shows whether it was <strong>changed</strong> (captions l.916–922).</p></div>
  </div>
  <p class="source">"Hashing is a very big topic" (l.882), but NSS only wants the top layer: one-way, detects change, not the same as encryption.</p>
</section>

<section id="nss-pgp" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 26–41 + captions</span>
    <h2>PGP: Pretty Good Privacy</h2>
    <p>By <strong>Phil Zimmermann</strong> (open standard: <strong>OpenPGP</strong>), for <strong>email and data storage</strong>. A <strong>hybrid</strong> cryptosystem: a random <strong>symmetric session key</strong> encrypts the content, and the <strong>receiver's public key</strong> encrypts that session key. It protects the message at the <strong>application layer</strong>, "before it is stored, forwarded, or read" (slide 28).</p>
  </div>
  <div class="callout">
    <span class="label">Hook: ACCESS</span>
    <p>The 5 services (slide 29): <strong>A</strong>uthentication · <strong>C</strong>onfidentiality · <strong>C</strong>ompression · <strong>E</strong>-mail compatibility · <strong>S</strong>egmentation. The run order is <strong>ACCESS with the two Cs swapped</strong>.</p>
  </div>
  <figure class="fig">
    <svg viewBox="0 0 340 320" role="img" aria-label="PGP order: sign, compress, encrypt, radix-64, segment">
      <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
      <text class="tm" x="48" y="18">Sender's message</text>
      <circle class="acc" cx="22" cy="52" r="16"/><text class="tb" x="22" y="57" text-anchor="middle">A</text><rect class="acc" x="48" y="30" width="290" height="44" rx="6"/><text class="tb" x="60" y="49">1 Sign · Authentication</text><text class="tm" x="60" y="66">SHA digest + sender's private key</text><line class="ln" x1="193" y1="74" x2="193" y2="88" marker-end="url(#ah2)"/><circle class="trp" cx="22" cy="112" r="16"/><text class="tb" x="22" y="117" text-anchor="middle">C</text><rect class="trp" x="48" y="90" width="290" height="44" rx="6"/><text class="tb" x="60" y="109">2 Compress · Compression</text><text class="tm" x="60" y="126">ZIP removes the patterns</text><line class="ln" x1="193" y1="134" x2="193" y2="148" marker-end="url(#ah2)"/><circle class="trp" cx="22" cy="172" r="16"/><text class="tb" x="22" y="177" text-anchor="middle">C</text><rect class="trp" x="48" y="150" width="290" height="44" rx="6"/><text class="tb" x="60" y="169">3 Encrypt · Confidentiality</text><text class="tm" x="60" y="186">session key + receiver's public key</text><line class="ln" x1="193" y1="194" x2="193" y2="208" marker-end="url(#ah2)"/><circle class="acc" cx="22" cy="232" r="16"/><text class="tb" x="22" y="237" text-anchor="middle">E</text><rect class="acc" x="48" y="210" width="290" height="44" rx="6"/><text class="tb" x="60" y="229">4 Radix-64 · E-mail compat.</text><text class="tm" x="60" y="246">Encode binary to ASCII (not encrypt)</text><line class="ln" x1="193" y1="254" x2="193" y2="268" marker-end="url(#ah2)"/><circle class="acc" cx="22" cy="292" r="16"/><text class="tb" x="22" y="297" text-anchor="middle">S</text><rect class="acc" x="48" y="270" width="290" height="44" rx="6"/><text class="tb" x="60" y="289">5 Segment · Segmentation</text><text class="tm" x="60" y="306">split; sig + key in 1st segment only</text>
    </svg>
    <figcaption>ACCESS with the two Cs swapped (orange): Compress before Confidentiality. E = E-mail compatibility = Encode.</figcaption>
  </figure>
  <div class="table">
    <table>
      <thead><tr><th>Step</th><th>Service</th><th>What happens</th></tr></thead>
      <tbody>
        <tr><td class="key">1 Sign</td><td>Authentication</td><td>160-bit <strong>SHA</strong> digest, encrypted with the <strong>sender's private key</strong>, <strong>prepended</strong> to the message</td></tr>
        <tr><td class="key">2 Compress</td><td>Compression</td><td><strong>ZIP</strong>, "after appending the signature but before encryption"</td></tr>
        <tr><td class="key">3 Encrypt</td><td>Confidentiality</td><td>One-time <strong>128-bit session key</strong> (CAST-128 default, IDEA, 3DES; CFB mode). Session key encrypted with the <strong>receiver's public key</strong> (RSA/ElGamal)</td></tr>
        <tr><td class="key">4 Radix-64</td><td>E-mail compatibility</td><td>Binary → <strong>ASCII</strong> (radix-64 = Base64), because email is character-oriented</td></tr>
        <tr><td class="key">5 Segment</td><td>Segmentation</td><td>Split long messages (limit can be <strong>50,000 octets</strong>); signature + session key appear <strong>once, in the first segment</strong></td></tr>
      </tbody>
    </table>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Which key does what</span><p><strong>Sign</strong> = <strong>S</strong>ender's private (checked with the sender's public). <strong>Session key</strong> = locked with the <strong>R</strong>eceiver's public. <strong>Content</strong> = symmetric session key, so public keys are used only "indirectly for confidentiality".</p></div>
    <div class="panel"><span class="label">Why compress before encrypt</span><p>Cryptanalysis hunts <strong>patterns</strong> ("good morning", lots of the letter E; that's how Enigma fell). Compression replaces repeats with symbols, removing them: an "extra layer, extra protection" (captions l.714–754).</p></div>
  </div>
  <h3>Key IDs and key rings (slides 37–39)</h3>
  <div class="table">
    <table>
      <thead><tr><th></th><th>Private key ring</th><th>Public key ring</th></tr></thead>
      <tbody>
        <tr><td class="key">Holds</td><td><strong>My</strong> key pairs</td><td><strong>Other people's</strong> public keys (all email contacts)</td></tr>
        <tr><td class="key">Special column</td><td><strong>Encrypted private key</strong>, locked with a <strong>hash of my passphrase</strong></td><td>Trust fields: Producer Trust, Certificate, Certificate Trust, <strong>Key Legitimacy</strong> (worked out automatically from Certificate Trust)</td></tr>
      </tbody>
    </table>
  </div>
  <p><strong>Key ID</strong> = the <strong>least significant 64 bits of the public key</strong> (8 bytes). It says <em>which</em> key was used, because people can have several. ⚠ Two 64s: radix-64 (encoding) and the 64-bit key ID.</p>
  <h3>Web of trust (slides 40–41)</h3>
  <div class="split">
    <div class="panel"><span class="label">PKI = Pyramid</span><p><strong>Top-down</strong>: a hierarchy of certificate authorities (CAs) signs keys. Like a passport: one authority vouches for you.</p></div>
    <div class="panel"><span class="label">Web of trust = Web</span><p><strong>Bottom-up</strong>: "a user's public key can be signed by <strong>any other user</strong>". If A fully trusts Zaza and Zaza signs Toto's key, A may trust Toto. Friends = <strong>direct</strong> trust, friends' friends = <strong>indirect</strong>.</p></div>
  </div>
  <figure class="fig">
    <svg viewBox="0 0 340 210" role="img" aria-label="PKI is a top-down pyramid of CAs; the web of trust lets any user sign any user's key">
      <defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
      <text class="tb" x="82" y="16" text-anchor="middle">PKI = Pyramid</text>
      <rect class="bad" x="44" y="28" width="76" height="26" rx="5"/><text x="82" y="46" text-anchor="middle">Root CA</text>
      <rect class="bad" x="8" y="82" width="60" height="26" rx="5"/><text x="38" y="100" text-anchor="middle">CA 1</text>
      <rect class="bad" x="96" y="82" width="60" height="26" rx="5"/><text x="126" y="100" text-anchor="middle">CA 2</text>
      <rect class="bx" x="2" y="140" width="48" height="26" rx="5"/><text class="tm" x="26" y="157" text-anchor="middle">Alice</text>
      <rect class="bx" x="56" y="140" width="48" height="26" rx="5"/><text class="tm" x="80" y="157" text-anchor="middle">Bob</text>
      <rect class="bx" x="110" y="140" width="48" height="26" rx="5"/><text class="tm" x="134" y="157" text-anchor="middle">Toto</text>
      <line class="ln" x1="72" y1="54" x2="42" y2="80" marker-end="url(#ah3)"/>
      <line class="ln" x1="92" y1="54" x2="122" y2="80" marker-end="url(#ah3)"/>
      <line class="ln" x1="32" y1="108" x2="27" y2="138" marker-end="url(#ah3)"/>
      <line class="ln" x1="44" y1="108" x2="76" y2="138" marker-end="url(#ah3)"/>
      <line class="ln" x1="128" y1="108" x2="133" y2="138" marker-end="url(#ah3)"/>
      <text class="tm" x="82" y="190" text-anchor="middle">only CAs sign</text><text class="tm" x="82" y="204" text-anchor="middle">trust flows DOWN</text>
      <line class="ln dash" x1="170" y1="8" x2="170" y2="204"/>
      <text class="tb" x="257" y="16" text-anchor="middle">Web of trust = Web</text>
      <rect class="okb" x="178" y="40" width="58" height="26" rx="5"/><text x="207" y="58" text-anchor="middle">A (me)</text>
      <rect class="okb" x="278" y="40" width="58" height="26" rx="5"/><text x="307" y="58" text-anchor="middle">Zaza</text>
      <rect class="okb" x="278" y="130" width="58" height="26" rx="5"/><text x="307" y="148" text-anchor="middle">Toto</text>
      <line class="ln" x1="236" y1="53" x2="276" y2="53" marker-end="url(#ah3)"/><text class="tm" x="257" y="46" text-anchor="middle">trusts</text>
      <line class="ln" x1="307" y1="66" x2="307" y2="128" marker-end="url(#ah3)"/><text class="tm" x="301" y="96" text-anchor="end">signs</text><text class="tm" x="301" y="110" text-anchor="end">Toto's key</text>
      <line class="ln dash" x1="207" y1="66" x2="276" y2="138" marker-end="url(#ah3)"/>
      <text class="tm" x="257" y="190" text-anchor="middle">anyone signs anyone's key</text><text class="tm" x="257" y="204" text-anchor="middle">A trusts Toto via Zaza</text>
    </svg>
    <figcaption>CA, root or hierarchy in an option = PKI, never web of trust.</figcaption>
  </figure>
  <p class="source">Slide 28: the algorithm names are historical, so "focus on the workflow". Lecturer: PGP is "quite old but still very, very much in use".</p>
</section>

<section id="nss-ipsec" class="rv">
  <div class="sec-head">
    <span class="label">Week 2, L02 slides 42–57 + captions</span>
    <h2>IPsec: IP security</h2>
    <p>Security at the <strong>network layer</strong>, so it covers <strong>all applications</strong>: "we're not waiting for the application". Three areas: <strong>authentication, confidentiality, key management</strong>. Biggest use: <strong>VPNs</strong>. <strong>Built into IPv6</strong>, can be used with IPv4.</p>
  </div>
  <div class="callout">
    <span class="label">Why: traffic analysis (said twice)</span>
    <p>Encryption hides <em>what</em> is said, not <em>who talks to whom</em>. A CEO's IP talking to a rival CEO's IP is sensitive on its own, "so we need to <strong>protect the IP headers</strong>". That's what tunnel mode does.</p>
  </div>
  <h3>Transport vs tunnel mode (slides 53–57)</h3>
  <div class="table">
    <table>
      <thead><tr><th></th><th>Transport</th><th>Tunnel</th></tr></thead>
      <tbody>
        <tr><td class="key">Between</td><td><strong>Two hosts</strong>, end to end (client to server)</td><td><strong>Security gateways</strong> (firewall/router) at one or both ends: <strong>VPN</strong></td></tr>
        <tr><td class="key">Protects</td><td>The <strong>payload</strong> ("upper-layer protocols")</td><td>The <strong>entire IP packet</strong>, header included</td></tr>
        <tr><td class="key">Header</td><td>Original header visible; AH/ESP inserted right after it</td><td>Whole packet inside a <strong>new outer IP header</strong> (IP-in-IP)</td></tr>
        <tr><td class="key">Checks</td><td>The <strong>endpoints</strong> do their own</td><td>At the gateways (P and Q); hosts behind them need no IPsec</td></tr>
        <tr><td class="key">Traffic analysis</td><td class="loss">Not stopped (addresses visible)</td><td>Hidden: traffic-flow confidentiality</td></tr>
      </tbody>
    </table>
  </div>
  <figure class="fig">
    <svg viewBox="0 0 340 200" role="img" aria-label="Transport mode encrypts only the payload; tunnel mode encrypts the whole original packet inside a new IP header">
      <text class="tb" x="0" y="16">Transport mode (host to host)</text>
      <rect class="bad" x="1" y="26" width="110" height="42" rx="4"/><text x="56" y="44" text-anchor="middle">Real IP hdr</text><text class="tm" x="56" y="60" text-anchor="middle">VISIBLE</text>
      <rect class="bx" x="111" y="26" width="42" height="42"/><text x="132" y="52" text-anchor="middle">ESP</text>
      <rect class="okb" x="153" y="26" width="186" height="42" rx="4"/><text x="246" y="44" text-anchor="middle">TCP + data</text><text class="tm" x="246" y="60" text-anchor="middle">encrypted (payload only)</text>
      <text class="tm" x="0" y="86">Attacker still sees CEO-A talking to CEO-B</text>
      <text class="tb" x="0" y="118">Tunnel mode (gateway to gateway, VPN)</text>
      <rect class="acc" x="1" y="128" width="86" height="42" rx="4"/><text x="44" y="146" text-anchor="middle">New IP hdr</text><text class="tm" x="44" y="162" text-anchor="middle">GW A to GW B</text>
      <rect class="bx" x="87" y="128" width="40" height="42"/><text x="107" y="154" text-anchor="middle">ESP</text>
      <rect class="okb" x="127" y="128" width="212" height="42" rx="4"/><text x="233" y="146" text-anchor="middle">Real IP hdr + TCP + data</text><text class="tm" x="233" y="162" text-anchor="middle">ALL encrypted</text>
      <text class="tm" x="0" y="188">Attacker sees only gateway to gateway</text>
    </svg>
    <figcaption>Tunnel = the whole car goes into the tunnel. Lecturer: outer box "post office A to post office B", real addresses inside the parcel.</figcaption>
  </figure>
  <p><strong>Tunnel</strong> = the whole car goes into the tunnel, so you can't see who's inside. Lecturer: an outer box addressed "<strong>post office A → post office B</strong>", with the real sender and receiver inside the parcel.</p>
  <h3>Building blocks (slides 46–48)</h3>
  <div class="table">
    <table>
      <thead><tr><th></th><th>AH: Authentication Header</th><th>ESP: Encapsulating Security Payload</th></tr></thead>
      <tbody>
        <tr><td class="key">Gives</td><td><strong>Authentication only</strong> (source + integrity). ⚠ No encryption</td><td><strong>Confidentiality (encryption)</strong>, can also authenticate</td></tr>
        <tr><td class="key">Inside</td><td>32-bit <strong>SPI</strong> (which SA) · <strong>Sequence Number</strong> (anti-replay) · Authentication Data (a <strong>MAC</strong> = message authentication code)</td><td>Encrypted payload (transport) or whole inner packet (tunnel)</td></tr>
      </tbody>
    </table>
  </div>
  <div class="split">
    <div class="panel"><span class="label">Security Association (SA)</span><p>A <strong>one-way</strong> logical connection: two-way traffic needs <strong>two SAs</strong>. Identified by 3 things: the <strong>SPI</strong> (32-bit, local significance only), the <strong>IP destination address</strong> and the <strong>security protocol identifier</strong> (AH or ESP).</p></div>
    <div class="panel"><span class="label">IKE: Internet Key Exchange</span><p>Sets up the SA and keys before AH/ESP can be used. Combines <strong>ISAKMP</strong> (framework), <strong>Oakley</strong> (Diffie-Hellman key; cookie exchange stops the DH clogging attack) and <strong>SKEME</strong> (re-keying). IKE = <strong>UDP port 500</strong>.</p></div>
  </div>
  <h3>"You can read" slides (49–52)</h3>
  <div class="split">
    <div class="panel"><span class="label">SAD vs SPD</span><p><strong>SAD</strong> (SA Database) = the details of each SA: SPI, sequence counter, anti-replay window, AH/ESP info, lifetime, mode (tunnel / transport / wildcard), path MTU. <strong>SPD</strong> (Policy Database) = the rules: which traffic gets which SA, matched by <strong>selectors</strong> (IPs, protocol, name, ports).</p></div>
    <div class="panel"><span class="label">SPD actions</span><p><strong>P</strong>olicy → <strong>Protect, Bypass, Discard</strong>. UDP 500 = IKE → bypass. TCP 443 to the server → bypass, because <strong>TLS already encrypts it</strong> (avoid double encryption).</p></div>
  </div>
  <p class="source">TLS + Heartbleed (slides 58–68) were deferred to week 3; whether they're in Test 1 is unknown.</p>
</section>

<template id="tpl-nss-sheet"><section class="sheet-part"><h2>NSS definitions sheet</h2><h3>L01: Foundations</h3>
<div class="table"><table><thead><tr><th>Term</th><th>Definition</th><th>Source</th></tr></thead><tbody><tr><td class="key"><strong>Computer security</strong> (NIST)</td><td>The protection afforded to an automated information system in order to attain the applicable objectives of preserving the integrity, availability, and confidentiality of information system resources (hardware, software, firmware, information/data, telecommunications)</td><td>NIST Handbook</td></tr><tr><td class="key"><strong>Internet security</strong></td><td>Strategies to discourage, stop, identify and address security breaches related to information transmission (slide 18). Textbook: measures to deter, prevent, detect and correct violations involving the transmission of information</td><td>slide 18; slide 17 notes</td></tr><tr><td class="key"><strong>Confidentiality</strong></td><td>Preserving authorised restrictions on information access and disclosure, incl. protecting personal privacy and proprietary info. <em>Loss = unauthorised disclosure</em></td><td>FIPS 199</td></tr><tr><td class="key"><strong>Integrity</strong></td><td>Guarding against improper information modification or destruction, incl. ensuring nonrepudiation and authenticity. <em>Loss = unauthorised modification or destruction</em></td><td>FIPS 199</td></tr><tr><td class="key"><strong>Availability</strong></td><td>Ensuring timely and reliable access to and use of information. <em>Loss = disruption of access/use</em></td><td>FIPS 199</td></tr><tr><td class="key"><strong>Availability</strong> (property)</td><td>Accessible and usable upon demand by an authorised system entity, according to performance specifications</td><td>X.800 / RFC 4949</td></tr><tr><td class="key"><strong>Authenticity</strong></td><td>Being genuine, verifiable and trusted; users are who they say; inputs come from trusted sources</td><td>slide 26</td></tr><tr><td class="key"><strong>Accountability</strong></td><td>The security goal that generates the requirement for actions of an entity to be traced uniquely to that entity</td><td>slide 26</td></tr><tr><td class="key"><strong>Low / Moderate / High impact</strong></td><td>Limited / serious / severe or catastrophic adverse effect</td><td>FIPS 199</td></tr><tr><td class="key"><strong>Security attack</strong></td><td>Any action that compromises the security of information owned by an organisation</td><td>X.800</td></tr><tr><td class="key"><strong>Security mechanism</strong></td><td>A process (or device) designed to detect, prevent, or recover from a security attack</td><td>X.800</td></tr><tr><td class="key"><strong>Security service</strong></td><td>A processing or communication service that enhances the security of data processing systems and information transfers; counters attacks using one or more mechanisms</td><td>X.800</td></tr><tr><td class="key"><strong>Security service</strong> (alt.)</td><td>A processing or communication service provided by a system to give a specific kind of protection to system resources</td><td>RFC 4949</td></tr><tr><td class="key"><strong>Threat</strong></td><td>A <em>potential</em> for violation of security; a possible danger that might exploit a vulnerability</td><td>RFC 4949</td></tr><tr><td class="key"><strong>Attack</strong></td><td>An assault on system security derived from an intelligent threat; a deliberate attempt to evade security services and violate policy</td><td>RFC 4949</td></tr><tr><td class="key"><strong>Passive attack</strong></td><td>Attempts to learn or use information but does not affect system resources</td><td>X.800</td></tr><tr><td class="key"><strong>Active attack</strong></td><td>Attempts to alter system resources or affect their operation</td><td>X.800</td></tr><tr><td class="key"><strong>Masquerade / Replay / Modification / DoS</strong></td><td>Pretend to be another entity / capture and retransmit / alter, delay or reorder / prevent normal use</td><td>slides 30–32</td></tr><tr><td class="key"><strong>Peer entity authentication</strong></td><td>Corroborates the identity of a peer entity in an association</td><td>X.800</td></tr><tr><td class="key"><strong>Data origin authentication</strong></td><td>Corroborates the source of a data unit (no protection against duplication or modification)</td><td>X.800</td></tr><tr><td class="key"><strong>Access control</strong></td><td>Ability to limit and control access to host systems and applications via communications links</td><td>X.800 (slide 44)</td></tr><tr><td class="key"><strong>Data confidentiality</strong></td><td>Protection of transmitted data from passive attacks. <em>Content</em> (connection → message → fields) and <em>traffic flow</em> (hide source, destination, frequency, length from traffic analysis)</td><td>X.800 (slide 45)</td></tr><tr><td class="key"><strong>Connection-oriented integrity</strong></td><td>Stream: no duplication, insertion, modification, reordering, replay or destruction (so it also addresses DoS)</td><td>X.800 (slide 46)</td></tr><tr><td class="key"><strong>Connectionless integrity</strong></td><td>Individual messages: protects against modification only</td><td>X.800 (slide 46)</td></tr><tr><td class="key"><strong>Nonrepudiation</strong></td><td>Prevents either sender or receiver from denying a transmitted message</td><td>X.800 (slide 47)</td></tr><tr><td class="key"><strong>Attack surface</strong></td><td>The reachable and exploitable vulnerabilities in a system</td><td>slide 51</td></tr><tr><td class="key"><strong>Attack tree</strong></td><td>Branching, hierarchical data structure representing a set of potential techniques for exploiting security vulnerabilities</td><td>slide 54 [MAUW05, MOOR01, SCHN99]</td></tr><tr><td class="key"><strong>Root / subnode / leaf</strong></td><td>Root = the goal of the attack; subnodes = subgoals; leaves = concrete ways to initiate an attack</td><td>slides 53–59</td></tr><tr><td class="key"><strong>AND-node / OR-node</strong></td><td>AND: <em>all</em> subgoals required. OR: <em> agement · architecture &amp; configuration · vulnerability management · identity &amp; access management · data security · logging &amp; monitoring · incident management · supply chain security (new)</li><li><strong>Standards bodies:</strong> nist (US) → <strong>FIPS</strong> + <strong>SP</strong> · ISOC → home of <strong>IETF</strong> + <strong>IAB</strong> → <strong>RFCs</strong> · ncsc (UK, part of <strong>GCHQ</strong>; predecessor CESG)</li></ul>

<h3>L02: Network security basics</h3>
<div class="table"><table><thead><tr><th>Term</th><th>Definition</th><th>Source</th></tr></thead><tbody><tr><td class="key"><strong>Layering</strong></td><td>Breaking up the sending of messages into separate components and activities; each component handles a different part of the communication (the TCP/IP model)</td><td>slide 6</td></tr><tr><td class="key"><strong>Symmetric key cryptography</strong></td><td>Encrypting data where the <strong>same secret key</strong> is used for both encryption and decryption. Provides <strong>confidentiality</strong></td><td>slide 23</td></tr><tr><td class="key"><strong>Public-key (asymmetric) cryptography</strong></td><td>Uses <strong>pairs of mathematically linked keys</strong> (public + private) for operations such as encrypting messages or digitally signing them. With signed message digests, provides <strong>authentication and integrity</strong></td><td>slide 23</td></tr><tr><td class="key"><strong>Hash / message digest</strong></td><td>A <strong>one-way</strong> function: "generates something from the data that <strong>cannot be [reversed]</strong> back". Comparing the received data's hash with the sent hash <strong>detects modification</strong> (<strong>integrity</strong>). Encryption is the reversible one (with the key) → confidentiality. Signed digests give <strong>authentication + integrity</strong></td><td>captions l.850–922; slide 23</td></tr><tr><td class="key"><strong>MAC (message authentication code)</strong></td><td>A hash computed <strong>with a secret key</strong> (e.g. <strong>HMAC</strong>); IPsec AH's Authentication Data ("SHA-1 or HMAC") and SSL Record step 3. <em>Not</em> a MAC address</td><td>slides 46, 63</td></tr><tr><td class="key"><strong>PGP</strong></td><td>A <strong>hybrid cryptosystem</strong> (Phil Zimmerman; open standard OpenPGP) protecting the message itself at the <strong>application layer</strong>, mainly email and stored data</td><td>slides 3, 26</td></tr><tr><td class="key"><strong>Key ID (PGP)</strong></td><td>The <strong>least significant 64 bits</strong> of the public key (8 bytes)</td><td>slide 37</td></tr><tr><td class="key"><strong>Web of trust</strong></td><td>A <strong>bottom-up</strong> approach to binding a public key to its owner (any user can sign another's key), in contrast to <strong>hierarchical PKI/CA</strong></td><td>slide 40</td></tr><tr><td class="key"><strong>IPsec</strong></td><td>A group of protocols that <strong>encrypt and/or authenticate all traffic at the IP level</strong>; authentication + confidentiality + key management at the <strong>network layer</strong>; largest use = <strong>VPNs</strong>; built into IPv6, usable with IPv4</td><td>slides 43–45</td></tr><tr><td class="key"><strong>AH</strong></td><td>Authentication Header: IP-level <strong>authentication</strong> (source verification + integrity); SPI, <strong>sequence number (anti-replay)</strong>, authentication data (MAC)</td><td>slide 46</td></tr><tr><td class="key"><strong>ESP</strong></td><td>Encapsulating Security Payload: IP-level <strong>confidentiality through encryption</strong>; can also authenticate</td><td>slide 46</td></tr><tr><td class="key"><strong>Security Association (SA)</strong></td><td>A <strong>one-way</strong> logical connection between sender and receiver that affords security services to its traffic; identified by <strong>SPI + IP destination address + security protocol identifier</strong></td><td>slide 47</td></tr><tr><td class="key"><strong>SPI</strong></td><td>Security Parameters Index: a <strong>32-bit</strong> unsigned integer with <strong>local significance only</strong>, carried in AH/ESP headers to select the SA</td><td>slide 47</td></tr><tr><td class="key"><strong>IKE</strong></td><td>Internet Key Exchange: establishes SAs and keys; combines <strong>ISAKMP + Oakley (Diffie-Hellman) + SKEME (re-keying)</strong>; <strong>UDP 500</strong></td><td>slides 48, 52</td></tr><tr><td class="key"><strong>SAD / SPD</strong></td><td>Security Association Database (the parameters of each SA) / Security Policy Database (relates IP traffic to SAs via <strong>selectors</strong>; actions PROTECT, BYPASS, DISCARD)</td><td>slides 49–52</td></tr><tr><td class="key"><strong>Transport mode</strong></td><td>Protects the IP <strong>payload</strong> (upper-layer protocols); <strong>end-to-end between two hosts</strong>; the original IP header stays visible</td><td>slides 53–54, 57</td></tr><tr><td class="key"><strong>Tunnel mode</strong></td><td>Protects the <strong>entire IP packet</strong> by encapsulating it in a new outer IP header (IP-in-IP); used when one or both ends are a <strong>security gateway</strong> (VPNs); hides the original addresses</td><td>slides 53–54, 57</td></tr><tr><td class="key"><strong>SSL/TLS</strong></td><td>Transport-layer security <strong>immediately above TCP</strong>; SSL by <strong>Netscape 1995</strong>; <strong>SSLv3 → TLS 1.0 (RFC 2246)</strong> by the IETF; relies on <strong>CA certificates</strong></td><td>slide 59</td></tr><tr><td class="key"><strong>Connection (SSL)</strong></td><td>A one-time, transient peer-to-peer transport of information; every connection belongs to a session</td><td>slide 62</td></tr><tr><td class="key"><strong>Session (SSL)</strong></td><td>An enduring client–server association with a set of security parameters (e.g. the <strong>48-byte master secret</strong>); can have many connections</td><td>slide 62</td></tr><tr><td class="key"><strong>Heartbeat extension</strong></td><td>Keeps an SSL/TLS session alive during lulls without renegotiating; HeartbeatRequest/Response; sits on the Record Protocol</td><td>slide 66</td></tr><tr><td class="key"><strong>Heartbleed</strong></td><td>2014 bug (discovered 7 Apr 2014): the receiver didn't check the declared <strong>payload_length</strong> against the real size, so up to <strong>2¹⁶ bytes</strong> of memory (keys, passwords) leaked</td><td>slide 68</td></tr></tbody></table></div>
<h4>Key lists (L02)</h4>
<ul><li><strong>Security by layer</strong> (slides 3, 22): <strong>application</strong> = PGP, S/MIME (security embedded in the app) · <strong>transport</strong> = SSL/TLS (application-agnostic) · <strong>network</strong> = IPsec (covers all applications; hard to customise per app)</li><li><strong>What each header adds</strong> (slides 9–11): transport = <strong>source/destination ports</strong> · network = <strong>source/destination IP</strong> (+ routing) · data link/MAC = <strong>destination/source MAC</strong></li><li><strong>Day in the life</strong> (slides 14–20): <strong>DHCP</strong> (get IP, first-hop router, DNS server) → <strong>ARP</strong> (router's MAC) → <strong>DNS</strong> (google.com's IP) → <strong>TCP</strong> SYN / SYNACK → <strong>HTTP</strong> request/reply</li><li><strong>PGP's 5 services</strong> (slide 29): authentication · confidentiality · compression · e-mail compatibility · segmentation</li><li><strong>PGP pipeline:</strong> sign (SHA digest + sender's private key) → compress (<strong>ZIP</strong>) → encrypt (session key; CAST-128/IDEA/3DES in <strong>CFB</strong>; key under the receiver's public key, RSA/ElGamal) → <strong>radix-64/Base64</strong> → segment (signature and session key appear once, in the first segment; limits as low as <strong>50,000 octets</strong>)</li><li><strong>PGP key rings:</strong> private (own key pairs; private keys encrypted with a hash of the passphrase) · public (correspondents' keys, with trust fields; <strong>key legitimacy</strong> derived from <strong>certificate trust</strong>)</li><li><strong>IPsec functional areas (3):</strong> authentication · confidentiality · key management</li><li><strong>IPsec applications (4):</strong> branch-office connectivity · remote access · extranet/intranet with partners · e-commerce security</li><li><strong>SA identifiers (3):</strong> SPI · IP destination address · security protocol identifier (AH/ESP)</li><li><strong>SAD fields (9):</strong> SPI · sequence number counter · sequence counter overflow · anti-replay window · AH info · ESP info · lifetime · IPsec protocol mode · path MTU</li><li><strong>SPD selectors (5):</strong> remote IP · local IP · next-layer protocol · name (OS user ID) · local and remote ports</li><li><strong>IKE = 3 protocols:</strong> ISAKMP · Oakley (Diffie-Hellman; <strong>cookie exchange</strong> thwarts the DH <strong>clogging</strong> attack) · SKEME (re-keying)</li><li><strong>SSL/TLS protocols (4 in 2 layers):</strong> Handshake · Change Cipher Spec · Alert (upper) · <strong>Record</strong> (lower, above TCP)</li><li><strong>Record Protocol (5 steps):</strong> fragment (<strong>≤ 2¹⁴ = 16,384 bytes</strong>) → compress (optional) → add MAC → encrypt (symmetric) → prepend header (content type, version, length)</li><li><strong>Handshake (4 phases):</strong> establish capabilities → server authentication/key exchange → client key exchange/authentication → finish</li><li><strong>SSL authentication types:</strong> server-only · server-client (mutual)</li></ul>

<h3>L03: Authentication and password security</h3>
<h4>Definitions (slide wording)</h4>
<ul><li><strong>Authentication:</strong> verifying that "you are who you say you are" (slide 4).</li><li><strong>Authorisation:</strong> verifying that "you are permitted to do what you are trying to do" (slide 4).</li><li><strong>Salt:</strong> "a unique, randomly generated value added to each password before hashing" (slide 40). Stored with the hash.</li><li><strong>Pepper:</strong> "a secret value (shared across passwords) not stored in DB (e.g. stored in HSM or separate vault)" (slide 41).</li><li><strong>Work factor:</strong> "how expensive the hashing computation is (iterations, memory, CPU)" (slide 42).</li><li><strong>TOTP:</strong> "uses a shared secret key and the current time to generate a temporary, single-use code" (Lab 03 §4).</li><li><strong>Rainbow table:</strong> "a precomputed table of hashes for common passwords" (Lab 03 §3).</li><li><strong>Key line:</strong> "Security breaks not where it is weakest individually, but where design coherence fails" (slide 8).</li></ul>
<h4>Key lists (L03)</h4>
<ul><li><strong>Core operations (3):</strong> registration → authentication checks → recovery (slide 7).</li><li><strong>Threats to passwords (8):</strong> cracking of hashes/brute force · offline cracking · phishing/keyloggers/sniffers · password recovery/reset systems · educated guesswork · reuse of passwords · default passwords · password embedded in code (slide 11).</li><li><strong>Phishing types (5):</strong> social engineering · link manipulation · spear · clone · voice (vishing) (slides 21–23).</li><li><strong>Software keylogger techniques (3):</strong> form-grabbing · JavaScript keyloggers · API/system hook interception (slide 17).</li><li><strong>Prevention (slides 31–35):</strong> 2FA · protect password files · federated authentication · complexity · lock-out · self-test · detection/containment · patterns of use · suspicious activity · password timeouts (NCSC: forced changes backfire).</li><li><strong>Legacy-hash upgrades (3):</strong> re-hash on login · layered <code>bcrypt(md5(password))</code> · force reset (slide 43).</li><li><strong>Slow password hashes with built-in salt:</strong> Argon2 · bcrypt · PBKDF2 (slide 40).</li></ul>
<h4>Formula and numbers</h4>
<ul><li><strong>Entropy ≈ length × log2(pool size)</strong> (Lab 03 §1). Pools: lowercase 26 · + uppercase 52 · + digits 62 · all printable ≈ 94.</li><li><strong>Length bands (Lab 03 §1):</strong> 8 = weak · 12 = good · 16+ = excellent.</li><li><strong>bcrypt string:</strong> <code>$2b$12$…</code> = version · work factor 12 · salt · hash (Lab 03 §2).</li><li><strong>NordPass reuse:</strong> US 62% · UK 60% · Germany 50% · overall ~57% · 1,727 adults (slides 28–29).</li><li><strong>Spear phishing:</strong> "91% of attacks" (slide 22). <strong>bcrypt guess:</strong> ~100 ms (Lab 03 §5).</li></ul></section><section class="sheet-part"><h2>NSS acronyms cheat sheet</h2><div class="callout c-note"><span class="label">Where the expansions come from</span><p>The acronyms come from the lecture and lab pages. Most expansions are the standard ones <strong>(background knowledge)</strong>, because the slides often use an acronym without spelling it out. The "Meaning" column says how <em>this course</em> uses each one.</p></div>

<h3>Which week 1 document is which</h3>

<h3>Week 2: networks and crypto</h3>
<h4>The network stack and the "day in the life"</h4>
<div class="table"><table><thead><tr><th>Acronym</th><th>Stands for</th><th>Meaning in the course</th></tr></thead><tbody><tr><td class="key"><strong>TCP/IP</strong></td><td>Transmission Control Protocol / Internet Protocol</td><td>The internet's layered model; watch the slide-numbering trap</td></tr><tr><td class="key"><strong>TCP</strong></td><td>Transmission Control Protocol</td><td>Reliable, connection-oriented transport (SYN → SYNACK → ACK handshake)</td></tr><tr><td class="key"><strong>UDP</strong></td><td>User Datagram Protocol</td><td>Connectionless transport; carries DHCP, DNS and IKE (port 500)</td></tr><tr><td class="key"><strong>IP</strong> (IPv4/IPv6)</td><td>Internet Protocol</td><td>The network layer: addresses and routing</td></tr><tr><td class="key"><strong>SYN / SYNACK / ACK</strong></td><td>Synchronise / Synchronise-Acknowledge / Acknowledge</td><td>The TCP three-way handshake. DHCP also has its own "DHCP ACK"</td></tr><tr><td class="key"><strong>MAC</strong> (address)</td><td>Media Access Control</td><td>The link-layer hardware address; the MAC header is added last (see Traps)</td></tr><tr><td class="key"><strong>NIC</strong></td><td>Network Interface Card</td><td>Puts the frame's bits on the wire</td></tr><tr><td class="key"><strong>LAN / WAN</strong></td><td>Local / Wide Area Network</td><td>e.g. the school LAN 68.80.2.0/24 in the scenario</td></tr><tr><td class="key"><strong>DHCP</strong></td><td>Dynamic Host Configuration Protocol</td><td>Step 1: gives the laptop its IP, first-hop router and DNS server</td></tr><tr><td class="key"><strong>ARP</strong></td><td>Address Resolution Protocol</td><td>Step 2: finds the router's MAC address from its IP (broadcast query)</td></tr><tr><td class="key"><strong>DNS</strong></td><td>Domain Name System</td><td>Step 3: turns www.google.com into an IP address</td></tr><tr><td class="key"><strong>HTTP / HTTPS</strong></td><td>HyperText Transfer Protocol (Secure)</td><td>Step 5: the web request. HTTPS = HTTP over TLS</td></tr><tr><td class="key"><strong>RIP · OSPF · IS-IS · BGP</strong></td><td>Routing Information Protocol · Open Shortest Path First · Intermediate System to Intermediate System · Border Gateway Protocol</td><td>The routing protocols that build the tables carrying the DNS query</td></tr><tr><td class="key"><strong>ICMP</strong></td><td>Internet Control Message Protocol</td><td>Network-layer control and error messages (e.g. ping). In the SPD example, ICMP error messages are BYPASSed</td></tr><tr><td class="key"><strong>NAT</strong></td><td>Network Address Translation</td><td>Rewrites IP addresses at a router</td></tr><tr><td class="key"><strong>MTU</strong></td><td>Maximum Transmission Unit</td><td>Largest packet size on a link (the SAD's "Path MTU" field)</td></tr><tr><td class="key"><strong>DMZ</strong></td><td>Demilitarised Zone</td><td>The semi-public network segment in the SPD example (server 1.2.4.10)</td></tr><tr><td class="key"><strong>ISP</strong></td><td>Internet Service Provider</td><td>e.g. Comcast in the scenario</td></tr><tr><td class="key"><strong>VPN</strong></td><td>Virtual Private Network</td><td>A typical use of IPsec tunnel mode</td></tr><tr><td class="key"><strong>SSH</strong></td><td>Secure Shell</td><td>Encrypted remote login</td></tr><tr><td class="key"><strong>ASCII</strong></td><td>American Standard Code for Information Interchange</td><td>Text encoding. PGP's radix-64 turns binary into ASCII for e-mail compatibility</td></tr></tbody></table></div>
<h4>Security protocols</h4>
<div class="table"><table><thead><tr><th>Acronym</th><th>Stands for</th><th>Meaning in the course</th></tr></thead><tbody><tr><td class="key"><strong>PGP</strong></td><td>Pretty Good Privacy</td><td>E-mail security at the <strong>application</strong> layer: sign → compress → encrypt → radix-64 → segment</td></tr><tr><td class="key"><strong>S/MIME</strong></td><td>Secure/Multipurpose Internet Mail Extensions</td><td>The other application-layer e-mail security standard</td></tr><tr><td class="key"><strong>SSL</strong></td><td>Secure Sockets Layer</td><td>The original <strong>transport-layer</strong> protocol, which became TLS</td></tr><tr><td class="key"><strong>TLS</strong></td><td>Transport Layer Security</td><td>4 protocols on 2 layers; Record + Handshake; Heartbleed</td></tr><tr><td class="key"><strong>IPsec</strong></td><td>IP security</td><td>Security at the <strong>network</strong> layer: AH/ESP, transport/tunnel</td></tr><tr><td class="key"><strong>AH</strong></td><td>Authentication Header</td><td>IPsec authentication only (<strong>no</strong> encryption)</td></tr><tr><td class="key"><strong>ESP</strong></td><td>Encapsulating Security Payload</td><td>IPsec encryption (+ optional authentication)</td></tr><tr><td class="key"><strong>SA</strong></td><td>Security Association</td><td>A <strong>one-way</strong> relationship, identified by SPI + destination IP + protocol ID</td></tr><tr><td class="key"><strong>SPI</strong></td><td>Security Parameter Index</td><td>The bit string that identifies an SA</td></tr><tr><td class="key"><strong>SAD</strong></td><td>Security Association Database</td><td>Holds each SA's parameters (sequence counter, anti-replay window, lifetime, mode, Path MTU…)</td></tr><tr><td class="key"><strong>SPD</strong></td><td>Security Policy Database</td><td>Selectors → PROTECT / BYPASS / DISCARD</td></tr><tr><td class="key"><strong>IKE</strong></td><td>Internet Key Exchange</td><td>IPsec key management = ISAKMP + Oakley + SKEME (UDP 500)</td></tr><tr><td class="key"><strong>ISAKMP</strong></td><td>Internet Security Association and Key Management Protocol</td><td>IKE's framework for negotiating SAs</td></tr><tr><td class="key"><strong>SKEME</strong></td><td>Secure Key Exchange Mechanism</td><td>One of IKE's three building blocks (Oakley isn't an acronym)</td></tr><tr><td class="key"><strong>DH</strong></td><td>Diffie-Hellman</td><td>Key exchange used by Oakley/IKE; the "clogging attack" targets it</td></tr></tbody></table></div>

ining"],"a":1,"w":"Keep systems protected throughout their lifecycle. Architecture and configuration is designing and building them securely."},{"id":"nss-147","mod":"nss","src":"Q147","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"After a ransomware attack, a company follows a tested plan to restore its systems from backups, so services are back within hours. Which CAF objective?","o":["A: managing security risk","B: protecting against cyber attack","C: detecting cyber security events","D: minimising the impact of incidents","none, because the CAF only covers policy"],"a":3,"w":"Recovering = D. Spotting it = C. Hook: Assess, Block, Catch, Deal with it."},{"id":"nss-148","mod":"nss","src":"Q148","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"An attacker records the electromagnetic emissions from a phone while it signs a payment, and works out the signing key. Which threat scenario?","o":["eavesdropper on data in transit","side channel attack on data in use","storage security attack on data at rest","middle-person attack on data in transit","traffic analysis"],"a":1,"w":"No message, no second party: the phone is working (in use) and leaks EM, a side effect. Middle-person needs two parties talking."},{"id":"nss-149","mod":"nss","src":"Q149","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"An attacker puts a microphone next to a laptop and recovers its RSA key from the high-pitched sounds the CPU makes while decrypting.","o":["middle-person attack on data in transit","storage security attack on data at rest","fault injection on data in use","side channel attack on data in use","eavesdropper on data in transit"],"a":3,"w":"It hears the machine, not a message. Sound, power, timing, heat, EM = side channel."},{"id":"nss-150","mod":"nss","src":"Q150","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"An attacker sets up a fake Wi-Fi hotspot, passes a user's traffic on to their bank, and changes the payee's account number on the way through.","o":["side channel attack on data in use","middle-person attack on data in transit","storage security attack on data at rest","fault injection on data in use","traffic analysis"],"a":1,"w":"Two parties talking, the attacker sits between them and alters the message."},{"id":"nss-151","mod":"nss","src":"Q151","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"An attacker on the same network silently captures unencrypted emails between two members of staff, changing nothing.","o":["middle-person attack on data in transit","fault injection on data in use","eavesdropper on data in transit","side channel attack on data in use","storage security attack on data at rest"],"a":2,"w":"Silently captures = only listens to the message = eavesdropper. Middle-person relays or alters."},{"id":"nss-152","mod":"nss","src":"Q152","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"Someone measures how much power a smartcard uses while it checks a PIN, to work out the secret.","o":["eavesdropper on data in transit","fault injection on data in use","middle-person attack on data in transit","storage security attack on data at rest","side channel attack on data in use"],"a":4,"w":"Power is a side effect of the machine. No message is being sent, so it can't be eavesdropping."},{"id":"nss-153","mod":"nss","src":"Q153","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Which header holds the source and destination port numbers?","o":["MAC header","IP header","TCP/UDP header","Ethernet trailer","the application data"],"a":2,"w":"Port = which Program. Added by the transport layer."},{"id":"nss-154","mod":"nss","src":"Q154","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"A router receives a packet that isn't addressed to itself. How far up the stack does it go before being forwarded?","o":["application layer","transport layer","network layer","it isn't unpacked at all","physical layer only"],"a":2,"w":"The router reads the IP (network layer), then routes it back down and out another card (slide 12)."},{"id":"nss-155","mod":"nss","src":"Q155","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Which layer adds the source and destination IP addresses?","o":["transport","network / internet","data link","application","physical"],"a":1,"w":"Transport = ports, network = IPs, link = MACs. Read names, not numbers."},{"id":"nss-156","mod":"nss","src":"Q156","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Which address changes at every hop on the way from a laptop to a web server?","o":["destination IP address","source port","destination port","MAC address","the URL"],"a":3,"w":"MAC = the Machine next door, so it is rewritten at every hop. The IP addresses stay the same start to end."},{"id":"nss-157","mod":"nss","src":"Q157","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"Before the DNS query can leave the laptop, it must find out the router's MAC address. Which protocol does this?","o":["DHCP","DNS","ARP","HTTP","TCP"],"a":2,"w":"Address Resolution: IP → MAC. It comes before DNS and HTTP (slide 17)."},{"id":"nss-158","mod":"nss","src":"Q158","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why is the third step (ACK) of the TCP handshake needed?","o":["to send the web page","so the server knows the client received its SYN-ACK","to get the server's IP address","to encrypt the connection","to find the router's MAC address"],"a":1,"w":"After step 2 the client knows both directions work; the server doesn't know its reply arrived (captions l.378–418)."},{"id":"nss-159","mod":"nss","src":"Q159","wk":["2"],"off":false,"m":null,"t":"mcq","s":"An attacker times exactly how long a server takes to reject each wrong password, and uses the tiny differences to guess the right one.","o":["eavesdropper on data in transit","middle-person attack on data in transit","storage security attack on data at rest","side channel attack on data in use","fault injection on data in use"],"a":3,"w":"Timing is a side effect of the machine while it checks (in use). It never reads the stored data, so not at rest."},{"id":"nss-160","mod":"nss","src":"Q160","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"The laptop knows the name google.com but not Google's IP address. Which protocol finds it?","o":["ARP","DHCP","DNS","TCP","HTTP"],"a":2,"w":"Domain Name System: name → IP. HTTP is the last step, fetching the page."},{"id":"nss-161","mod":"nss","src":"Q161","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Right after joining the Wi-Fi, which protocol gives the laptop its own IP address?","o":["DNS","TCP","ARP","DHCP","HTTP"],"a":3,"w":"Host Configuration: your IP, the router's IP and the DNS server's IP (slides 15–16)."},{"id":"nss-162","mod":"nss","src":"Q162","wk":["2"],"off":false,"m":null,"t":"mcq","s":"What is the correct order when a new laptop opens a web page?","o":["DNS, DHCP, ARP, TCP, HTTP","DHCP, ARP, DNS, TCP, HTTP","ARP, DHCP, DNS, HTTP, TCP","DHCP, DNS, ARP, HTTP, TCP","TCP, DHCP, ARP, DNS, HTTP"],"a":1,"w":"Who am I → who's next door → where's Google → can we talk → give me the page."},{"id":"nss-163","mod":"nss","src":"Q163","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the TCP handshake, which message does the client send first?","o":["ACK","SYN-ACK","SYN","FIN","HTTP GET"],"a":2,"w":"SYN = synchronise, \"can we connect?\""},{"id":"nss-164","mod":"nss","src":"Q164","wk":["2"],"off":false,"m":null,"t":"mcq","s":"An attacker sends thousands of TCP SYNs and never sends the final ACK, so real users can't connect. Which CIA principle is hit?","o":["confidentiality","integrity","availability","nonrepudiation","authenticity"],"a":2,"w":"A SYN flood is denial of service (background knowledge, not on the slides)."},{"id":"nss-165","mod":"nss","src":"Q165","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which protocol works at the network layer and protects all IP traffic for every application?","o":["PGP","S/MIME","TLS","IPsec","HTTP"],"a":3,"w":"IP-sec secures the IP (network) layer. PGP = application, TLS = transport (slide 22)."},{"id":"nss-166","mod":"nss","src":"Q166","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Alice wants to send Bob a secret message using public-key cryptography. Which key does she encrypt it with?","o":["Alice's private key","Alice's public key","Bob's public key","Bob's private key","a shared secret key"],"a":2,"w":"Lock with their public: only Bob's private key opens it."},{"id":"nss-167","mod":"nss","src":"Q167","wk":["2"],"off":false,"m":null,"t":"mcq","s":"What is the main problem with symmetric cryptography that made the lecturer say \"we rely more on asymmetric\"?","o":["it is too slow","it can't give confidentiality","getting the shared key safely to the other side","the keys are too long","it only works at the network layer"],"a":2,"w":"Key distribution: the military flew the key over in a locked box."},{"id":"nss-168","mod":"nss","src":"Q168","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"Alice signs a document so anyone can check it came from her. Which key does she sign with?","o":["Bob's public key","Alice's private key","Alice's public key","Bob's private key","a shared secret key"],"a":1,"w":"Sign with your private: only Alice has it. Signing with her public key proves nothing, because everyone has it."},{"id":"nss-169","mod":"nss","src":"Q169","wk":["2"],"off":false,"m":null,"t":"mcq","s":"According to slide 22, what is a downside of IPsec?","o":["it only protects email","customising it for specific applications is difficult","every app developer must build it in","it only works over UDP","it can't encrypt data"],"a":1,"w":"Upside: covers all applications. Downside: hard to customise per app."},{"id":"nss-170","mod":"nss","src":"Q170","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Bob receives a contract signed by Alice. Which key does Bob use to check the signature is really Alice's?","o":["Bob's private key","Bob's public key","Alice's public key","Alice's private key","a shared session key"],"a":2,"w":"Signed with Alice's private, checked with Alice's public."},{"id":"nss-171","mod":"nss","src":"Q171","wk":["2"],"off":false,"m":null,"t":"mcq","s":"What makes a hash different from encryption?","o":["it uses two keys","it's one-way: you can't get the original data back","its output is the same size as the input","it gives confidentiality","it needs the receiver's public key"],"a":1,"w":"Captions l.850; hash functions."},{"id":"nss-172","mod":"nss","src":"Q172","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Bob receives a file and its hash. He hashes the file himself and gets a different value. What does this tell him?","o":["the file is confidential","the file was changed (integrity is lost)","the sender's private key was stolen","the file was encrypted","nothing"],"a":1,"w":"Different hash = something changed (captions l.872–876)."},{"id":"nss-173","mod":"nss","src":"Q173","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In IPsec's Authentication Header, the \"MAC\" in the authentication data means:","o":["MAC address","message authentication code (a hash made with a secret key)","the media access control layer","mandatory access control","machine address code"],"a":1,"w":"Not a MAC address. Hash + secret key = MAC (slide 46)."},{"id":"nss-174","mod":"nss","src":"Q174","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which pair is right?","o":["hash → confidentiality, encryption → integrity","hash → integrity, encryption → confidentiality","both give confidentiality","both are reversible","a hash needs a key"],"a":1,"w":"hash functions."},{"id":"nss-175","mod":"nss","src":"Q175","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In PGP, which key creates the digital signature?","o":["the receiver's public key","the one-time session key","the sender's private key","the receiver's private key","the sender's public key"],"a":2,"w":"A 160-bit SHA digest is encrypted with the sender's private key (slide 31)."},{"id":"nss-176","mod":"nss","src":"Q176","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why does PGP compress before encrypting?","o":["so radix-64 output is shorter","compression removes plaintext patterns that cryptanalysis exploits","the signature can only be computed on compressed data","the session key is too short otherwise","so segmentation is never needed"],"a":1,"w":"Frequency analysis looks for patterns; compression removes them (captions l.714–754)."},{"id":"nss-177","mod":"nss","src":"Q177","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"Which is PGP's order of operations?","o":["encrypt → sign → compress → radix-64 → segment","sign → compress → encrypt → radix-64 → segment","compress → sign → encrypt → radix-64 → segment","sign → encrypt → compress → radix-64 → segment","radix-64 → sign → compress → encrypt → segment"],"a":1,"w":"ACCESS with the two Cs swapped. Sign first, segment last, compress before encrypt."},{"id":"nss-178","mod":"nss","src":"Q178","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"In PGP, which step comes immediately after encryption?","o":["ZIP compression","creating the SHA digest","segmentation","radix-64 conversion to ASCII","signing"],"a":3,"w":"The E in ACCESS is E-mail compatibility (encode), not encryption."},{"id":"nss-179","mod":"nss","src":"Q179","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"A long PGP email is split into 3 segments. Where do the signature and session key appear?","o":["repeated in all three","only in the last","once, typically in the first segment","in a separate fourth segment","nowhere"],"a":2,"w":"They're on the front of the message, and segmentation happens last (slide 35)."},{"id":"nss-180","mod":"nss","src":"Q180","wk":["2"],"off":false,"m":null,"t":"mcq","s":"What does PGP's e-mail compatibility service do?","o":["encrypts with the session key","converts binary output into ASCII using radix-64","signs the digest","splits the message under 50,000 octets","compresses with ZIP"],"a":1,"w":"Slide 34 (Base64 = radix-64)."},{"id":"nss-181","mod":"nss","src":"Q181","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which PGP step comes immediately before radix-64 conversion?","o":["segmentation","compression","signing","encryption","reassembly"],"a":3,"w":"Slide 35."},{"id":"nss-182","mod":"nss","src":"Q182","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why does the PGP signature appear only in the first segment of a long message?","o":["segmentation happens after signing, so the signature at the front lands in the first piece","each segment uses a different private key","the receiver's public key only decrypts the first segment","radix-64 removes it from later segments","it is added after segmentation"],"a":0,"w":"The signature is prepended (slide 31); segmentation is last (slide 35)."},{"id":"nss-183","mod":"nss","src":"Q183","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A PGP key ID consists of:","o":["the first 128 bits of the session key","the least significant 64 bits of the public key","a 160-bit SHA digest of the private key","the email address hashed with the passphrase","the most significant 64 bits of the private key"],"a":1,"w":"8 bytes (slide 37). ⚠ Two 64s: radix-64 (encoding) and the 64-bit key ID."},{"id":"nss-184","mod":"nss","src":"Q184","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"How does PGP's web of trust differ from PKI?","o":["it is hierarchical with one root CA","only CAs can sign keys","a government CA vouches for each key","it is bottom-up: any user can sign another user's public key","it uses symmetric keys instead"],"a":3,"w":"Web = bottom-up, PKI = Pyramid. CA/root/hierarchy = PKI."},{"id":"nss-185","mod":"nss","src":"Q185","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the private key ring, how are private keys stored?","o":["in plaintext","encrypted with the receiver's public key","compressed and radix-64 encoded","encrypted, typically using a hash of the user's passphrase","split into 50,000-octet segments"],"a":3,"w":"Slide 38."},{"id":"nss-186","mod":"nss","src":"Q186","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"In PGP's web of trust, who can sign a user's public key?","o":["only the root CA","only the key's owner","any other user","only users in the same domain","only a government-approved CA"],"a":2,"w":"\"A user's public key can be signed by any other user\" (slide 40)."},{"id":"nss-187","mod":"nss","src":"Q187","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which public key ring field does PGP derive automatically from the Certificate Trust values?","o":["Key ID","Producer Trust","Timestamp","Key Legitimacy","User ID"],"a":3,"w":"Slide 40."},{"id":"nss-188","mod":"nss","src":"Q188","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"Which statement about PGP's web of trust is correct?","o":["trust is issued top-down by a CA hierarchy","only keys signed by a root CA are trusted","it is bottom-up: users sign each other's public keys","it replaces public keys with symmetric keys","each key must be signed by the owner's employer"],"a":2,"w":"Elimination rule: CA / root / hierarchy in an option = PKI."},{"id":"nss-189","mod":"nss","src":"Q189","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which describes how public keys are vouched for in PGP?","o":["a root CA signs every key and trust flows down","the user's email provider vouches","only the owner can sign it","session keys are signed by the receiver's public key","users sign each other's keys, building trust bottom-up through people they already trust"],"a":4,"w":"Slide 40."},{"id":"nss-190","mod":"nss","src":"Q190","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which IPsec mode encrypts the whole original packet, header included, inside a new IP packet?","o":["transport","wildcard","tunnel","AH","bypass"],"a":2,"w":"IP-in-IP with a new outer header (slides 53–54)."},{"id":"nss-191","mod":"nss","src":"Q191","wk":["2"],"off":false,"m":null,"t":"mcq","s":"An attacker can't read the encrypted data but sees the CEO's PC talking to a rival's finance server. Which is correct?","o":["transport mode prevents this","it's a replay attack","IPsec always hides addresses","it's traffic analysis; tunnel mode hides the real addresses","it's a side-channel attack"],"a":3,"w":"Transport mode leaves the original header visible."},{"id":"nss-192","mod":"nss","src":"Q192","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Transport mode is typically used for:","o":["end-to-end traffic between two hosts","site-to-site VPNs between firewalls","hosts behind a firewall without IPsec","hiding the original header from routers","gateway-to-gateway traffic"],"a":0,"w":"B–E all describe tunnel mode."},{"id":"nss-193","mod":"nss","src":"Q193","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which IPsec component gives confidentiality through encryption?","o":["AH","SPI","IKE","ESP","Sequence Number"],"a":3,"w":"AH = authentication only; ESP = encryption (+ optional auth)."},{"id":"nss-194","mod":"nss","src":"Q194","wk":["2"],"off":false,"m":"13 Oct","t":"mcq","s":"The Sequence Number in the IPsec Authentication Header is there to:","o":["identify the SA","reorder fragmented packets","encrypt the payload","prevent replay attacks","store the packet hash"],"a":3,"w":"TCP sequence numbers = order; IPsec AH = anti-replay."},{"id":"nss-195","mod":"nss","src":"Q195","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which statement about an IPsec Security Association is correct?","o":["two-way, covering both directions","identified only by source IP","a one-way logical connection, so two-way exchange needs two SAs","set up by the AH","identified by the destination MAC address"],"a":2,"w":"Slide 47. Identified by SPI + IP destination address + security protocol identifier (AH or ESP)."},{"id":"nss-196","mod":"nss","src":"Q196","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Within IKE, which protocol is based on Diffie-Hellman and creates the encryption key?","o":["ISAKMP","Oakley","SKEME","ESP","AH"],"a":1,"w":"SKEME = re-keying; ISAKMP = the framework."},{"id":"nss-197","mod":"nss","src":"Q197","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Bob captures a valid IPsec packet and resends it ten minutes later. Which AH field helps the receiver detect this?","o":["SPI","Authentication Data","Next Header","Payload Length","Sequence Number"],"a":4,"w":"Anti-replay (slide 46)."},{"id":"nss-198","mod":"nss","src":"Q198","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which three actions can an IPsec SPD entry specify?","o":["encrypt, decrypt, sign","allow, deny, log","protect, bypass, discard","tunnel, transport, wildcard","accept, reject, forward"],"a":2,"w":"Policy → Protect, Bypass, Discard. D are the SAD's modes."},{"id":"nss-199","mod":"nss","src":"Q199","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the host SPD example, why is TCP 443 to the server set to BYPASS?","o":["443 is IKE's port","the server is outside the DMZ","TLS already encrypts it, so IPsec would encrypt twice","HTTPS can't run over IP","ESP doesn't support TCP"],"a":2,"w":"IKE is UDP 500 (slide 52)."},{"id":"nss-200","mod":"nss","src":"Q200","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"An attacker times how long a smartcard takes to reject each wrong PIN digit and works out the PIN. This is:","o":["eavesdropping","middle-person","fault injection","side-channel","storage attack"],"a":3,"w":"Timing = machine behaviour (L01 slide 35)."},{"id":"nss-201","mod":"nss","src":"Q201","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Which address does a router read to forward a packet towards its final destination?","o":["port number","MAC address","IP address","sequence number","SPI"],"a":2,"w":"L02 slide 12."},{"id":"nss-202","mod":"nss","src":"Q202","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"RFC 4949 is published by:","o":["ITU-T","NIST","NCSC","ISO","IETF"],"a":4,"w":"RFC → IETF, always."},{"id":"nss-203","mod":"nss","src":"Q203","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"An employee has admin rights and could delete the customer database, but hasn't done anything. This is best described as:","o":["an attack","a threat","a vulnerability being exploited","a passive attack","a countermeasure"],"a":1,"w":"Only a potential (RFC 4949)."},{"id":"nss-204","mod":"nss","src":"Q204","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"On a café's open Wi-Fi, an attacker captures the packets of an unencrypted login and reads the password. This is:","o":["side-channel","eavesdropping","fault injection","storage attack","replay"],"a":1,"w":"They read the message itself while it travelled."},{"id":"nss-205","mod":"nss","src":"Q205","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Alice signs a PGP email to Bob. Which key creates the signature?","o":["Alice's private","Bob's public","Alice's public","Bob's private","the session key"],"a":0,"w":"Slide 31."},{"id":"nss-206","mod":"nss","src":"Q206","wk":["1","2"],"off":false,"m":"the mock","t":"mcq","s":"Which is PGP's correct order of operations?","o":["sign → encrypt → compress → radix-64 → segment","compress → sign → encrypt → radix-64 → segment","sign → compress → radix-64 → encrypt → segment","sign → compress → encrypt → radix-64 → segment","sign → compress → encrypt → segment → radix-64"],"a":3,"w":"Encrypt-before-compress is always wrong."},{"id":"nss-207","mod":"nss","src":"Q207","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Carol fully trusts Dave, and Dave has signed Erin's public key. Which is correct?","o":["Carol can't trust Erin's key until a root CA signs it","Carol may trust Erin's key, because someone she trusts signed it","Erin must sign Carol's key first","only Erin's own signature makes it valid","Erin's employer must sign it"],"a":1,"w":"Slide 40."},{"id":"nss-208","mod":"nss","src":"Q208","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"In PGP, the one-time session key is encrypted with:","o":["the sender's private key","the receiver's public key","the receiver's private key","the sender's public key","a hash of the passphrase"],"a":1,"w":"Only the receiver's private key can then open it."},{"id":"nss-209","mod":"nss","src":"Q209","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Two branch offices are linked by a VPN between their firewalls, so outsiders can't see which internal hosts talk. Which IPsec mode?","o":["transport","AH-only","wildcard","bypass","tunnel"],"a":4,"w":"Slides 54, 56."},{"id":"nss-210","mod":"nss","src":"Q210","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Packets need source authentication and integrity, but no encryption. Which IPsec component fits?","o":["ESP","IKE","AH","SPD","Oakley"],"a":2,"w":"AH authenticates; it never encrypts."},{"id":"nss-211","mod":"nss","src":"Q211","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"The order of the TCP three-way handshake is:","o":["SYN, ACK, SYN-ACK","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK","SYN, SYN, ACK","SYN, SYN-ACK, ACK"],"a":4,"w":"L02 §3."},{"id":"nss-212","mod":"nss","src":"Q212","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Thousands of SYNs, never completed, leave the server with half-open connections. Which goal is attacked?","o":["availability","confidentiality","integrity","authenticity","accountability"],"a":0,"w":"SYN flood = denial of service."},{"id":"nss-213","mod":"nss","src":"Q213","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"A laptop knows its gateway's IP but needs its MAC address. Which protocol?","o":["DNS","DHCP","ARP","HTTP","TCP"],"a":2,"w":"L02 §3."},{"id":"nss-214","mod":"nss","src":"Q214","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Before requesting www.gold.ac.uk, the browser needs its IP address. Which protocol finds it?","o":["ARP","DNS","DHCP","HTTP","ICMP"],"a":1,"w":"Domain Name → IP."},{"id":"nss-215","mod":"nss","src":"Q215","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"A thief steals a backup hard drive from an office cupboard. The data was:","o":["in transit","in use","at rest","in motion","in memory"],"a":2,"w":"Storage."},{"id":"nss-216","mod":"nss","src":"Q216","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Bob's hash of a downloaded file matches the published value. This shows:","o":["the file was not changed (integrity)","it was kept secret","the sender can't deny sending it","it was encrypted","it is available"],"a":0,"w":"hash functions."},{"id":"nss-217","mod":"nss","src":"Q217","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"Passive attacks such as traffic analysis are best dealt with by:","o":["detection and recovery","prevention, e.g. encryption","restoring backups","rate limiting","fault injection"],"a":1,"w":"L01."},{"id":"nss-218","mod":"nss","src":"Q218","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"\"Every access must be checked against the access control mechanism.\" Which principle?","o":["least privilege","separation of privilege","economy of mechanism","open design","complete mediation"],"a":4,"w":"L01 design principles."},{"id":"nss-219","mod":"nss","src":"Q219","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"Under FIPS 199, a severe or catastrophic adverse effect is rated:","o":["Low","Moderate","Critical","High","Severe"],"a":3,"w":"Low = limited, Moderate = serious, High = severe or catastrophic."},{"id":"nss-220","mod":"nss","src":"Q220","wk":["1","2"],"off":false,"m":"13 Oct","t":"mcq","s":"A microphone near a laptop picks up the CPU's high-pitched sounds while it decrypts, and the attacker works out the key. This is:","o":["eavesdropping","middle-person","storage attack","replay","side-channel"],"a":4,"w":"Sound from the machine = side channel, always. Judge by what they listened to, not what they got."},{"id":"nss-221","mod":"nss","src":"Q221","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"An attacker measures a payment terminal's power draw while it checks a PIN and works out the PIN. This is:","o":["eavesdropping","side-channel","fault injection","storage attack","middle-person"],"a":1,"w":"Exam rule: timing, power, heat, sound, fan, EM, CPU → side channel."},{"id":"nss-222","mod":"nss","src":"Q222","wk":["2"],"off":true,"m":null,"t":"mcq","s":"Which of the following correctly represents the three principles of the CIA Triad?","o":["Confidentiality, Identification, Authorization","Control, Integrity, Access","Confidentiality, Integrity, Availability","Communication, Integrity, Assurance"],"a":2,"w":""},{"id":"nss-223","mod":"nss","src":"Q223","wk":["2"],"off":true,"m":"14 Oct","t":"mcq","s":"What is the main function of the Application Layer in the TCP/IP model?","o":["Adding sender and recipient IP addresses.","Breaking messages into packets and reassembling them.","Encoding and decoding messages for the sender and receiver.","Transmitting packets between network nodes."],"a":2,"w":"L02 slide wording: the application layer \"encodes/decodes the message in a form that is understood by the sender and the recipient\". a = network layer (IP addresses)."},{"id":"nss-224","mod":"nss","src":"Q224","wk":["2"],"off":true,"m":"14 Oct","t":"card","s":"Provide one example of a private IPv4 address range.","back":"<p><strong>192.168.0.0/16<\/strong> (or 10.0.0.0/8, or 172.16.0.0/12). <em>Background knowledge (RFC 1918): not on the NSS slides.<\/em><\/p>"},{"id":"nss-225","mod":"nss","src":"Q225","wk":["2"],"off":true,"m":null,"t":"mcq","s":"PGP uses only symmetric encryption to secure messages.","o":["True","False"],"a":1,"w":"PGP is hybrid (symmetric session key + public-key encryption of that key)."},{"id":"nss-226","mod":"nss","src":"Q226","wk":["2"],"off":true,"m":"14 Oct","t":"mcq","s":"How does PGP maintain message confidentiality?","o":["The message is encrypted with a random session key, which is then encrypted with the recipient's public key.","The message is encrypted directly with the sender's private key.","The message is encrypted using only the recipient's public key.","The session key is stored in plaintext for recovery."],"a":0,"w":"L02 slide 32. \"only the public key\" ignores the session key."},{"id":"nss-227","mod":"nss","src":"Q227","wk":["2"],"off":true,"m":null,"t":"mcq","s":"What mechanism does PGP use to provide authentication?","o":["Hashing the message without signing it.","Encrypting messages with the recipient's private key.","Digital signatures created with the sender's private key."],"a":2,"w":""},{"id":"nss-228","mod":"nss","src":"Q228","wk":["2"],"off":true,"m":null,"t":"mcq","s":"In the PGP Web of Trust, key authenticity is verified through a central Certificate Authority.","o":["True","False"],"a":1,"w":"Web = bottom-up, users sign each other's keys."},{"id":"nss-229","mod":"nss","src":"Q229","wk":["2"],"off":true,"m":"14 Oct","t":"mcq","s":"Which IPSec component provides encryption for IP packets?","o":["Internet Key Exchange (IKE)","Encapsulating Security Payload (ESP)","Authentication Header (AH)"],"a":1,"w":"<strong>E<\/strong>SP = <strong>E<\/strong>ncryption; <strong>A<\/strong>H = <strong>A<\/strong>uthentication only."},{"id":"nss-230","mod":"nss","src":"Q230","wk":["2"],"off":true,"m":null,"t":"mcq","s":"Which statement best describes Tunnel Mode in IPSec?","o":["Only the data payload is encrypted.","The entire IP packet is encrypted and encapsulated within a new IP header.","Tunnel Mode performs only authentication."],"a":1,"w":""},{"id":"nss-231","mod":"nss","src":"Q231","wk":["2"],"off":true,"m":"14 Oct","t":"card","s":"What protocol is primarily used by IPSec to establish a Security Association (SA) and exchange encryption keys?","back":"<p><strong>IKE (Internet Key Exchange)<\/strong>, UDP 500 (L02 slides 48, 52).<\/p>"},{"id":"nss-232","mod":"nss","src":"Q232","wk":["2"],"off":true,"m":"14 Oct","t":"mcq","s":"Which statement correctly distinguishes SSL/TLS from IPSec?","o":["Both operate at the same network layer.","IPSec is only used for web browsers.","SSL/TLS operates at the transport layer, while IPSec works at the network layer."],"a":2,"w":"PGP = application, TLS = transport, IPsec = network (L02 slides 3, 22)."},{"id":"nss-233","mod":"nss","src":"Q233","wk":["2"],"off":true,"m":"14 Oct","t":"mcq","s":"A user encrypts an email using PGP. The recipient can read it but cannot verify who sent it. Which step was most likely omitted?","o":["Signing the message with their private key.","Encrypting the session key with the recipient's public key.","Compressing the message before encryption."],"a":0,"w":"Readable = confidentiality worked; unverifiable sender = no signature."},{"id":"nss-234","mod":"nss","src":"Q234","wk":["3"],"off":false,"m":null,"t":"mcq","s":"According to the lecture, authorisation is the process of verifying that:","o":["you are who you say you are","you are permitted to do what you are trying to do","your password is strong enough","your device is not infected","your session key is fresh"],"a":1,"w":"A is authentication (L03 slide 4)."},{"id":"nss-235","mod":"nss","src":"Q235","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The three core operations in authentication (slide 7) are:","o":["identification, authorisation, accounting","registration, authentication checks, recovery","hashing, salting, peppering","enrolment, encryption, expiry","login, logout, lock-out"],"a":1,"w":""},{"id":"nss-236","mod":"nss","src":"Q236","wk":["3"],"off":false,"m":null,"t":"mcq","s":"\"If recovery is too simple, it can bypass or weaken strong authentication.\" The slide's conclusion is that security breaks where:","o":["the password is shortest","design coherence fails","the hash is fastest","users are untrained","encryption is missing"],"a":1,"w":"\"Security breaks not where it is weakest individually, but where design coherence fails\" (slide 8)."},{"id":"nss-237","mod":"nss","src":"Q237","wk":["3"],"off":false,"m":null,"t":"mcq","s":"On the security/convenience quadrant (slide 10), which approach is shown as both high security and convenient?","o":["passwords","passwords + 2FA","security questions","passwordless authentication","default passwords"],"a":3,"w":"Passwords + 2FA = high security but inconvenient; passwords = convenient but low security."},{"id":"nss-238","mod":"nss","src":"Q238","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is NOT one of the eight threats to passwords on slide 11?","o":["offline cracking","password embedded in code","default passwords","side-channel timing of the CPU","reuse of passwords"],"a":3,"w":"The eight: cracking/brute force, offline cracking, phishing/keyloggers/sniffers, recovery/reset systems, educated guesswork, reuse, default passwords, embedded in code."},{"id":"nss-239","mod":"nss","src":"Q239","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why do brute-force attackers often target obscure services such as SSH and LDAP (slide 12)?","o":["they have no passwords","to reduce the chances of detection","they use weaker hashes","they run on UDP","they cannot be locked out"],"a":1,"w":""},{"id":"nss-240","mod":"nss","src":"Q240","wk":["3"],"off":false,"m":null,"t":"mcq","s":"An attacker downloads a server's password file and guesses passwords on their own GPU rig before logging in once. This is:","o":["phishing","offline cracking","credential stuffing","vishing","a replay attack"],"a":1,"w":"Slide 14. It's hard to detect because there's no flood of failed logins."},{"id":"nss-241","mod":"nss","src":"Q241","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Against which attack does making a password longer and more complex help LEAST?","o":["online brute force","offline cracking of an unsalted hash","educated guesswork","a keylogger","a dictionary attack"],"a":3,"w":"The keylogger reads it as typed: \"it does not matter how long or complex a password the user has chosen\" (slides 15, 32)."},{"id":"nss-242","mod":"nss","src":"Q242","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is a disadvantage of a hardware keylogger compared with a software one?","o":["it is easy for antivirus to detect","it needs physical access to install and retrieve","it can only capture JavaScript forms","it runs in kernel mode","it slows the network"],"a":1,"w":"Slide 17. Hardware ones are stealthy and hard for software to detect."},{"id":"nss-243","mod":"nss","src":"Q243","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which sign most directly suggests a keylogger is sending its logs out?","o":["a disappearing cursor","keyboard lag","elevated network traffic from an unknown process","a new desktop wallpaper","a full disk"],"a":2,"w":"Slide 18."},{"id":"nss-244","mod":"nss","src":"Q244","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The DarkHotel campaign delivered keyloggers mainly through:","o":["infected USB sticks posted to staff","unsecured hotel Wi-Fi","a compromised certificate authority","SIM swapping","SQL injection on booking sites"],"a":1,"w":"Then it erased itself to avoid detection (slides 16, 25)."},{"id":"nss-245","mod":"nss","src":"Q245","wk":["3"],"off":false,"m":null,"t":"mcq","s":"An attacker copies a real invoice e-mail the victim received last week, swaps the link for a malicious one and resends it from a spoofed copy of the original sender's address. This is:","o":["spear phishing","vishing","clone phishing","link manipulation only","whaling"],"a":2,"w":"Slide 22."},{"id":"nss-246","mod":"nss","src":"Q246","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Phishing aimed at a specific person or company using gathered personal information is called:","o":["clone phishing","spear phishing","vishing","smishing","pharming"],"a":1,"w":"The slide says it accounts for \"91% of attacks\" (slide 22)."},{"id":"nss-247","mod":"nss","src":"Q247","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why does the NCSC advise against forcing users to change passwords regularly (slide 35)?","o":["it overloads the helpdesk only","users adopt predictable sequences (e.g. changing a digit), which makes guessing easier","hashes cannot be recomputed","it breaks 2FA","it is illegal under GDPR"],"a":1,"w":"Protecting the hashes is the better measure."},{"id":"nss-248","mod":"nss","src":"Q248","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Passwords should be hashed rather than encrypted because:","o":["hashing is reversible with the key","encryption is one-way","if the encryption key is exposed, every plaintext password is recoverable","hashes are longer","encryption cannot handle Unicode"],"a":2,"w":"Hashing is one-way; encryption is two-way (slide 37)."},{"id":"nss-249","mod":"nss","src":"Q249","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which statement about a salt is correct?","o":["it is the same for all users and kept out of the database","it is a unique random value per password, stored alongside the hash, and neutralises rainbow tables","it must be kept secret in an HSM","it makes hashing reversible","changing it forces every user to reset their password"],"a":1,"w":"A, C and E describe a <strong>pepper<\/strong> (slides 40–41)."},{"id":"nss-250","mod":"nss","src":"Q250","wk":["3"],"off":false,"m":null,"t":"mcq","s":"A pepper is:","o":["a unique value per user stored in the DB","a secret value shared across passwords and not stored in the DB","the bcrypt work factor","the TOTP shared secret","a public IV"],"a":1,"w":"E.g. in an HSM or vault; pre- or post-hashing (as an HMAC key) (slide 41)."},{"id":"nss-251","mod":"nss","src":"Q251","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why are MD5 and SHA-256 poor choices for storing passwords?","o":["they are reversible","they are too slow for logins","they are fast, so attackers can test billions of guesses per second","they cannot be salted","they produce variable-length output"],"a":2,"w":"Lab 03 §2. Fine for file integrity, terrible for passwords."},{"id":"nss-252","mod":"nss","src":"Q252","wk":["3"],"off":false,"m":null,"t":"mcq","s":"A bcrypt hash such as <code>$2b$12$...<\/code> contains:","o":["only the hash","the hash and the pepper","the algorithm version, the work factor, the salt and the hash","the plaintext length and the hash","the user ID and the salt"],"a":2,"w":"Lab 03 §2; this is \"embed work factor/parameters in hash metadata\" (slide 44)."},{"id":"nss-253","mod":"nss","src":"Q253","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why is TOTP considered more secure than 2FA codes sent by SMS?","o":["TOTP codes never expire","SMS can be intercepted and numbers stolen via SIM swapping","TOTP uses no shared secret","SMS codes are longer","TOTP needs no clock"],"a":1,"w":"Lab 03 §4. TOTP = shared secret + current time."},{"id":"nss-254","mod":"nss","src":"Q254","wk":["3"],"off":false,"m":null,"t":"mcq","s":"In the order the lecturer gave them, the SSL Record Protocol steps are:","o":["encrypt → compress → MAC → fragment → header","fragment → compress → add MAC → encrypt → add record header","fragment → encrypt → compress → MAC → header","header → fragment → MAC → encrypt → compress","compress → fragment → encrypt → MAC → header"],"a":1,"w":"Captions l.88–100; slides 63 (week 2). Compression is optional."},{"id":"nss-255","mod":"nss","src":"Q255","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The lecturer's distinction between a connection and a session:","o":["a session is one message, a connection is the whole conversation","a connection is a one-time thing (one input in a conversation); a session is the conversation itself","they are the same thing","a connection is encrypted, a session is not","a session uses UDP, a connection uses TCP"],"a":1,"w":"Captions l.74–78."},{"id":"nss-256","mod":"nss","src":"Q256","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which SSL protocol did the lecturer place at the <strong>lower<\/strong> layer?","o":["Handshake","Change Cipher Spec","Alert","Record","Heartbeat"],"a":3,"w":"Handshake, Change Cipher Spec and Alert are upper layers (captions l.64–68)."},{"id":"nss-257","mod":"nss","src":"Q257","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Why does the heartbeat extension exist?","o":["to speed up encryption","to keep a session alive without the server ending it too early or leaving it open too long","to replace the TCP handshake","to rotate the master secret","to compress records"],"a":1,"w":"Too early = repeated re-authentication; too late = open sessions that can be hijacked (captions l.146–160)."},{"id":"nss-258","mod":"nss","src":"Q258","wk":["3"],"off":false,"m":null,"t":"mcq","s":"According to the lecturer, what fixes the Heartbleed bug?","o":["a longer key","disabling compression","a simple if condition that checks the requested length and otherwise discards","moving to IPsec","salting the heartbeat"],"a":2,"w":"Captions l.264–272."},{"id":"nss-259","mod":"nss","src":"Q259","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which is the lecturer's example of how attackers avoid detection when brute-forcing?","o":["attacking the main login page faster","using a botnet, or targeting a forgotten, unmonitored server (e.g. via SSH)","using HTTPS","only trying at night","turning off their firewall"],"a":1,"w":"Captions l.492–534."},{"id":"nss-260","mod":"nss","src":"Q260","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The lecturer said the easiest way to hack a password-protected system is usually through:","o":["the registration form","the \"forgot my password\" recovery process","the TLS handshake","the password hash algorithm","2FA"],"a":1,"w":"Recovery security \"is not on the same level\" (captions l.336–346)."},{"id":"nss-261","mod":"nss","src":"Q261","wk":["3"],"off":false,"m":null,"t":"mcq","s":"Which threat did the lecturer call \"the most important attack of them all\", because of generative AI?","o":["shoulder surfing","default passwords","passwords embedded in code (e.g. on public GitHub)","keyloggers","vishing"],"a":2,"w":"Captions l.756–784."},{"id":"nss-262","mod":"nss","src":"Q262","wk":["3"],"off":false,"m":null,"t":"mcq","s":"In the Cain and Abel video, which cracking method is \"the fastest… but only if it's in the list\"?","o":["brute force","cryptanalysis","dictionary attack","rainbow-table reduction","phishing"],"a":2,"w":"Captions l.914–928."},{"id":"nss-263","mod":"nss","src":"Q263","wk":["3"],"off":false,"m":null,"t":"mcq","s":"The lecturer described work factor as being about:","o":["making a hash mathematically unbreakable","how much time and resources you force the attacker to spend","the length of the salt","the number of users","the pepper's location"],"a":1,"w":"Five days vs ten years (captions l.1038–1048)."},{"s":"An attacker intercepts a bank transfer and changes the amount before it reaches the bank. This is primarily a loss of:","o":["confidentiality","integrity","availability","accountability","privacy"],"a":1,"w":"Changing data is modification, which is an integrity loss.","id":"nss-s1","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A breach causes significant financial loss and significant harm to individuals, but no loss of life. The FIPS 199 impact level is:","o":["Low","Limited","Moderate","High","Serious"],"a":2,"w":"Significant harm without loss of life is Moderate.","id":"nss-s2","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A hacker group has the skills and the motive to break into a council's network but hasn't done anything yet. In RFC 4949 terms this is:","o":["an attack","a threat","a mechanism","a service","an intrusion"],"a":1,"w":"Nothing has happened yet, so it is still only a potential.","id":"nss-s3","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"Messages are encrypted, but an attacker can still see who talks to whom, how often and how long. Which X.800 service is meant to hide this?","o":["connectionless integrity","traffic-flow confidentiality","data origin authentication","access control","nonrepudiation"],"a":1,"w":"The attacker wants to SEE the pattern, so it's confidentiality, specifically traffic-flow confidentiality.","id":"nss-s4","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"Connection-oriented integrity protects a stream against all of these EXCEPT:","o":["duplication","reordering","replay","modification","traffic analysis"],"a":4,"w":"Traffic analysis is SEEING (a passive attack), so it belongs to confidentiality. A–D are all CHANGING the stream.","id":"nss-s5","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"A lecturer receives an email and wants assurance that it really came from the claimed sender. There was no earlier contact between them. Which service fits best?","o":["access control","peer entity authentication","data origin authentication","connection-oriented integrity","availability service"],"a":2,"w":"The trigger is the source of a single message, e.g. email. Peer entity authentication is for a live connection between two parties.","id":"nss-s6","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"An attacker records an encrypted login message and sends it again later to get in. Which service most directly counters this?","o":["data confidentiality","traffic-flow confidentiality","connection-oriented data integrity","availability service","access control"],"a":2,"w":"Replay is active: the harm is the resending, which works even though the message is encrypted. Confidentiality doesn't stop it.","id":"nss-s7","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"The X.800 data integrity service deals with active attacks. Its main emphasis is therefore:","o":["prevention only","detection (with or without recovery)","deterrence","encryption","traffic padding"],"a":1,"w":"Active attacks are too hard to prevent outright, so integrity is about detection, ideally with automated recovery.","id":"nss-s8","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"A supplier later claims it never received a customer's order. Which service gives the customer proof that it was received?","o":["data origin authentication","access control","nonrepudiation","data confidentiality","availability service"],"a":2,"w":"Nonrepudiation works in both directions: proof of who sent it, and proof that it was received.","id":"nss-s9","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A firewall blocks all traffic unless a rule explicitly allows it. Which principle is this?","o":["complete mediation","fail-safe defaults","least privilege","economy of mechanism","layering"],"a":1,"w":"The default answer is NO. Complete mediation is about checking every time, not about the default.","id":"nss-s10","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"Permissions are re-checked on every read of a file, not only when the file is first opened. Which principle is this?","o":["fail-safe defaults","isolation","complete mediation","least common mechanism","open design"],"a":2,"w":"Every access, every time, with no trusting an earlier decision.","id":"nss-s11","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A company uses a publicly published encryption algorithm and keeps only the keys secret. Which principle is this?","o":["fail-safe defaults","open design","encapsulation","modularity","least astonishment"],"a":1,"w":"Security must not depend on attackers not knowing the design. No security by obscurity.","id":"nss-s12","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"A cleaner's ID card opens classrooms and corridors but not the server room. Which principle is this?","o":["separation of privilege","least privilege","isolation","complete mediation","least common mechanism"],"a":1,"w":"No \"two\" in the question, just how far one person's access reaches, so it's least privilege.","id":"nss-s13","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"9 Oct"},{"s":"Staff must enter a password AND tap a smart card to open the exam system. Which principle is this?","o":["least privilege","layering","separation of privilege","economy of mechanism","complete mediation"],"a":2,"w":"One gate needing two conditions is separation of privilege. Layering is several separate gates in a row.","id":"nss-s14","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A university keeps its public website on a different server from the official results database, so a hacked website can't reach the results. Which principle is this?","o":["least privilege","layering","isolation","encapsulation","open design"],"a":2,"w":"Public systems kept apart from critical ones: the first of isolation's three contexts.","id":"nss-s15","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"Logging in passes browser protections, then a password, then an authenticator app. If one fails, the others still protect you. Which principle is this?","o":["separation of privilege","modularity","complete mediation","fail-safe defaults","layering"],"a":4,"w":"\"If one fails, the others still stand\" is defence in depth, i.e. layering.","id":"nss-s16","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A student-record object keeps its grade private; other code can only use getGrade() and setGrade(). Which principle is this?","o":["encapsulation","isolation","least common mechanism","economy of mechanism","psychological acceptability"],"a":0,"w":"Isolation with designated entry points, based on object-oriented design.","id":"nss-s17","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"Many protocols share one crypto library, which can be upgraded without redesigning the rest of the system. Which principle is this?","o":["least common mechanism","layering","open design","modularity","least astonishment"],"a":3,"w":"The \"shared\" trap: least common mechanism is about USERS sharing. One reusable code module is modularity.","id":"nss-s18","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A new entry check takes so long that staff start propping the side door open. Which principle was ignored?","o":["psychological acceptability","economy of mechanism","complete mediation","fail-safe defaults","isolation"],"a":0,"w":"If security gets in the way of people's work, they bypass it.","id":"nss-s19","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A button labelled \"Encrypt\" only hides the message preview; the message is still sent unencrypted. Which principle does this break most clearly?","o":["open design","least astonishment","fail-safe defaults","isolation","economy of mechanism"],"a":1,"w":"The system doesn't behave the way the user expects.","id":"nss-s20","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A system has a small attack surface and deep layering. Its security risk is:","o":["low","medium","high","critical","impossible to judge"],"a":0,"w":"0 bad things (small surface, deep layering) → low.","id":"nss-s21","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A system has a large attack surface but deep layering. Its security risk is:","o":["low","medium","high","critical","negligible"],"a":1,"w":"1 bad thing (large surface) → medium. Deep layering doesn't make it low.","id":"nss-s22","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"11 Oct"},{"s":"A system has a large attack surface and shallow layering. Its security risk is:","o":["low","medium","high","negligible","the same as small surface + deep layering"],"a":2,"w":"2 bad things → high.","id":"nss-s23","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"A trusted employee with access to sensitive data could be tricked by a phishing email. Which attack surface category is this?","o":["network","software","human","physical","cryptographic"],"a":2,"w":"Social engineering and trusted insiders are the human attack surface.","id":"nss-s24","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"In an attack tree, a node whose goal is achieved if any ONE of its children succeeds is:","o":["a root node","a leaf node","an AND-node","an OR-node","an asset node"],"a":3,"w":"OR = either… or. AND needs all of its children.","id":"nss-s25","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"In an attack tree, the root node represents:","o":["the cheapest attack","the attacker's goal (the security incident)","the first step the attacker takes","the defender's countermeasure","the most likely vulnerability"],"a":1,"w":"Root = the goal. Leaves = the different ways to initiate the attack.","id":"nss-s26","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"To stop an attacker reaching a goal through an OR branch, the defender must block:","o":["any one child","the cheapest child only","every child","the root only","nothing, OR branches can't be blocked"],"a":2,"w":"OR means any one child is enough for the attacker, so every child must be blocked. For an AND branch, blocking one child is enough.","id":"nss-s27","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":"11 Oct"},{"s":"\"Access an unlocked computer\" is an AND of (teacher leaves desk unattended) and (open portal and edit grade). Which single defence kills this branch?","o":["MFA","auto-lock the screen after 2 minutes","privacy screen filters","sanitising input fields","longer passwords"],"a":1,"w":"AND branch: remove one condition. Auto-lock means an unattended desk no longer gives access.","id":"nss-s28","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"In the change-a-grade attack tree, which method is the hardest but least likely to get you caught?","o":["phishing email","shoulder surfing","unattended computer","SQL injection","hardware keylogger"],"a":3,"w":"SQL injection: difficulty high, risk of getting caught low. Defence: sanitise input fields.","id":"nss-s29","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"Hashing on its own mainly provides which property?","o":["confidentiality","integrity","availability","anonymity","access control"],"a":1,"w":"A hash detects change. Confidentiality comes from encryption.","id":"nss-s30","mod":"nss","t":"mcq","src":"phone site","wk":["2"],"off":false,"m":null},{"s":"Someone receives a single email and wants assurance it really came from the claimed sender. No connection, no dispute, no third party. Which service?","o":["peer entity authentication","data origin authentication","access control","nonrepudiation","connectionless confidentiality"],"a":1,"w":"\"Came from\" → origin. Nonrepudiation is for when someone later denies it and you must prove it to a third party.","id":"nss-s31","mod":"nss","t":"mcq","src":"phone site","wk":["2"],"off":false,"m":"11 Oct"},{"s":"An attacker changes employees' bank account numbers in a council payroll system so salaries go to the attacker. Primary principle compromised?","o":["confidentiality","integrity","availability","nonrepudiation","traffic-flow confidentiality"],"a":1,"w":"Data changed → integrity.","id":"nss-s32","mod":"nss","t":"mcq","src":"phone site","wk":["1"],"off":false,"m":null},{"s":"How are keys stored in PGP's private key ring?","o":["in plaintext","encrypted with the receiver's public key","radix-64 encoded","split into segments","encrypted, typically using a hash of the user's passphrase"],"a":4,"w":"Slide 38.","id":"nss-s33","mod":"nss","t":"mcq","src":"phone site","wk":["2"],"off":false,"m":null},{"id":"dwa-1","mod":"dwa","src":"Q1","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the client-server model (slide 2), which statement is correct?","o":["The server initiates requests","Client and server must share a codebase","Communication is mediated by standardised protocols","Client and server must run on separate machines","Client and server must be written in the same language"],"a":2,"w":"Decoupling means they <em>can<\/em> differ in machine and language; they communicate only through protocols."},{"id":"dwa-2","mod":"dwa","src":"Q2","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which is the main trade-off of distributed over monolithic architectures (slide 3)?","o":["Lower latency for less scalability","More latency and serialisation overhead for horizontal scalability and isolation","Lower cost for less fault tolerance","Simpler deployment for more coupling","No trade-off"],"a":1,"w":""},{"id":"dwa-3","mod":"dwa","src":"Q3","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Two-tier thick-client systems suffered from:","o":["Head-of-line blocking","Connection pool exhaustion and per-machine updates","Lack of TLS","Stateless sessions","Too many microservices"],"a":1,"w":"(Slide 5.)"},{"id":"dwa-4","mod":"dwa","src":"Q4","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the module's four-tier blueprint, which tier does TLS and serves static content?","o":["Client","Presentation (Nginx reverse proxy)","Application (FastAPI)","Data","Transport"],"a":1,"w":"(Slide 7.)"},{"id":"dwa-5","mod":"dwa","src":"Q5","wk":["1"],"off":false,"m":null,"t":"mcq","s":"<code>127.0.0.1<\/code> is:","o":["The default gateway","A public DNS resolver","The loopback interface","\"All interfaces\" when binding","A broadcast address"],"a":2,"w":"D describes <code>0.0.0.0<\/code>."},{"id":"dwa-6","mod":"dwa","src":"Q6","wk":["1"],"off":false,"m":null,"t":"mcq","s":"ICMP belongs to which TCP/IP layer?","o":["Link","Internet","Transport","Application","Session"],"a":1,"w":"(Slide 12.)"},{"id":"dwa-7","mod":"dwa","src":"Q7","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the moving-house analogy, the \"inventory check that re-requests missing items\" is:","o":["IP routing","DNS","TCP reassembly","UDP","The link layer"],"a":2,"w":""},{"id":"dwa-8","mod":"dwa","src":"Q8","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The second message of the TCP three-way handshake is:","o":["ACK","SYN","FIN","SYN-ACK","RST"],"a":3,"w":""},{"id":"dwa-9","mod":"dwa","src":"Q9","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A socket is identified by:","o":["IP address only","Port only","Source IP, source port, destination IP, destination port and protocol","MAC address and port","Domain name and path"],"a":2,"w":"(Slide 16.)"},{"id":"dwa-10","mod":"dwa","src":"Q10","wk":["1"],"off":false,"m":null,"t":"mcq","s":"On Unix, binding a server to port 80 requires root because:","o":["Port 80 is encrypted","Ports below 1024 are privileged","HTTP needs sudo","Python needs root","Port 80 is reserved for SSH"],"a":1,"w":""},{"id":"dwa-11","mod":"dwa","src":"Q11","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which port is SSH's IANA-registered (de jure) port?","o":["21","22","53","80","443"],"a":1,"w":""},{"id":"dwa-12","mod":"dwa","src":"Q12","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In DNS resolution (slide 18), which is consulted immediately before the authoritative nameservers?","o":["Browser cache","OS cache","Recursive resolver","Root servers","TLD servers"],"a":4,"w":""},{"id":"dwa-13","mod":"dwa","src":"Q13","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which HTTP method is idempotent but <strong>not<\/strong> safe?","o":["GET","POST","PUT","HEAD","OPTIONS"],"a":2,"w":"DELETE would also qualify."},{"id":"dwa-14","mod":"dwa","src":"Q14","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Sending the same POST twice typically:","o":["Has no effect the second time","Creates two resources","Returns 304","Is blocked by TCP","Converts to PUT"],"a":1,"w":"(Slide 25.)"},{"id":"dwa-15","mod":"dwa","src":"Q15","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Before a cross-origin PUT, the browser automatically sends:","o":["HEAD","GET","OPTIONS","PATCH","CONNECT"],"a":2,"w":"The CORS preflight (slide 29)."},{"id":"dwa-16","mod":"dwa","src":"Q16","wk":["1"],"off":false,"m":null,"t":"mcq","s":"An authenticated user requests a resource they have no rights to. The correct status is:","o":["400","401","403","404","422"],"a":2,"w":"401 = not authenticated."},{"id":"dwa-17","mod":"dwa","src":"Q17","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A request with valid JSON syntax fails field validation (Pydantic). The status is:","o":["400","404","415","422","500"],"a":3,"w":"(Slide 32.)"},{"id":"dwa-18","mod":"dwa","src":"Q18","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Through the department proxy, your page returns 503. The most likely cause in the lab is:","o":["Wrong file permissions","Your server isn't running","A typo in the HTML","An expired cookie","A wrong DNS TTL"],"a":1,"w":"(Transcript 0:56.)"},{"id":"dwa-19","mod":"dwa","src":"Q19","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which header enables several domains on one IP address?","o":["Content-Type","User-Agent","Host","Cookie","Content-Length"],"a":2,"w":"Virtual hosting (slide 34)."},{"id":"dwa-20","mod":"dwa","src":"Q20","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Why must User-Agent never be used for authentication?","o":["It's encrypted","It's client-controlled and spoofable","It's too long","Servers strip it","It changes every request"],"a":1,"w":"(Slide 35.)"},{"id":"dwa-21","mod":"dwa","src":"Q21","wk":["1"],"off":false,"m":null,"t":"mcq","s":"HTTP being stateless means:","o":["Servers can't use databases","Each request-response pair is independent, with no memory of earlier ones","Cookies are forbidden","Connections are always closed","Only GET is allowed"],"a":1,"w":"Cookies, sessions and tokens add state back on top (slide 36)."},{"id":"dwa-22","mod":"dwa","src":"Q22","wk":["1"],"off":false,"m":null,"t":"mcq","s":"HTTP/3 removes transport-layer head-of-line blocking by:","o":["Using binary framing over TCP","Running QUIC over UDP","Compressing headers","Using Keep-Alive","Using SCTP"],"a":1,"w":"A and C are HTTP/2."},{"id":"dwa-23","mod":"dwa","src":"Q23","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which part of <code>https://a.com:8080/p?q=1#top<\/code> is never sent to the server?","o":["<code>https<\/code>","<code>:8080<\/code>","<code>/p<\/code>","<code>?q=1<\/code>","<code>#top<\/code>"],"a":4,"w":""},{"id":"dwa-24","mod":"dwa","src":"Q24","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In a URL, a space is percent-encoded as:","o":["<code>%2B<\/code>","<code>%20<\/code>","<code>%25<\/code>","<code>%3D<\/code>","<code>%26<\/code>"],"a":1,"w":"(<code>+<\/code> only in form-encoded bodies.)"},{"id":"dwa-25","mod":"dwa","src":"Q25","wk":["1"],"off":false,"m":null,"t":"mcq","s":"<code>chmod 755 public_html<\/code> gives others:","o":["No access","Read only","Read and execute (traverse)","Read and write","Full access"],"a":2,"w":""},{"id":"dwa-26","mod":"dwa","src":"Q26","wk":["1"],"off":false,"m":null,"t":"mcq","s":"<code>rwxr-x---<\/code> in octal is:","o":["755","750","640","754","700"],"a":1,"w":""},{"id":"dwa-27","mod":"dwa","src":"Q27","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Web servers like Nginx usually run as:","o":["root","your user","a restricted system user such as <code>www-data<\/code>","the group <code>sudo<\/code>","nobody at all"],"a":2,"w":"(Slide 49.) So your files must be readable, and your directories traversable, by <em>other<\/em>."},{"id":"dwa-28","mod":"dwa","src":"Q28","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which log directory does slide 42 name for debugging crashes?","o":["<code>/etc<\/code>","<code>/home<\/code>","<code>/var/log<\/code>","<code>/usr/bin<\/code>","<code>/tmp<\/code>"],"a":2,"w":""},{"id":"dwa-29","mod":"dwa","src":"Q29","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which is <strong>not<\/strong> on slide 51's SSH hardening list?","o":["Non-standard high port","Ed25519 keys","Disable root login","fail2ban","Switch to Telnet for speed"],"a":4,"w":"Telnet is plaintext."},{"id":"dwa-30","mod":"dwa","src":"Q30","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Host key verification in SSH prevents:","o":["Brute-force password guessing","Connection spoofing (connecting to an impostor server)","Packet loss","DNS caching","Port scanning"],"a":1,"w":""},{"id":"dwa-31","mod":"dwa","src":"Q31","wk":["1"],"off":false,"m":null,"t":"card","s":"Explain the debugging mindset from slide 54 with a lab example.","back":"<p>Separate the protocol side from the server side. Read the HTTP status code first (e.g. 403 → permissions, 503 → server not running), then the server logs. If the logs show no request at all, the problem is before the server: the URL, port or proxy.<\/p>"},{"id":"dwa-32","mod":"dwa","src":"Q32","wk":["1"],"off":false,"m":null,"t":"card","s":"Why do modern web apps \"inherit\" three-tier architecture?","back":"<p>They keep presentation, business logic and data strictly separated, so each can change independently, and application servers can scale horizontally behind load balancers without touching the database (slide 6).<\/p>"},{"id":"dwa-33","mod":"dwa","src":"Q33","wk":["1"],"off":false,"m":null,"t":"card","s":"Give two reasons the lecturer prefers frameworks and an MVP over native code for student work.","back":"<p>Native takes much longer to write and test (more code, more error checking), and a single developer gains little. Frameworks save time and money, so build the MVP first; go native only if the hardware requires it. (Caveat: dependencies add attack vectors.)<\/p>"},{"id":"dwa-34","mod":"dwa","src":"Q34","wk":["1"],"off":false,"m":null,"t":"card","s":"Your Server ID is 312. Which port do you SSH to, and which off-campus URL shows the Part C dynamic server?","back":"<p>2312; <code>http://www.doc.gold.ac.uk/usr/312/<\/code>.<\/p>"},{"id":"dwa-35","mod":"dwa","src":"Q35","wk":["1"],"off":false,"m":null,"t":"card","s":"Which four <code>BaseHTTPRequestHandler<\/code> calls produce, in order, the status line, a header, the end of the headers and the body?","back":"<p><code>send_response(200)<\/code>, <code>send_header(...)<\/code>, <code>end_headers()<\/code>, <code>wfile.write(...)<\/code>.<\/p>"},{"id":"dwa-36","mod":"dwa","src":"Q36","wk":["1"],"off":false,"m":null,"t":"card","s":"Why does Lab 1 write the Python file with a quoted heredoc?","back":"<p>Pasting into nano can mangle indentation (→ <code>IndentationError<\/code>). <code>cat &lt;&lt; 'EOF'<\/code> writes it verbatim, and the quotes stop shell expansion.<\/p>"},{"id":"dwa-37","mod":"dwa","src":"Q37","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Off campus, <code>ssh -t you@doc.gold.ac.uk myserver ssh 560<\/code> keeps failing. What does the cheat sheet suggest?","o":["Use Telnet instead","Log in in two stages: <code>ssh you@doc.gold.ac.uk<\/code>, then <code>ssh myserver -p2560<\/code>","Connect to port 22 of the VM directly","Recreate the VM","Use port 8560"],"a":1,"w":"The one-line command makes two connections (to Igor, then to the VM). Doing them separately is more reliable. Web SSH at <code>http://www.doc.gold.ac.uk/ssh/560<\/code> is another fallback."},{"id":"dwa-38","mod":"dwa","src":"Q38","wk":["1"],"off":false,"m":null,"t":"mcq","s":"You set up the SSH tunnel for FileZilla, but FileZilla won't connect. Most likely cause?","o":["The VM is down","FileZilla needs port 22","You ran the tunnel command on the server instead of your own computer","SFTP is disabled on Linux","The tunnel needs port 80"],"a":2,"w":"The tunnel must start from your own computer. \"If you run the tunnel command on the server you are just connecting the server to the server!\""},{"id":"dwa-39","mod":"dwa","src":"Q39","wk":["1"],"off":false,"m":null,"t":"card","s":"After you recreate your VM with the same ID, SSH says \"REMOTE HOST IDENTIFICATION HAS CHANGED\". What fixes it, and where do you run it?","back":"<p><code>ssh-keygen -R [myserver]:&lt;2000+ID&gt;<\/code>, run <strong>on Igor<\/strong> (<code>doc.gold.ac.uk<\/code>), because that's where the second <code>ssh<\/code> stored the old host key. Then reconnect and accept the new fingerprint. Only do this when you <em>know<\/em> the server was rebuilt. Otherwise the warning may be a real man-in-the-middle.<\/p>"},{"id":"dwa-40","mod":"dwa","src":"Q40","wk":["1"],"off":false,"m":null,"t":"card","s":"Your app works on your laptop but crashes on the VM with <code>bcrypt_lib.node: invalid ELF header<\/code>. Why, and what's the fix?","back":"<p>You copied <code>node_modules<\/code> from your laptop. Compiled modules are built for one OS/CPU, so they don't run on Linux. Delete <code>node_modules<\/code> on the server and run <code>npm install<\/code> there. Rule: never deploy <code>node_modules<\/code> (the Python equivalent is a <code>venv/<\/code>).<\/p>"},{"id":"dwa-41","mod":"dwa","src":"Q41","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Your server won't start: <code>EADDRINUSE: address already in use<\/code>. What's happening?","o":["The port is blocked by a firewall","Another process (often an earlier copy of your app) is already bound to that port","The disk is full","DNS failed","You need <code>sudo<\/code>"],"a":1,"w":"Find it (<code>ps -ux<\/code>, or <code>forever list<\/code>) and stop it, then restart."},{"id":"dwa-42","mod":"dwa","src":"Q42","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which statement about MySQL on Igor is correct?","o":["Any database name works","It uses port 3307 on campus and 3306 off campus","Database names must start with your username, and you use port 3306 on campus, 3307 off campus","It needs the VM password","It's only reachable from your VM"],"a":2,"w":"<code>create database yourusername_abc;<\/code> works; <code>create database abc;<\/code> doesn't."},{"id":"dwa-43","mod":"dwa","src":"Q43","wk":["1"],"off":false,"m":null,"t":"card","s":"You copy <code>rm –r olddir<\/code> from the cheat sheet and it fails with \"No such file or directory: –r\". Why?","back":"<p>The <code>–<\/code> is an en dash, not a hyphen, so the shell reads <code>–r<\/code> as a file name rather than an option. Retype it as <code>-r<\/code> (added explanation).<\/p>"},{"id":"dwa-44","mod":"dwa","src":"Q44","wk":["2"],"off":false,"m":null,"t":"mcq","s":"According to the lecturer, when does a database become necessary?","o":["As soon as a site has more than one page","When you perform create/read/update/delete operations on a regular basis","When you have more than 1,000 records","Whenever you use Python","When you need HTTPS"],"a":1,"w":"\"If we're doing those operations on a regular basis, we need a database. Otherwise we don't.\" Flat files handle 50,000 CSV records fine (transcript 0:04–0:05)."},{"id":"dwa-45","mod":"dwa","src":"Q45","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A shopping cart is stored in a global Python list. It works in testing but carts vanish in production. Why?","o":["JSON can't store lists","The variable is ephemeral memory state, lost when the server process restarts or recycles","CORS blocks the cart","The browser cache","The list is too long"],"a":1,"w":"The common bug on slide 4."},{"id":"dwa-46","mod":"dwa","src":"Q46","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the life of a dynamic request (slide 5), which component parses raw bytes into an ASGI <code>scope<\/code> dictionary?","o":["The OS kernel","Nginx","Uvicorn","FastAPI","PostgreSQL"],"a":2,"w":"Nginx terminates TLS and forwards bytes to 127.0.0.1:8000. Uvicorn builds the <code>scope<\/code> and calls FastAPI."},{"id":"dwa-47","mod":"dwa","src":"Q47","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which rendering model has \"Poor / Fragile\" SEO and \"Zero for markup\" server CPU cost (slide 18)?","o":["SSG","SSR","CSR","Hybrid SSR + hydration","Edge caching"],"a":2,"w":"Client-side rendering."},{"id":"dwa-48","mod":"dwa","src":"Q48","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A server-rendered page looks complete, but clicking a button does nothing for two seconds. What is happening?","o":["A CORS preflight","The user clicked before hydration attached the event listeners","A 422 error","Thread exhaustion","The CDN is down"],"a":1,"w":"The hydration trap (slide 25): the car body is there, but the wheel isn't connected yet."},{"id":"dwa-49","mod":"dwa","src":"Q49","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which is NOT one of the SSR drawbacks on slide 22?","o":["High server load","Clunky navigation (white flash)","Bandwidth waste","State loss","Search engines can't index the content"],"a":4,"w":"SSR has <em>perfect<\/em> SEO. Poor SEO is a CSR drawback."},{"id":"dwa-50","mod":"dwa","src":"Q50","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which is a problem of <strong>native<\/strong> (not web) applications on slide 7?","o":["The browser sandbox","Network fragility","The app store tax of up to 30%","The JS/DOM performance ceiling","The CORS same-origin policy"],"a":2,"w":""},{"id":"dwa-51","mod":"dwa","src":"Q51","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A WSGI server has 4 worker threads. Each request waits 50 ms on the database. What is the maximum throughput?","o":["4 req/s","20 req/s","50 req/s","80 req/s","200 req/s"],"a":3,"w":"4 / 0.05 s = 80 req/s (slide 34). With 1,000 simultaneous users, 920 queue or time out."},{"id":"dwa-52","mod":"dwa","src":"Q52","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which is the ASGI application signature?","o":["<code>def application(environ, start_response)<\/code>","<code>async def application(scope, receive, send)<\/code>","<code>def app(request)<\/code>","<code>async def application(environ)<\/code>","<code>def application(scope, send)<\/code>"],"a":1,"w":"WSGI is A (two synchronous arguments). ASGI has three, with <code>receive<\/code>/<code>send<\/code> awaitable (slide 32)."},{"id":"dwa-53","mod":"dwa","src":"Q53","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Slide 34's takeaway about ASGI is that it…","o":["compiles Python to C","makes Python maths faster","prevents Python sitting idle while waiting for network and disk I/O","removes the need for a database","only works with WebSockets"],"a":2,"w":"\"ASGI does not make Python math faster.\""},{"id":"dwa-54","mod":"dwa","src":"Q54","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A FastAPI route is declared <code>async def<\/code> and calls <code>time.sleep(5)<\/code>. What happens to other users' requests during those 5 seconds?","o":["They're served normally in a thread pool","The entire event loop is frozen, so they stall","They get 422","They're redirected","Uvicorn starts a new worker automatically"],"a":1,"w":"The async trap (slide 38). <em>Quiz-flagged topic (transcript 1:22).<\/em>"},{"id":"dwa-55","mod":"dwa","src":"Q55","wk":["2"],"off":false,"m":null,"t":"card","s":"Your route resizes a 20 MB image with Pillow (CPU-heavy). Should it be <code>def<\/code> or <code>async def<\/code>, and why?","back":"<p><strong><code>def<\/code>.<\/strong> The Pillow call is CPU-bound and blocking: there's nothing to <code>await<\/code>. Inside <code>async def<\/code> it would run on the event loop thread and freeze every other request. As a plain <code>def<\/code>, FastAPI runs it in its background thread pool, so the loop keeps serving. For heavy, frequent image work, move it to a separate worker process or queue (added explanation; check the FastAPI \"Concurrency and async / await\" docs). <em>Quiz-flagged (transcript 1:22).<\/em><\/p>"},{"id":"dwa-56","mod":"dwa","src":"Q56","wk":["2"],"off":false,"m":null,"t":"mcq","s":"If you define a FastAPI route with a plain <code>def<\/code>, FastAPI…","o":["refuses to start","runs it on the event loop thread","runs it in a separate background thread pool","converts it to <code>async def<\/code>","runs it only once"],"a":2,"w":"The \"FastAPI safety net\" (slide 38)."},{"id":"dwa-57","mod":"dwa","src":"Q57","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A client sends <code>{\"title\": \"Lamp\", \"price\": \"cheap\"}<\/code>. The JSON parses fine, but <code>price<\/code> must be a float. FastAPI returns:","o":["200","400 Bad Request","404","422 Unprocessable Entity","500"],"a":3,"w":"400 is for malformed syntax (corrupted JSON). 422 is for valid JSON with invalid data (slide 37)."},{"id":"dwa-58","mod":"dwa","src":"Q58","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A query parameter is declared <code>repeat: int<\/code>. The URL has <code>?repeat=42<\/code>. FastAPI…","o":["rejects it, because URLs are strings","passes the string <code>\"42\"<\/code>","coerces it to the int <code>42<\/code>","returns 400","ignores it"],"a":2,"w":"Automatic data coercion (slide 36)."},{"id":"dwa-59","mod":"dwa","src":"Q59","wk":["2"],"off":false,"m":null,"t":"mcq","s":"What does <code>response_model=UserOut<\/code> do (slide 39)?","o":["Validates the request body","Strips sensitive internal fields (e.g. <code>hashed_password<\/code>) from the JSON sent back","Sets the status code","Enables CORS","Generates the database table"],"a":1,"w":"Response filtering."},{"id":"dwa-60","mod":"dwa","src":"Q60","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which is NOT a benefit of FastAPI's <code>Depends()<\/code> on slide 40?","o":["Separation of concerns","Clean tear-down of DB connections","Swapping in mock databases for tests","Automatically making all routes asynchronous","Handlers receive what they declare (sessions, tokens) as parameters"],"a":3,"w":""},{"id":"dwa-61","mod":"dwa","src":"Q61","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which URL best follows \"nouns over verbs\" for retrieving author 12's books?","o":["<code>/getBooks?author=12<\/code>","<code>/authors/12/books<\/code>","<code>/saveNewBook<\/code>","<code>/books/get/12<\/code>","<code>/fetchAuthorBooks/12<\/code>"],"a":1,"w":"Resource hierarchy by path nesting (slide 42)."},{"id":"dwa-62","mod":"dwa","src":"Q62","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which pairing follows slide 43's status-code discipline?","o":["Failed login → 200 <code>{\"status\":\"error\"}<\/code>","POST creates a resource → 201; DELETE with nothing to return → 204","Not logged in → 403","Logged in but not allowed → 401","Successful read → 201"],"a":1,"w":"401 = \"I don't know who you are\"; 403 = \"I know who you are, but you are not allowed in\"; never 200 for errors."},{"id":"dwa-63","mod":"dwa","src":"Q63","wk":["2"],"off":false,"m":nu

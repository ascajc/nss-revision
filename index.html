<ul><li><strong>L02:</strong> WSGI is <strong>PEP 333 (2003)</strong>; PEP 3333 is the 2010 revision (slide 29 merges them). Slide 37's 422 wording is Pydantic v1. RFC 7807 is now RFC 9457. The ~60 ms ASGI figure ignores the 20–30-connection DB pool (slide 56). The transcript's "200 for create" (1:29) is a garble, so follow slide 43 (201).</li><li><strong>L03:</strong> slide 24 calls RESTRICT the default (strictly, the SQL default is NO ACTION, which behaves almost the same; give the slide's answer). Slide 45's "Page = OFFSET / LIMIT" is the zero-based page index. A UUID is random, not a "hash" (slide 21; repeated out loud). L02 said flat files are often fine; L03 slides say they fail for concurrent web writes. The L03 recording agrees flat files are fine for small MVP data (pt1 l.126), so it's scope, not a real clash. <strong>Joins:</strong> the lecturer said LEFT/RIGHT joins "don't really matter" (pt2 l.1034), but the slides show INNER and LEFT return different rows: revise from the slides. Python has <code>None</code>, not <code>null</code>; NaN is a float, not NULL (pt2 l.124–126 garbles this). In part 1 a PK's "only constraint" is uniqueness (pt1 l.606); revise the full rule: unique, never NULL, immutable.</li><li><strong>VM guide:</strong> MySQL "3302" is a typo for 3306; <code>-p 123</code> on slide 22 should be <code>-p 2123</code>; "FTPS 22" is really SFTP.</li><li><strong>Lab 2:</strong> use <strong>v2</strong> of the sheet (<code>root_path</code>, not v1's double mount). <code>allow_origins=["*"]</code> + <code>allow_credentials=True</code> is lab-only, never production. <code>DELETE</code> returns 200 + body in the lab, while slide 43 says 204 is standard.</li></ul></section></template>
<template id="tpl-dwa-sheet"><section class="sheet-part"><h2>DWA reference sheet</h2><h3>Unix permissions (L01 slides 46–48)</h3>
<p><strong>r = 4, w = 2, x = 1</strong>, summed per class: <strong>user · group · other</strong>.</p>
<div class="table"><table><thead><tr><th>Octal</th><th>Symbolic</th><th>Typical use</th></tr></thead><tbody><tr><td class="key">7</td><td><code>rwx</code></td><td>owner of a directory or script</td></tr><tr><td class="key">6</td><td><code>rw-</code></td><td>owner of a normal file</td></tr><tr><td class="key">5</td><td><code>r-x</code></td><td>others on a directory (traverse)</td></tr><tr><td class="key">4</td><td><code>r--</code></td><td>others on a file</td></tr><tr><td class="key">0</td><td><code>---</code></td><td>no access</td></tr></tbody></table></div>
<ul><li><strong>755</strong> = <code>rwxr-xr-x</code> → directories, e.g. <code>public_html</code> · <strong>644</strong> = <code>rw-r--r--</code> → files, e.g. <code>index.html</code></li><li>Directory <code>x</code> = traverse. Missing <code>o+x</code> on <code>public_html</code> → <strong>403</strong>.</li></ul>
<h3>Ports (slides 16–17)</h3>
<div class="table"><table><thead><tr><th>22 SSH</th><th>53 DNS</th><th>80 HTTP</th><th>443 HTTPS</th><th>8000 / 5000 dev servers</th></tr></thead><tbody></tbody></table></div>
<p>Ports are <strong>16-bit (0–65535)</strong>; <strong>&lt; 1024 needs root</strong>. Socket = (src IP, src port, dst IP, dst port, protocol).</p>
<p><strong>Lab arithmetic (ID = your Server ID):</strong> SSH <strong>2000 + ID</strong> · VM port 80 on campus <strong>8000 + ID</strong> · VM port 8000 on campus <strong>58000 + ID</strong> · proxy <code>/www/&lt;ID&gt;/</code> (port 80) and <code>/usr/&lt;ID&gt;/</code> (port 8000).</p>
<h3>TCP/IP layers (slides 11–12)</h3>
<div class="table"><table><thead><tr><th>#</th><th>Layer</th><th>Protocols</th></tr></thead><tbody><tr><td class="key">4</td><td>Application</td><td>HTTP, HTTPS, FTP, SMTP, DNS</td></tr><tr><td class="key">3</td><td>Transport</td><td>TCP, UDP</td></tr><tr><td class="key">2</td><td>Internet</td><td>IPv4/IPv6, ICMP</td></tr><tr><td class="key">1</td><td>Link</td><td>Ethernet, Wi-Fi (802.11)</td></tr></tbody></table></div>
<p>Handshake: <strong>SYN → SYN-ACK → ACK</strong>. IPv4 = 32 bits = four 8-bit numbers. Loopback = 127.0.0.1.</p>
<h3>DNS chain (slide 18)</h3>
<p>Browser cache → OS cache → recursive resolver → root → TLD → authoritative.</p>
<h3>HTTP</h3>
<p><strong>Request:</strong> <code>METHOD /path HTTP/1.1</code> · headers · blank line · optional body. <strong>Response:</strong> <code>HTTP/1.1 200 OK</code> · headers · blank line · body.</p>
<div class="table"><table><thead><tr><th>Method</th><th>Idempotent</th><th>Safe</th><th>Body</th></tr></thead><tbody><tr><td class="key">GET</td><td>Yes</td><td>Yes</td><td>No (discouraged)</td></tr><tr><td class="key">POST</td><td>No</td><td>No</td><td>Yes</td></tr><tr><td class="key">PUT</td><td>Yes</td><td>No</td><td>Yes</td></tr><tr><td class="key">PATCH</td><td>No (usually)</td><td>No</td><td>Yes</td></tr><tr><td class="key">DELETE</td><td>Yes</td><td>No</td><td>Optional</td></tr></tbody></table></div>
<p>HEAD = headers only · OPTIONS = allowed methods / CORS preflight.</p>
<div class="table"><table><thead><tr><th>Code</th><th>Meaning</th><th>Code</th><th>Meaning</th></tr></thead><tbody><tr><td class="key">100</td><td>Continue</td><td>400</td><td>Bad Request (malformed)</td></tr><tr><td class="key">200</td><td>OK</td><td>401</td><td>Unauthorized (not authenticated)</td></tr><tr><td class="key">201</td><td>Created (+ <code>Location</code>)</td><td>403</td><td>Forbidden (not authorised)</td></tr><tr><td class="key">204</td><td>No Content (DELETE)</td><td>404</td><td>Not Found</td></tr><tr><td class="key">301</td><td>Moved Permanently</td><td>422</td><td>Unprocessable Entity (validation / Pydantic)</td></tr><tr><td class="key">302</td><td>Found (temporary)</td><td>500</td><td>Internal Server Error</td></tr><tr><td class="key">304</td><td>Not Modified (use cache)</td><td>502</td><td>Bad Gateway (upstream bad)</td></tr><tr><td class="key"></td><td></td><td>503</td><td>Service Unavailable (lab: server not running)</td></tr></tbody></table></div>
<p><strong>Versions:</strong> 1.1 sequential (HoL blocking) · 2 binary + multiplexing + header compression · 3 QUIC over UDP. <strong>Headers:</strong> Content-Type · Content-Length (bytes) · Host (virtual hosting) · User-Agent (spoofable) · Set-Cookie/Cookie (state).</p>
<h3>URL (slides 39–40)</h3>
<p><code>scheme://host:port/path?key=value&amp;k2=v2#fragment</code>. The fragment is never sent. Space = <code>%20</code> (<code>+</code> in form bodies). <code>%XX</code> = two hex digits.</p>
<h3>Shell (slides 42–45)</h3>
<p><code>pwd</code> · <code>ls -la</code> · <code>cd ..</code> / <code>cd ~</code> · <code>mkdir -p</code> · <code>cp -r</code> · <code>mv old new</code> · <code>rm -r</code> (no undo) · <code>chmod 755 dir</code> · <code>chown user:group file</code> · <code>nano</code> (Ctrl+O save, Ctrl+X exit) · vim: <code>Esc</code> <code>:wq</code> Enter · <code>/etc</code> config · <code>/var/log</code> logs · <code>/home/user</code> = <code>~</code>.</p>
<h3>SSH (slides 50–53)</h3>
<p><code>ssh user@host</code> · <code>-p PORT</code> · <code>scp -P PORT file user@host:~/</code> · <code>ssh-keygen -R "[host]:port"</code> (clear an old host key). Hardening: non-standard port · Ed25519 keys · no root login · fail2ban.</p>
<h3>Lab environment</h3>
<div class="table"><table><thead><tr><th>Need</th><th>Command</th></tr></thead><tbody><tr><td class="key">VM on campus</td><td><code>ssh you@myserver.doc.gold.ac.uk -p &lt;2000+ID&gt;</code></td></tr><tr><td class="key">VM off campus</td><td><code>ssh -t you@doc.gold.ac.uk myserver ssh &lt;ID&gt;</code>, or two stages: <code>ssh you@doc.gold.ac.uk</code> → <code>ssh myserver -p&lt;2000+ID&gt;</code></td></tr><tr><td class="key">VM in a browser</td><td><code>http://www.doc.gold.ac.uk/ssh/&lt;ID&gt;</code></td></tr><tr><td class="key">Files via FileZilla</td><td>tunnel from local port 9999 (command: Learn page) → <code>sftp://localhost</code>, port 9999</td></tr><tr><td class="key">Stale host key</td><td>on Igor: <code>ssh-keygen -R [myserver]:&lt;2000+ID&gt;</code></td></tr><tr><td class="key">Shell extras</td><td><code>touch</code> · <code>less -N</code> · <code>grep -i/-v/-c/-r</code> · <code>find . -name '*.js'</code> · <code>ps -ux</code> · <code>top</code> · <code>kill PID</code> · <code>df -h</code> · <code>lsb_release -a</code></td></tr><tr><td class="key">MySQL on Igor</td><td>port <strong>3306</strong> on campus / <strong>3307</strong> off; DB names <code>username_xxx</code></td></tr><tr><td class="key">Port in use</td><td><code>EADDRINUSE</code> → an old copy is still running</td></tr><tr><td class="key">Deploy</td><td>don't copy <code>node_modules</code>/<code>venv</code>; install on the server; deploy DB changes; test, then daemonise</td></tr></tbody></table></div>
<h3>Week 2: FastAPI, ASGI, API design</h3>
<p><strong>Concurrency maths (slide 34):</strong> throughput = workers ÷ time per request → 4 / 0.05 s = <strong>80 req/s</strong> (1,000 users → 920 wait; draining takes 12.5 s). ASGI ≈ 60 ms for all 1,000 (ideal; a 20-connection DB pool makes it ≈ 2.5 s). <strong>1,000 req/s × 86,400 s = 86.4 M hits/day</strong> (slide 52).</p>
<div class="table"><table><thead><tr><th>Rendering (slide 18)</th><th>Markup built</th><th>SEO</th><th>First paint</th><th>Server CPU</th></tr></thead><tbody><tr><td class="key">SSG</td><td>build time (CI/CD)</td><td>flawless</td><td>instant (CDN)</td><td>~$0</td></tr><tr><td class="key">SSR</td><td>server, per hit</td><td>flawless</td><td>fast</td><td>high</td></tr><tr><td class="key">CSR</td><td>user's browser</td><td>poor/fragile</td><td>slow</td><td>zero for markup</td></tr><tr><td class="key">SSR + hydrate</td><td>both</td><td>flawless</td><td>fast</td><td>high</td></tr></tbody></table></div>
<div class="table"><table><thead><tr><th></th><th>WSGI</th><th>ASGI</th></tr></thead><tbody><tr><td class="key">Signature</td><td><code>def application(environ, start_response)</code></td><td><code>async def application(scope, receive, send)</code></td></tr><tr><td class="key">Model</td><td>one thread per connection</td><td>one-thread event loop (asyncio)</td></tr><tr><td class="key">Spec</td><td>PEP 333 (2003) / PEP 3333 (2010)</td><td>—</td></tr><tr><td class="key">Examples</td><td>Flask, Django 1.x/2.x, Gunicorn</td><td>FastAPI, Starlette, Quart, Django Channels</td></tr></tbody></table></div>
<p><strong><code>def</code> vs <code>async def</code> (slide 38):</strong> <code>async def</code> only if you <code>await</code> an async library · blocking call in <code>async def</code> = frozen loop · plain <code>def</code> → thread pool · CPU-heavy (Pillow) → <code>def</code> / worker process.</p>
<p><strong>Status discipline (slides 37, 43):</strong> 200 read/update · <strong>201</strong> POST created · <strong>204</strong> nothing to return (DELETE) · <strong>400</strong> malformed syntax · <strong>422</strong> valid JSON, invalid data · <strong>401</strong> who are you? · <strong>403</strong> known, not allowed · never 200 for errors · one error envelope (RFC 7807 → 9457).</p>
<p><strong>REST (slide 42):</strong> nouns not verbs (<code>/books</code>) · GET read · POST create · PUT overwrite · DELETE remove · nesting <code>/authors/12/books</code> · versioning <code>/api/v1/…</code> or <code>Accept: application/vnd.myapi.v2+json</code>. Path param <code>/items/5</code> identifies; query param <code>/items?limit=5</code> modifies.</p>
<p><strong>Server state (slide 4):</strong> ephemeral (RAM, lost on restart) · persistent (DB on disk) · client-held (cookies, localStorage, JWT).</p>
<p><strong>CORS (slides 49–51, 62):</strong> origin = <strong>protocol + host + port</strong> · enforced by the <strong>browser</strong> (curl/Postman ignore it) · server still runs the request · preflight <code>OPTIONS</code> for PUT/DELETE/custom headers (and JSON POSTs) · reply <code>Access-Control-Allow-Origin/-Methods/-Headers</code> · production: exact origins, <strong>never <code>*</code> with cookies</strong>.</p>
<p><strong>FastAPI cheats:</strong></p>
<div class="table"><table><thead><tr><th>Need</th><th>Code / command</th></tr></thead><tbody><tr><td class="key">venv</td><td><code>python3 -m venv venv</code> · <code>source venv/bin/activate</code> · <code>pip install fastapi uvicorn</code></td></tr><tr><td class="key">Run (lab)</td><td><code>python3 -m uvicorn main:app --reload --host 0.0.0.0 --port 8000</code> (default host = 127.0.0.1)</td></tr><tr><td class="key">Port stuck</td><td><code>fuser -k 8000/tcp</code> · <code>lsof -i :8000</code></td></tr><tr><td class="key">Behind <code>/usr/&lt;ID&gt;/</code></td><td><code>app = FastAPI(root_path=f"/usr/{SERVER_ID}")</code>; mount the router <strong>once</strong></td></tr><tr><td class="key">Routes</td><td><code>@router.get("/items/{item_id}")</code> (path) · <code>def greet(name: str = "World")</code> (query) · <code>@router.post("/items", status_code=201)</code></td></tr><tr><td class="key">Body model</td><td><code>class ItemCreate(BaseModel): title: str = Field(min_length=2, max_length=50); price: float = Field(gt=0)</code></td></tr><tr><td class="key">Errors</td><td><code>raise HTTPException(status_code=404, detail="Item not found")</code></td></tr><tr><td class="key">CORS</td><td><code>app.add_middleware(CORSMiddleware, allow_origins=["https://exact.origin"], allow_methods=[...], allow_headers=[...])</code></td></tr><tr><td class="key">Docs</td><td><code>/docs</code> (Swagger, try it out) · <code>/redoc</code> · <code>/openapi.json</code></td></tr><tr><td class="key">curl</td><td><code>-i</code> headers · <code>-v</code> everything · <code>-X POST</code> · <code>-H "Content-Type: application/json"</code> · <code>-d '{"title": "Lamp", "price": 19.99}'</code></td></tr><tr><td class="key">JS fetch</td><td><code>const res = await fetch(url); if (!res.ok) …; const data = await res.json();</code> · render with <code>textContent</code>, never <code>innerHTML</code></td></tr></tbody></table></div>
<p><strong>Scaling path (slides 53–58):</strong> 1 VPS (FastAPI + Uvicorn + SQLite, Nginx + systemd, $5/mo, 0–10k users) → bigger VPS + managed PostgreSQL (10k–75k) → Nginx L7 load balancer + 2–4 stateless nodes + Redis + read replicas (100k+ concurrent). DB pool ~20–30 connections for 2,000 concurrent requests.</p>
<h3>Week 3: databases and SQL</h3>
<p><strong>SQL families (slide 36):</strong> DDL = CREATE, ALTER, DROP, TRUNCATE · DML = INSERT, UPDATE, DELETE · DQL = SELECT.</p>
<p><strong>Cardinality (slides 11–14):</strong> 1:1 FK + UNIQUE (rare) · 1:N <strong>FK on the many side</strong> · M:N <strong>junction table</strong> (two FKs, composite PK).</p>
<p><strong>Crow's foot (slide 16):</strong> <code>||</code> exactly one · <code>O|</code> zero or one · <code>O&lt;</code> zero or many · <code>|&lt;</code> one or many.</p>
<p><strong>PK rules (slide 20):</strong> unique · never NULL · immutable · surrogate over natural.</p>
<p><strong>ON DELETE (slides 24–25):</strong> RESTRICT refuse (slide: default) · CASCADE delete children · SET NULL (nullable FK) · SET DEFAULT.</p>
<p><strong>Normal forms (slides 30–32):</strong> 1NF atomic, no lists · 2NF whole composite key · 3NF no non-key → non-key. "The key, the whole key, and nothing but the key."</p>
<p><strong>Anomalies (slide 28):</strong> insertion · deletion · update.</p>
<p><strong>Query order (slide 50 + background):</strong> FROM/JOIN → WHERE (rows) → GROUP BY → HAVING (groups) → SELECT → ORDER BY → LIMIT/OFFSET.</p>
<div class="table"><table><thead><tr><th>Need</th><th>SQL</th></tr></thead><tbody><tr><td class="key">Table</td><td><code>CREATE TABLE books (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, author_id INTEGER NOT NULL, FOREIGN KEY (author_id) REFERENCES authors(id) ON DELETE RESTRICT);</code></td></tr><tr><td class="key">Junction</td><td><code>PRIMARY KEY (book_id, genre_id)</code> + two FKs <code>ON DELETE CASCADE</code></td></tr><tr><td class="key">Insert</td><td><code>INSERT INTO books (title, author_id, price) VALUES ('1984', 1, 8.99), (...);</code> (always name columns)</td></tr><tr><td class="key">Change / remove</td><td><code>UPDATE books SET price = 12.99 WHERE id = 1;</code> · <code>DELETE FROM books WHERE id = 2;</code> (never without WHERE)</td></tr><tr><td class="key">Filter</td><td><code>WHERE price &lt; 15 AND year &gt;= 1950</code> · <code>IN (1,3,5)</code> · <code>BETWEEN 10 AND 20</code> (inclusive) · <code>LIKE '%Empire%'</code></td></tr><tr><td class="key">Sort / page</td><td><code>ORDER BY price DESC LIMIT 10 OFFSET 20</code> (= page 3)</td></tr><tr><td class="key">Aggregate</td><td><code>COUNT(*)</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code> · text: <code>GROUP_CONCAT(x, ', ')</code> (SQLite) / <code>STRING_AGG(x, ', ')</code> (Postgres)</td></tr><tr><td class="key">Group</td><td><code>GROUP BY author_id HAVING COUNT(*) &gt;= 2</code></td></tr><tr><td class="key">Join</td><td><code>FROM authors INNER JOIN books ON authors.id = books.author_id</code> · <code>LEFT JOIN</code> keeps all authors · <code>WHERE books.id IS NULL</code> = no books</td></tr></tbody></table></div>
<div class="table"><table><thead><tr><th>Engine (slides 39, 58–60)</th><th>SQLite</th><th>MySQL</th><th>PostgreSQL</th></tr></thead><tbody><tr><td class="key">Runs as</td><td>a file, no server</td><td>daemon, port 3306</td><td>daemon, port 5432</td></tr><tr><td class="key">Concurrency</td><td>single writer</td><td>multi-threaded</td><td>MVCC</td></tr><tr><td class="key">Auto ID</td><td><code>AUTOINCREMENT</code></td><td><code>AUTO_INCREMENT</code></td><td><code>SERIAL</code></td></tr><tr><td class="key">Boolean</td><td>none (0/1)</td><td></td><td><code>BOOLEAN</code></td></tr><tr><td class="key">Goldsmiths</td><td><code>sqlite3 bookshop.db</code></td><td>MySQLUser → phpMyAdmin</td><td>PostgreSQLUser → phpPgAdmin</td></tr></tbody></table></div>
<p><strong>SQLite CLI (Lab 3):</strong> <code>.headers on</code> · <code>.mode box</code> · <code>.tables</code> · <code>.schema books</code> · <code>.quit</code> · <code>PRAGMA foreign_keys = ON;</code> (every connection).</p>
<p><strong>Lecturer's rules of thumb (L03 recording):</strong> database when you do CRUD "on a regular basis" (flat file fine for a small MVP) · <strong>SELECT with the same WHERE before any UPDATE/DELETE</strong> · normalise to <strong>3NF, no further</strong> (BCNF out of scope) · denormalise "only ever… one step" · "not all uniques are PKs, but all PKs are unique" · RESTRICT = "say no" default (defensive coding) · SQLite "my go to" → MySQL "really heavy" → Postgres "complex enterprise".</p>
<h3>VM network</h3>

<template id="tpl-fyp-revise"><section id="fyp-marks" class="rv"><div class="sec-head"><span class="label">Final assessment</span><h2>Where the marks are</h2></div><div class="table"><table><thead><tr><th>Area</th><th>Weight</th><th>What earns marks</th><th>Evidence to keep as you go (added explanation)</th></tr></thead><tbody><tr><td class="key">Technical Contribution</td><td><strong>40%</strong></td><td>Implementation quality and difficulty, technologies, code quality, completeness, problem-solving, <strong>individual</strong> contribution</td><td>Clean repo history, architecture diagrams, notes on hard problems solved</td></tr><tr><td class="key">Written Documentation &amp; Exhibition</td><td><strong>30%</strong></td><td>Literature review, design/implementation write-up, critical evaluation, academic writing and referencing, paper, poster + presentation</td><td>Reading notes in <code>literature/</code>, writing alongside development</td></tr><tr><td class="key">Design and Prototype Contribution</td><td><strong>20%</strong></td><td>Problem analysis, solution suitability, design quality, prototyping, originality, <strong>individual</strong> design contribution</td><td>Wireframes, prototype versions, a decision record with alternatives</td></tr><tr><td class="key">Testing and Revisions</td><td><strong>10%</strong></td><td>Strategy, range and quality of tests, participants, faults found, <strong>revisions made in response</strong></td><td>Test plan linked to requirements, results log, before/after changes</td></tr></tbody></table></div>
<p><strong>How the mark is calculated</strong>: each marker gives a raw mark /10 per area; final = <strong>Design×2 + Technical×4 + Testing×1 + Written&amp;Exhibition×3</strong> (/100). The markers' independent pre-viva forms are due Mon 10 May 2027, and the agreed mark goes into the VLE on the viva day.</p>
<div class="callout c-tip"><span class="label">Reading the weights (added explanation)</span><p>Technical + Design = 60%, so the artefact matters most. But 40% (written + testing) rewards documenting and evaluating it. The source's advice backs this up: a smaller, complete, well-evaluated project usually beats an unfinished ambitious one.</p></div></section><section id="fyp-milestones" class="rv"><div class="sec-head"><span class="label">FA1, FA2, final, viva</span><h2>Milestone checklists</h2><p>Ticks come from the revision sheet in the wiki.</p></div><p>Tick these as the project moves on. Each item comes from the source.</p>
<h4>FA1, Fri 6 Nov <strong>or</strong> Mon 9 Nov 2026 (formative, A–F progress grade, 1,500–2,000 words)</h4>
<div class="callout c-warning"><span class="label">Two deadlines in the sources</span><p>The FA1 brief's header and the VLE pages say <strong>Mon 9 Nov</strong>; the brief's own checklist and both supervision guides say <strong>Fri 6 Nov</strong>. Aim for <strong>Fri 6 Nov</strong> until a module leader confirms.</p></div>
<p>Full brief, section by section: fyp fa1 brief. The supervisor's test: <em>"Can you explain a worthwhile problem, justify an achievable solution, show that work has started and present a credible plan?"</em></p>
<ul><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Report §1 Title and summary · §2 Problem or opportunity (<strong>problem first, not technology</strong>) · §3 One aim + 4–6 objectives · §4 Initial research (<strong>not a list of sources</strong>; literature review) · §5 Users and stakeholders · §6 Initial functional + non-functional requirements · §7 Proposed solution (Problem &gt; Research &gt; Needs &gt; Requirements &gt; Solution) · §8 Initial technical approach · §9 Ethics, security and risk · §10 Project plan, Define→Present</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Supervision engagement: meetings attended, actions completed, records kept</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Project Definition Report:</strong> problem · research · users/requirements · proposed solution · ethics/risk · project plan</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Evidence of Early Development:</strong> practical work has actually started</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Project Pitch</strong> (teaching week 5): problem · intended users · proposed solution · expected contribution · planned development approach</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>The project has "moved beyond an idea": a worthwhile problem, an achievable solution, a credible plan</span></li><li>Resources for this stage (ingested 2026-10-09): fyp project idea lists · L02 (+ workbook) · fyp templates (project brief, literature review) · Workshops Lab 01, Lab 02, Lab 03, Lab 04, Lab 06, Lab 07 · the week 5 Synapse pitching workshop · AI declaration</li></ul>
<h4>FA2, Thu 7 Jan <strong>or</strong> Mon 11 Jan 2027 (formative, A–F; "the key completion-risk checkpoint")</h4>
<p>Same date conflict as FA1 (guides: Thu 7 Jan; VLE: Mon 11 Jan). <strong>A live demo is expected</strong>: the supervisor separates "a design that looks complete" from "functionality that actually works" (fyp supervisor guidance §7).</p>
<ul><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Project Progress and Design Report:</strong> response to FA1 feedback · refined requirements · prototype/UX · system architecture · implementation so far · testing approach</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Prototype and Technical Development Evidence</strong></span></li><li>Resources for this stage (ingested): Workshops Lab 05, Lab 08, Lab 09 (+ Adobe XD), Lab 10 · Software Design template · week 13 L13, L13, L13 · what "working" means: fyp build phase submission guide</li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span><strong>Dissertation Progress + Updated Project Plan</strong></span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>A realistic route to a complete, testable, defensible project</span></li></ul>
<h4>Final submission, Mon 19 Apr 2027</h4>
<ul><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Completed artefact, accessible to <strong>both</strong> markers</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Final dissertation (problem, research, requirements, design, implementation, testing, evaluation, conclusions, future work)</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Academic paper: the central contribution, concisely (not a shortened dissertation)</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Supporting files: code, setup instructions, data, credentials. Check every file, link and credential</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>A README / user guide a stranger can follow (test account, sample input, known limitations) and a clean, labelled final commit</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>AI-use declaration, if required</span></li><li>Writing resources: L16 · L16 · L18 · L18 · L18 · examples in fyp sample reports and papers</li></ul>
<h4>Exhibition (date TBC) and viva (10–24 May 2027)</h4>
<ul><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Poster or approved equivalent + presentation for an audience that hasn't read the dissertation</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Working demo, rehearsed</span></li><li class="chk"><span class="chk-b" aria-hidden="true"></span><span class="vh">To do: </span><span>Viva answers prepared (below + the 8 common questions in fyp question bank)</span></li><li>Resources: L18 · L18 · L16</li></ul></section><section id="fyp-viva" class="rv"><div class="sec-head"><span class="label">No separate mark: it checks the evidence is yours</span><h2>Viva prep</h2></div><p>The viva has no separate percentage. It verifies the evidence and your ownership of it. The source lists five things to be ready for.</p>
<details class="fold"><summary>1. What is your project's purpose and contribution?</summary><p>Problem → users → what your solution adds that didn't exist. Fill this in once the idea is chosen.</p></details>
<details class="fold"><summary>2. Can you demonstrate it working?</summary><p>A rehearsed demo of the most important functions (teaching week 12). Have a fallback (video, local build).</p></details>
<details class="fold"><summary>3. Why did you make your key design and technical decisions?</summary><p>For each major choice: the alternatives, the reason, the trade-off. Keep a dated decision record as you go.</p></details>
<details class="fold"><summary>4. How did you test and evaluate it?</summary><p>The strategy, linked to requirements; results; faults found; what you changed as a result; what couldn't be fixed and why it matters.</p></details>
<details class="fold"><summary>5. What would you improve?</summary><p>Honest limitations and future work, drawn from the evaluation.</p></details></section><section id="fyp-meeting" class="rv"><div class="sec-head"><span class="label">Fortnightly, about 15 minutes</span><h2>Before every supervision meeting</h2></div><p>Also check yourself against the supervisor's <strong>project-at-risk warning signs</strong>. The most important: "cannot explain their own code/design".</p>
<p>Use the source's checklist (also fyp student supervision guide): what's done, what evidence, actions completed, decisions justified, biggest risk, dissertation progress, next commitment, on track for the next milestone?</p></section></template>

cated session","User credential compromise"],"a":3,"w":""},{"id":"nss-20","mod":"nss","src":"Q20","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Student enrolment information (regulated by FERPA, seen by many staff daily) would typically have which confidentiality rating?","o":["None","Low","Moderate","High","Critical"],"a":2,"w":"Grades are high, enrolment is moderate, directory info is low."},{"id":"nss-21","mod":"nss","src":"Q21","wk":["1"],"off":false,"m":"7 Oct","t":"mcq","s":"Which FIPS 199 impact level involves potential loss of life?","o":["Low","Limited","Moderate","High","Serious"],"a":3,"w":"Only Low, Moderate and High are levels. \"Serious\" describes Moderate, which explicitly excludes loss of life."},{"id":"nss-22","mod":"nss","src":"Q22","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which statement about the NCSC Cyber Assessment Framework (CAF) is TRUE?","o":["it is published by NIST","it is a self-assessment tool aimed especially at critical infrastructure","organisations can be CAF certified","it has 10 objectives","it replaces ISO 27001"],"a":1,"w":"4 objectives, NCSC, no certification."},{"id":"nss-23","mod":"nss","src":"Q23","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The NCSC's 10 Steps to Cyber Security recommends starting with:","o":["risk management","asset management","supply chain security","incident management","logging and monitoring"],"a":0,"w":"Risk management sits in the centre of the infographic."},{"id":"nss-24","mod":"nss","src":"Q24","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Listening to DNS queries between a user and a DNS server is ___; altering the returned IP address is ___.","o":["active; passive","passive; active","passive; passive","active; active","a threat; a vulnerability"],"a":1,"w":"Reading without changing is passive. Changing the reply is active."},{"id":"nss-25","mod":"nss","src":"Q25","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which organisation is the home of the IETF and the IAB?","o":["NIST","ITU-T","ISOC","NCSC","CERT"],"a":2,"w":"The Internet Society. Internet standards are published as RFCs."},{"id":"nss-26","mod":"nss","src":"Q26","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The NIST Computer Security Handbook defines computer security as protection that preserves which objectives of information system resources?","o":["integrity, availability and confidentiality","authenticity, accountability and nonrepudiation","prevention, detection and recovery","authentication, authorisation and auditing","deterrence, prevention and correction"],"a":0,"w":"\"…preserving the integrity, availability, and confidentiality of information system resources.\" C = what a <em>mechanism<\/em> does (X.800); E is close to the <em>internet security<\/em> definition (deter, prevent, detect, correct)."},{"id":"nss-27","mod":"nss","src":"Q27","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"The security goal that generates the requirement for actions of an entity to be traced uniquely to that entity\" defines:","o":["authenticity","accountability","integrity","access control","availability"],"a":1,"w":"Accountability supports nonrepudiation, deterrence, fault isolation, intrusion detection, recovery and legal action. Authenticity = being genuine and verifiable."},{"id":"nss-28","mod":"nss","src":"Q28","wk":["1"],"off":false,"m":"7 Oct","t":"mcq","s":"According to RFC 4949, a threat is:","o":["an assault on system security that derives from an intelligent threat","a potential for violation of security that could breach security and cause harm","a process designed to detect, prevent or recover from an attack","the reachable and exploitable vulnerabilities in a system","a deliberate attempt to evade security services"],"a":1,"w":"A and E describe an attack, C a mechanism, D the attack surface."},{"id":"nss-29","mod":"nss","src":"Q29","wk":["1"],"off":false,"m":null,"t":"mcq","s":"All traffic on a link is strongly encrypted. Which passive attack can still succeed?","o":["release of message contents","traffic analysis","masquerade","replay","none, because encryption prevents all passive attacks"],"a":1,"w":"Source, destination, frequency and length are still visible. C and D are active attacks."},{"id":"nss-30","mod":"nss","src":"Q30","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which of these is NOT one of the five X.800 security service categories?","o":["authentication","access control","encryption","data integrity","nonrepudiation"],"a":2,"w":"Encryption is a mechanism (how), not a service (what)."},{"id":"nss-31","mod":"nss","src":"Q31","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A file system checks a user's permissions only when a file is opened, not on every read. Which design principle does this fall short of?","o":["fail-safe defaults","complete mediation","least privilege","open design","economy of mechanism"],"a":1,"w":"Complete mediation requires every access to be checked, with no reliance on cached decisions. The lecture notes that full compliance is resource-intensive and rare."},{"id":"nss-32","mod":"nss","src":"Q32","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"An encryption algorithm should be published for expert review; only the keys are kept secret.\" Which principle is this?","o":["economy of mechanism","least astonishment","open design","isolation","encapsulation"],"a":2,"w":"Open design: security mustn't depend on attackers' ignorance of the mechanism."},{"id":"nss-33","mod":"nss","src":"Q33","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"The attacker need only find a single weakness, while the designer must find and eliminate all weaknesses.\" Which computer-security challenge is this?","o":["security is not simple","security is a battle of wits between perpetrator and designer","security requires constant monitoring","security is too often an afterthought","procedures are counter-intuitive"],"a":1,"w":"Slide 20, challenge 6."},{"id":"nss-34","mod":"nss","src":"Q34","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which motive is \"stealing information to gain competitive advantage\"?","o":["sabotage","vandalism","espionage","fraud","warfare"],"a":2,"w":"Sabotage = <em>causing damage<\/em> for competitive advantage (slide 34)."},{"id":"nss-35","mod":"nss","src":"Q35","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A side-channel or fault-injection attack targets data:","o":["in transit","at rest","in use","in backup","in escrow"],"a":2,"w":"Slide 35: in use = side channels / fault injection; at rest = storage security."},{"id":"nss-36","mod":"nss","src":"Q36","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Traffic-flow confidentiality requires that an attacker cannot observe:","o":["message contents only","source, destination, frequency, length or other traffic characteristics","the encryption key","the security policy","the audit log"],"a":1,"w":"Slide 45."},{"id":"nss-37","mod":"nss","src":"Q37","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Peer entity authentication mainly protects against:","o":["traffic analysis","masquerade or unauthorised replay of a previous connection","loss of availability","modification of a single email","insider policy violation"],"a":1,"w":"Slide 43 notes."},{"id":"nss-38","mod":"nss","src":"Q38","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which design principle is \"a specific form of isolation based on object-oriented functionality\"?","o":["modularity","encapsulation","layering","least common mechanism","complete mediation"],"a":1,"w":"Slide 50."},{"id":"nss-39","mod":"nss","src":"Q39","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Role-based access control is the textbook example of:","o":["separation of privilege","least privilege","fail-safe defaults","open design","psychological acceptability"],"a":1,"w":"Slide 49 notes. MFA is the example of separation of privilege."},{"id":"nss-40","mod":"nss","src":"Q40","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In Schneier's \"open safe\" attack tree, \"eavesdrop\" requires listening to the conversation <strong>and<\/strong> getting the target to state the combination. \"Eavesdrop\" is therefore:","o":["a root node","an OR-node","an AND-node","a leaf node","an impossible node"],"a":2,"w":"Slide 56."},{"id":"nss-41","mod":"nss","src":"Q41","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the Internet-banking attack tree, \"CC3 Active man-in-the-middle attacks\" belongs to which strategy?","o":["user credential compromise","injection of commands","user credential guessing","security policy violation","use of known authenticated session"],"a":1,"w":"Slide 59."},{"id":"nss-42","mod":"nss","src":"Q42","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The 10 Steps guidance was first published in 2012 by:","o":["NIST","ISOC","the IETF","ENISA","CESG"],"a":4,"w":"CESG was the NCSC's predecessor."},{"id":"nss-43","mod":"nss","src":"Q43","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which CAF objective is about resilience: withstanding and recovering from an attack?","o":["A","B","C","D","none, CAF has no resilience objective"],"a":3,"w":"D = minimising the impact of incidents. A = manage risk, B = protect, C = detect."},{"id":"nss-44","mod":"nss","src":"Q44","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In CAF, each Indicator of Good Practice (IGP) is rated as:","o":["low / moderate / high","achieved / partially achieved / not achieved","pass / fail","baseline / enhanced","0 to 5"],"a":1,"w":"Baseline and enhanced are the profiles."},{"id":"nss-45","mod":"nss","src":"Q45","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A connection-oriented integrity service addresses which two problems?","o":["traffic analysis and masquerade","message stream modification and denial of service","release of contents and replay","repudiation and access control","social engineering and phishing"],"a":1,"w":"Slide 46 notes."},{"id":"nss-46","mod":"nss","src":"Q46","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The 2016 Dyn attack, which made Twitter, Spotify and Reddit unreachable, primarily violated:","o":["confidentiality","integrity","availability","nonrepudiation","authenticity"],"a":2,"w":"A DDoS by the Mirai botnet."},{"id":"nss-47","mod":"nss","src":"Q47","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The Stuxnet worm primarily violated:","o":["confidentiality","integrity","availability","accountability","none of these"],"a":1,"w":"Unauthorised modification of control systems (availability is secondary)."},{"id":"nss-48","mod":"nss","src":"Q48","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The 2017 Equifax breach primarily violated:","o":["confidentiality","integrity","availability","nonrepudiation","accountability"],"a":0,"w":"Unauthorised access to ~150 million people's personal and financial data."},{"id":"nss-49","mod":"nss","src":"Q49","wk":["1"],"off":false,"m":null,"t":"mcq","s":"MOVEit (2023) and SolarWinds (2020) are both examples of:","o":["DDoS attacks","supply-chain attacks","insider policy violations","physical attacks","traffic analysis"],"a":1,"w":"Both came through third-party software (a zero-day in MOVEit; a trojanised Orion update)."},{"id":"nss-50","mod":"nss","src":"Q50","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The 2021 Colonial Pipeline ransomware attack encrypted the company's data, yet it is usually classed as primarily a loss of:","o":["confidentiality","integrity","availability","nonrepudiation","authenticity"],"a":2,"w":"The outcome was a multi-day shutdown of the fuel supply, a loss of access and service (workshop p.3–4). The encryption itself is an integrity effect, so it is secondary."},{"id":"nss-51","mod":"nss","src":"Q51","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP protects data at which layer?","o":["physical","network","transport","application","data link"],"a":3,"w":"\"Protect the message itself at the application layer\" (slide 3). IPsec = network, TLS = transport."},{"id":"nss-52","mod":"nss","src":"Q52","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which protocol \"covers all applications; removes security management from application developer; customization for specific applications is difficult\"?","o":["PGP","S/MIME","SSL/TLS","IPsec","HTTPS"],"a":3,"w":"Slide 22, network layer."},{"id":"nss-53","mod":"nss","src":"Q53","wk":["2"],"off":false,"m":null,"t":"mcq","s":"According to slide 23, confidentiality is provided by:","o":["public-key cryptography","symmetric key cryptography","message digests","digital signatures","key IDs"],"a":1,"w":"Authentication and integrity come from public-key crypto and signed digests."},{"id":"nss-54","mod":"nss","src":"Q54","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which header carries the source and destination <strong>ports<\/strong>?","o":["MAC header","IP header","TCP/UDP header","Ethernet trailer","DHCP header"],"a":2,"w":"Slide 9, the transport layer. IP = addresses; MAC = hardware addresses."},{"id":"nss-55","mod":"nss","src":"Q55","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the \"day in the life\", before the client can send the frame carrying its DNS query, it must learn:","o":["Google's IP via DHCP","the router interface's MAC via ARP","its own MAC via DHCP","the DNS server's MAC via DNS","Google's MAC via ARP"],"a":1,"w":"Slide 17: \"To send frame to router, need MAC address of router interface: ARP.\""},{"id":"nss-56","mod":"nss","src":"Q56","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The DHCP ACK in the scenario gives the client all of the following <strong>except<\/strong>:","o":["its IP address","the first-hop router's IP","the DNS server's name","the DNS server's IP","the web server's IP address"],"a":4,"w":"That comes later from DNS (slides 16, 18)."},{"id":"nss-57","mod":"nss","src":"Q57","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The DHCP request frame is sent to which Ethernet destination?","o":["FFFFFFFFFFFF (broadcast)","the router's MAC","64.233.169.105","68.80.0.0","the DNS server's MAC"],"a":0,"w":"Slide 15. The client doesn't know any addresses yet."},{"id":"nss-58","mod":"nss","src":"Q58","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the scenario, routing tables in the Comcast network are created by:","o":["DHCP and ARP","RIP, OSPF, IS-IS and/or BGP","TCP and UDP","TLS and IPsec","HTTP and DNS"],"a":1,"w":"Slide 18."},{"id":"nss-59","mod":"nss","src":"Q59","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP is described as a:","o":["purely symmetric system","purely public-key system","hybrid cryptosystem","hash function","VPN protocol"],"a":2,"w":"Slide 26: it combines conventional and public-key cryptography."},{"id":"nss-60","mod":"nss","src":"Q60","wk":["2"],"off":false,"m":null,"t":"mcq","s":"For PGP authentication, the sender:","o":["encrypts the message with the receiver's public key","encrypts a SHA digest with the sender's private key","encrypts the digest with the receiver's private key","encrypts the session key with the sender's public key","compresses the message with the sender's private key"],"a":1,"w":"Slide 31. The digital signature is prepended, and the receiver checks it with the sender's public key."},{"id":"nss-61","mod":"nss","src":"Q61","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP's <strong>default<\/strong> symmetric block cipher (slide 32) is:","o":["AES","CAST-128","RC4","DES","ElGamal"],"a":1,"w":"IDEA and 3DES are the alternatives. ElGamal is a public-key algorithm used for the session key."},{"id":"nss-62","mod":"nss","src":"Q62","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP's block ciphers are used in which mode?","o":["ECB","CBC","CFB","CTR","GCM"],"a":2,"w":"Cipher Feedback mode (slide 32). Lab 02 also uses CFB."},{"id":"nss-63","mod":"nss","src":"Q63","wk":["2"],"off":false,"m":null,"t":"mcq","s":"When does PGP compress the message by default?","o":["before signing","after signing, before encryption","after encryption","after radix-64 conversion","never"],"a":1,"w":"Slide 33, using ZIP."},{"id":"nss-64","mod":"nss","src":"Q64","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP's e-mail compatibility service turns binary into ASCII using:","o":["ZIP","Base64 / radix-64","SHA","CFB","segmentation"],"a":1,"w":"Slides 34–35 use both names for the same encoding."},{"id":"nss-65","mod":"nss","src":"Q65","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A PGP key ID is:","o":["the first 128 bits of the session key","a SHA digest of the private key","the least significant 64 bits of the public key","the email address hashed with the passphrase","the most significant 64 bits of the private key"],"a":2,"w":"8 bytes (slide 37)."},{"id":"nss-66","mod":"nss","src":"Q66","wk":["2"],"off":false,"m":null,"t":"mcq","s":"PGP's web of trust is contrasted with:","o":["symmetric cryptography","hierarchical PKI / Certificate Authorities","IPsec tunnel mode","key rings","radix-64 encoding"],"a":1,"w":"It's bottom-up: any user can sign another's key (slide 40)."},{"id":"nss-67","mod":"nss","src":"Q67","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which PGP service means the signature and session key appear only <strong>once, in the first part<\/strong>?","o":["authentication","confidentiality","compression","e-mail compatibility","segmentation"],"a":4,"w":"Segmentation happens after all encryption and formatting (slide 35)."},{"id":"nss-68","mod":"nss","src":"Q68","wk":["2"],"off":false,"m":null,"t":"mcq","s":"On the PGP private key ring, private keys are stored:","o":["in plaintext","encrypted, typically using a hash of the user's passphrase","on the public key ring","as key IDs only","at a Certificate Authority"],"a":1,"w":"Slide 38."},{"id":"nss-69","mod":"nss","src":"Q69","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The largest application of IPsec is:","o":["email","virtual private networks (VPNs)","web browsing","DNS","file compression"],"a":1,"w":"Slide 44."},{"id":"nss-70","mod":"nss","src":"Q70","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The IPsec Authentication Header (AH) provides:","o":["confidentiality only","source verification and integrity protection","compression","key exchange","segmentation"],"a":1,"w":"Slide 46. Encryption is ESP's job."},{"id":"nss-71","mod":"nss","src":"Q71","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which AH field protects against <strong>replay<\/strong> attacks?","o":["Security Parameter Index","Sequence Number","Authentication Data","Next Header","Path MTU"],"a":1,"w":"Slide 46. The SAD's anti-replay window uses it."},{"id":"nss-72","mod":"nss","src":"Q72","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which is true of an IPsec Security Association?","o":["it covers both directions","it is identified only by the source IP","it is set up by the AH","it is identified by the destination MAC","it is one-way, so two-way exchange needs two SAs"],"a":4,"w":"Identified by SPI + destination IP + protocol (AH or ESP)."},{"id":"nss-73","mod":"nss","src":"Q73","wk":["2"],"off":false,"m":null,"t":"mcq","s":"An SA is uniquely identified by:","o":["source IP, destination IP, port","SPI, IP destination address, security protocol identifier","key ID, timestamp, user ID","MAC address, IP address, port","session ID, master secret, cipher"],"a":1,"w":"Slide 47."},{"id":"nss-74","mod":"nss","src":"Q74","wk":["2"],"off":false,"m":null,"t":"mcq","s":"IKE combines the functions of:","o":["ISAKMP, Oakley and SKEME","AH, ESP and SA","SAD, SPD and SPI","TLS, SSL and PGP","RIP, OSPF and BGP"],"a":0,"w":"Slide 48. Oakley is Diffie-Hellman-based; SKEME does re-keying."},{"id":"nss-75","mod":"nss","src":"Q75","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The Oakley cookie exchange is designed to thwart:","o":["replay attacks","the Diffie-Hellman clogging attack","Heartbleed","traffic analysis","SQL injection"],"a":1,"w":"Slide 48. A clogging attack is a DoS that floods the victim with key-exchange requests."},{"id":"nss-76","mod":"nss","src":"Q76","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the host SPD example, TCP traffic to the DMZ server 1.2.4.10 on port <strong>443<\/strong> is BYPASSed because:","o":["it is IKE traffic","TLS already encrypts it, so this avoids double encryption","it is ICMP","the DMZ is forbidden","port 443 is never encrypted"],"a":1,"w":"Slide 52. Port 80 to the same server is PROTECTed with ESP."},{"id":"nss-77","mod":"nss","src":"Q77","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which SPD selector is <strong>not<\/strong> a field in the IP or upper-layer headers?","o":["remote IP address","local IP address","next layer protocol","name (an OS user identifier)","local and remote ports"],"a":3,"w":"It's available only if IPsec runs on the same OS as the user (slide 51)."},{"id":"nss-78","mod":"nss","src":"Q78","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In <strong>tunnel<\/strong> mode, ESP encrypts:","o":["only the TCP segment","the entire inner IP packet, including the inner header","only the outer IP header","only the original IP header","nothing; it only authenticates"],"a":1,"w":"Slides 53–55. Transport-mode ESP encrypts the payload only."},{"id":"nss-79","mod":"nss","src":"Q79","wk":["2"],"off":false,"m":null,"t":"mcq","s":"IPsec tunnel mode is used when:","o":["both ends are hosts doing end-to-end security","one or both ends of the SA are a security gateway","no encryption is needed","only IPv6 is available","only email must be protected"],"a":1,"w":"Slide 54 (firewalls/routers, VPNs)."},{"id":"nss-80","mod":"nss","src":"Q80","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which IPsec mode hides the original source and destination addresses, giving <strong>traffic-flow confidentiality<\/strong>?","o":["transport mode","tunnel mode","both modes","neither mode","only AH in transport mode"],"a":1,"w":"Slide 57 notes. Transport mode leaves the original header visible."},{"id":"nss-81","mod":"nss","src":"Q81","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Where does the SSL Record Protocol sit?","o":["above the Handshake Protocol","directly above TCP","below IP","inside the application","above the Alert Protocol"],"a":1,"w":"Slides 61, 63. Handshake, Change Cipher Spec and Alert sit above it."},{"id":"nss-82","mod":"nss","src":"Q82","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The SSL Record Protocol's steps, in order, are:","o":["encrypt, MAC, fragment, compress, header","fragment, compress, MAC, encrypt, header","compress, fragment, encrypt, MAC, header","header, fragment, compress, encrypt, MAC","fragment, encrypt, compress, MAC, header"],"a":1,"w":"Slide 63."},{"id":"nss-83","mod":"nss","src":"Q83","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The maximum SSL record fragment size is:","o":["2⁸ bytes","2¹⁴ (16,384) bytes","2¹⁶ bytes","50,000 octets","4,096 bytes"],"a":1,"w":"Slide 63. 2¹⁶ is the Heartbleed figure; 50,000 octets is PGP's segmentation limit."},{"id":"nss-84","mod":"nss","src":"Q84","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which statement about SSL sessions and connections is correct?","o":["a connection can contain many sessions","a session is an enduring association and can contain multiple connections","they are identical","a session is one-time and transient","the master secret belongs to a connection, not a session"],"a":1,"w":"Slide 62 (48-byte master secret per session)."},{"id":"nss-85","mod":"nss","src":"Q85","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which SSL/TLS protocol \"plays a relatively minor role\"?","o":["Handshake","Record","Change Cipher Spec","Alert","Heartbeat"],"a":2,"w":"Slide 61."},{"id":"nss-86","mod":"nss","src":"Q86","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The IETF standardised SSL v3 as TLS 1.0 in:","o":["RFC 4949","RFC 2246","X.800","FIPS 199","RFC 2616"],"a":1,"w":"Slide 59. RFC 4949 is the security glossary from L01."},{"id":"nss-87","mod":"nss","src":"Q87","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Heartbleed happened because the receiver of a HeartbeatRequest failed to check:","o":["the server certificate","that the declared payload_length matched the actual content size","the sequence number","the MAC","the cipher suite"],"a":1,"w":"Slide 68."},{"id":"nss-88","mod":"nss","src":"Q88","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Heartbleed is primarily a loss of:","o":["availability","integrity","confidentiality","nonrepudiation","accountability"],"a":2,"w":"Server memory (private keys, passwords) was disclosed."},{"id":"nss-89","mod":"nss","src":"Q89","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In SSL <strong>server-only<\/strong> authentication, the client:","o":["sends its own certificate","verifies the server's certificate, then encrypts a client-generated secret key with the server's public key","signs every record with its private key","relies on the web of trust","runs IKE on UDP 500"],"a":1,"w":"Slide 60. In server-client authentication the client <em>also<\/em> sends its certificate."},{"id":"nss-95","mod":"nss","src":"Q95","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why does the TCP handshake need a third message (ACK) after SYN and SYN-ACK?","o":["to send the HTTP request","so the server knows its SYN-ACK reached the client, so both sides know they can send and receive","to resolve the server's MAC address","to exchange encryption keys","to request an IP address"],"a":1,"w":"\"Google doesn't know that I received… So I will send back an acknowledgement… Now we have three way communication\" (L02 captions l.412–418)."},{"id":"nss-96","mod":"nss","src":"Q96","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The lecturer's main problem with symmetric-key cryptography on the internet is that:","o":["it is slower than asymmetric","the same key must somehow be shared securely between both parties in advance","it cannot encrypt large files","it provides no confidentiality","the public key must be kept secret"],"a":1,"w":"The key-distribution problem (\"fly an aeroplane\" with the key; \"I cannot go to visit Microsoft every time\"). \"That's why we rely more on asymmetric\" (l.534–548). A is true in general but isn't the point he made."},{"id":"nss-97","mod":"nss","src":"Q97","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which statement about a <strong>hash<\/strong> is correct?","o":["it can be reversed with the right key","it is one-way, and comparing the hash of what was received with the sent hash detects modification","it provides confidentiality","it needs the receiver's private key","it is the same as encryption with a fixed key"],"a":1,"w":"The paint-mixing and counting-the-Es analogies (l.850–876). Encryption is the reversible one (\"minus one\" with the key, l.894)."},{"id":"nss-98","mod":"nss","src":"Q98","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why does compressing a message before encrypting it (as PGP does) strengthen security?","o":["it hides the IP header","it removes the patterns (e.g. letter frequency) that cryptanalysis exploits","it doubles the key length","it adds a digital signature","it makes the message character-oriented"],"a":1,"w":"Frequency analysis and the letter E; Enigma broken through patterns (l.598–616, 714–746; slide 26)."},{"id":"nss-99","mod":"nss","src":"Q99","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the lecturer's \"CEO talks to another CEO\" example, what does IPsec <strong>tunnel<\/strong> mode protect that <strong>transport<\/strong> mode leaves exposed?","o":["the TCP payload","the original source and destination IP addresses (who is talking to whom)","the MAC addresses on the LAN","the DNS query","the port numbers of the IKE exchange"],"a":1,"w":"\"We need to protect the IP headers\" (l.796). Transport mode \"does not afford any traffic flow confidentiality, as the original source and destination addresses are left intact\" (video, l.1074)."},{"id":"nss-100","mod":"nss","src":"Q100","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the post-office analogy for tunnel mode, the address on the <strong>outer<\/strong> parcel corresponds to:","o":["the original sender and final recipient","the security gateways at each end of the tunnel","the DNS server","the MAC address of the next switch","the certificate authority"],"a":1,"w":"\"Post office A to post office B\". The original source and destination are \"inside the parcel\" (l.1000–1010)."},{"id":"nss-101","mod":"nss","src":"Q101","wk":["2"],"off":false,"m":null,"t":"mcq","s":"The lecturer described how a DHCP request is sent. It is carried over:","o":["TCP, unicast to the router","UDP, broadcast to the whole LAN","TCP, broadcast","UDP, unicast to the DNS server","ICMP, broadcast"],"a":1,"w":"\"UDP because we want it quickly\", and \"they broadcast to everyone\" (l.306–312; slide 15: dest FFFFFFFFFFFF)."},{"id":"nss-102","mod":"nss","src":"Q102","wk":["2"],"off":false,"m":null,"t":"mcq","s":"According to the lecturer, what depth of cryptography does NSS cover?","o":["full mathematical proofs","a \"top layer understanding\", because a separate cryptography module follows","none at all","only RSA arithmetic","only classical ciphers such as Enigma"],"a":1,"w":"\"I will just give that top layer understanding of cryptography\" (l.496)."},{"id":"nss-118","mod":"nss","src":"Q118","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A receiver hashes the message she received and gets a different value from the hash sent with it. What can she conclude?","o":["the wrong key was used","the message (or the hash) was changed in transit","the sender's private key was stolen","the message is confidential","nothing, hashes differ every time"],"a":1,"w":"Hashing is deterministic: same data, same hash. A mismatch means something changed."},{"id":"nss-119","mod":"nss","src":"Q119","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In IPsec AH, the Authentication Data is \"the MAC calculated using SHA-1 or HMAC\". MAC here means:","o":["Media Access Control address","Message Authentication Code","Mandatory Access Control","Master Authentication Certificate","Multi-Algorithm Cipher"],"a":1,"w":"A keyed hash for integrity and authentication. The hardware MAC address is the trap."},{"id":"nss-120","mod":"nss","src":"Q120","wk":["2"],"off":false,"m":null,"t":"mcq","s":"A student asked why we need both encryption and hashing. Which answer matches the lecture?","o":["hashing is faster encryption","encryption keeps the data secret (confidentiality), and the hash shows whether it was changed (integrity)","hashing produces the key used for encryption","encryption alone already detects every change","the hash lets the receiver decrypt without the key"],"a":1,"w":"L02 captions l.916–922."},{"id":"nss-121","mod":"nss","src":"Q121","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Why does PGP encrypt the 160-bit SHA digest with the sender's PRIVATE key?","o":["so only the receiver can read it","so anyone with her public key can check it came from her (authentication + nonrepudiation)","because public keys can't encrypt","to compress the message","to hide the session key"],"a":1,"w":"That's a digital signature. Only she has the private key, so she can't deny it."},{"id":"nss-90","mod":"nss","src":"Q90","wk":["2"],"off":false,"m":null,"t":"mcq","s":"In the Lab 02 scripts, the random AES key is protected in transit by:","o":["the sender's private key","the receiver's RSA public key (OAEP padding)","a shared password","pickle serialisation","the IV"],"a":1,"w":"The receiver decrypts it with its private key."},{"id":"nss-91","mod":"nss","src":"Q91","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<code>socket.socket(socket.AF_INET, socket.SOCK_STREAM)<\/code> creates a socket for:","o":["IPv6 + UDP","IPv4 + TCP","IPv4 + UDP","a Unix-domain socket + TCP","IPv6 + TCP"],"a":1,"w":""},{"id":"nss-92","mod":"nss","src":"Q92","wk":["2"],"off":false,"m":null,"t":"mcq","s":"<code>os.urandom(32)<\/code> as an AES key gives AES-:","o":["128","192","256","2048","65537"],"a":2,"w":"32 bytes = 256 bits. 2048 is the RSA key size; 65537 is the RSA public exponent."},{"id":"nss-93","mod":"nss","src":"Q93","wk":["2"],"off":false,"m":null,"t":"mcq","s":"As written, the Lab 02 scheme provides:","o":["confidentiality only","confidentiality and sender authentication","integrity only","nonrepudiation","availability"],"a":0,"w":"There's no signature or MAC, so the receiver can't verify who sent it or detect tampering. Compare PGP's authentication service."},{"id":"nss-94","mod":"nss","src":"Q94","wk":["2"],"off":false,"m":null,"t":"mcq","s":"Which script must be running before <code>sender.py<\/code> is started?","o":["none","<code>receiver.py<\/code>, so it is listening on port 65432","<code>generate_keys.py<\/code> must run after the sender","the sender must start first","both must start at the same instant"],"a":1,"w":"The keys must exist first (generate_keys.py, run once), then the receiver listens, then the sender connects."},{"id":"nss-103","mod":"nss","src":"Q103","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which three objectives form the classic \"CIA\" security triad discussed in the lecture?","o":["Confidentiality, Identification, Accountability","Control, Integrity, Availability","Confidentiality, Integrity, Availability","Confidentiality, Integrity, Authentication"],"a":2,"w":""},{"id":"nss-104","mod":"nss","src":"Q104","wk":["1"],"off":true,"m":null,"t":"mcq","s":"In the lecture, a loss of confidentiality is best described as:","o":["The refusal of a sender to acknowledge sending a message.","The inability of a system to perform its intended function.","The unauthorised disclosure of information.","Unauthorised modification of information."],"a":2,"w":"a = repudiation, b = availability, d = integrity."},{"id":"nss-105","mod":"nss","src":"Q105","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which statement correctly contrasts passive and active attacks as per the lecture?","o":["Passive attacks are always easier to detect than active attacks.","Passive attacks always alter data, active attacks only observe traffic patterns.","Active attacks only occur at the physical layer while passive attacks occur at the application layer.","Passive attacks eavesdrop or monitor; active attacks alter or disrupt system resources."],"a":3,"w":"a is backwards: passive attacks are <em>hard<\/em> to detect, which is why the emphasis is prevention."},{"id":"nss-106","mod":"nss","src":"Q106","wk":["1"],"off":true,"m":null,"t":"mcq","s":"The lecture describes a replay attack as:","o":["Encrypting a message to prevent normal users from reading it.","Capture of a legitimate message and retransmission to produce an unauthorised effect.","Interception of traffic to learn contents without modifying it.","Masquerading as a legitimate user by guessing credentials."],"a":1,"w":"c = release of message contents (passive), d = masquerade."},{"id":"nss-107","mod":"nss","src":"Q107","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which of the following is NOT one of the X.800 security service categories listed in the lecture?","o":["Non-repudiation","Encryption key distribution","Access control","Authentication"],"a":1,"w":"The five are authentication, access control, data confidentiality, data integrity and nonrepudiation (plus the availability service)."},{"id":"nss-108","mod":"nss","src":"Q108","wk":["1"],"off":true,"m":null,"t":"mcq","s":"According to the lecture examples, which item would typically be assigned a high confidentiality requirement?","o":["Public university home page","Student grade information","University telephone directory","Anonymous online poll results"],"a":1,"w":"FERPA-regulated grade information. The directory is the lecture's <em>low<\/em> confidentiality example."},{"id":"nss-109","mod":"nss","src":"Q109","wk":["1"],"off":true,"m":null,"t":"mcq","s":"What does non-repudiation ensure in a security context as taught in the lecture?","o":["That a system maintains full confidentiality under all circumstances.","That users are anonymous when accessing a resource.","That a system always rejects invalid inputs.","That origin or delivery of data cannot be denied by the sender or receiver."],"a":3,"w":"It protects both directions."},{"id":"nss-110","mod":"nss","src":"Q110","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which problem is traffic padding intended to mitigate?","o":["User authentication failures","Key escrow vulnerabilities","Message modification in transit","Traffic analysis (inference from observing packet lengths/timing)"],"a":3,"w":"Padding hides the real lengths and frequency, which supports traffic-flow confidentiality. Traffic padding is an X.800 <em>mechanism<\/em> that L01 doesn't teach."},{"id":"nss-111","mod":"nss","src":"Q111","wk":["1"],"off":true,"m":null,"t":"mcq","s":"\"Least privilege\" as a security design principle requires:","o":["Security mechanisms must be kept secret to be effective.","Users and processes operate with the minimal privileges needed to perform tasks.","System defaults grant maximum access and require users to reduce privileges.","All modules share as many functions as possible."],"a":1,"w":"a contradicts open design, c contradicts fail-safe defaults, d contradicts least common mechanism."},{"id":"nss-112","mod":"nss","src":"Q112","wk":["1"],"off":true,"m":"10 Oct","t":"mcq","s":"Which of these is NOT one of the three attack surface categories?","o":["network","software","human","cryptographic","none, all four are categories"],"a":3,"w":"N-S-H: Network, Software, Human. Human IS a category (social engineering, human error, trusted insiders)."},{"id":"nss-113","mod":"nss","src":"Q113","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which is the best example of an active attack as described in the lecture?","o":["Passively capturing network traffic for later analysis.","Observing traffic volumes to infer communication patterns.","Altering messages in transit to change their content.","Using a read-only copy of a back-up archive."],"a":2,"w":"Modification of messages. a and b are passive."},{"id":"nss-114","mod":"nss","src":"Q114","wk":["1"],"off":true,"m":null,"t":"mcq","s":"What is the primary purpose of an attack tree as introduced in the lecture?","o":["To visualise network topologies for routing optimisation.","To document user authentication credentials.","To provide a cryptographic key management structure.","To model possible attack paths and compare alternatives for breaching a goal."],"a":3,"w":""},{"id":"nss-115","mod":"nss","src":"Q115","wk":["1"],"off":true,"m":null,"t":"mcq","s":"In the lecture, a \"masquerade\" attack involves:","o":["Decrypting traffic by brute force without modifying it.","One entity pretending to be a different, legitimate entity.","Capturing and replaying a legitimate message unchanged.","Using traffic padding to hide message lengths."],"a":1,"w":"c = replay."},{"id":"nss-116","mod":"nss","src":"Q116","wk":["1"],"off":true,"m":null,"t":"mcq","s":"Which action best aligns with the availability security service described in the lecture?","o":["Guaranteeing messages cannot be modified in transit.","Ensuring every user remains anonymous while using a service.","Proving the origin of a message to a third party.","Protecting system resources so authorised users can access them reliably."],"a":3,"w":"a = integrity, c = nonrepudiation."},{"id":"nss-117","mod":"nss","src":"Q117","wk":["1"],"off":true,"m":"10 Oct","t":"mcq","s":"The lecture mentions \"optimistic security\". Which statement reflects this approach?","o":["Tolerating temporary policy violations when they are easy to detect and correct and the violator is accountable.","Never allowing any temporary deviation from the security policy, regardless of context.","Allowing all users maximum privileges initially to improve usability.","Relying exclusively on secrecy of design to achieve security."],"a":0,"w":"(by elimination). b is the <em>pessimistic<\/em> opposite, c breaks least privilege, d breaks open design. <strong>Not found in the WK01 slides or transcripts<\/strong>: see nss week01 learn quiz."},{"id":"nss-122","mod":"nss","src":"Q122","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A mail server receives a single email and checks that it really came from the sender it claims. Nobody has to prove anything to a third party. Which X.800 service?","o":["nonrepudiation","data origin authentication","peer entity authentication","data confidentiality","access control"],"a":1,"w":"Single message, \"came from\" → origin. Peer entity authentication is for a live connection."},{"id":"nss-123","mod":"nss","src":"Q123","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A supplier signs and sends a contract, then months later says they never sent it. Which service lets the buyer prove it to a court?","o":["data origin authentication","data integrity","nonrepudiation","availability service","traffic-flow confidentiality"],"a":2,"w":"\"Can't deny\" + a third party → nonrepudiation."},{"id":"nss-124","mod":"nss","src":"Q124","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the NIST definition of computer security, which is NOT listed as an information system resource?","o":["hardware","firmware","telecommunications","personnel","information/data"],"a":3,"w":"H-S-F-I-T: hardware, software, firmware, information/data, telecommunications. People aren't listed."},{"id":"nss-125","mod":"nss","src":"Q125","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A security team patches 99 vulnerabilities, but an attacker gets in through the 100th. Which challenge does this show?","o":["security is not simple","a battle of wits between perpetrator and designer","security is too often an afterthought","security requires constant monitoring","little perceived benefit until a failure occurs"],"a":1,"w":"The attacker needs one weakness; the designer must eliminate all of them."},{"id":"nss-126","mod":"nss","src":"Q126","wk":["1"],"off":false,"m":null,"t":"mcq","s":"An insider for a rival firm plants malware that corrupts a competitor's production database so it misses a launch. Which malicious behaviour?","o":["espionage","vandalism","sabotage","fraud","terrorism"],"a":2,"w":"Damage for competitive advantage = sabotage. Espionage would steal information instead."},{"id":"nss-127","mod":"nss","src":"Q127","wk":["1"],"off":false,"m":"12 Oct","t":"mcq","s":"An attacker measures how long a smartcard takes to check PINs and how much power it draws, to work out its key. Which threat scenario?","o":["eavesdropper on data in transit","middle-person attack on data in transit","storage security attack on data at rest","side channel attack on data in use","traffic analysis"],"a":3,"w":"Nothing is being sent; the card is computing. Watching its timing and power is a side channel on data in use."},{"id":"nss-128","mod":"nss","src":"Q128","wk":["1"],"off":false,"m":"12 Oct","t":"mcq","s":"A thief steals a laptop, removes the unencrypted drive and reads the files on another computer. Which threat scenario?","o":["eavesdropper on data in transit","storage security attack on data at rest","side channel attack on data in use","middle-person attack on data in transit","fault injection on data in use"],"a":1,"w":"The drive is the drawer: stored data, not moving, not being processed. At rest."},{"id":"nss-129","mod":"nss","src":"Q129","wk":["1"],"off":false,"m":"12 Oct","t":"mcq","s":"An attacker briefly drops the voltage to a payment terminal's chip while it checks a signature, so it accepts a fake card. Which threat scenario?","o":["middle-person attack on data in transit","storage security attack on data at rest","fault injection on data in use","eavesdropper on data in transit","denial of service"],"a":2,"w":"The chip is busy computing; the glitch \"jogs its elbow\". Fault injection, data in use."},{"id":"nss-130","mod":"nss","src":"Q130","wk":["1"],"off":false,"m":"12 Oct","t":"mcq","s":"Which requirement says an entity's actions must be traceable uniquely to it, supported by records for forensic analysis?","o":["authenticity","accountability","nonrepudiation","integrity","access control"],"a":1,"w":"Traced, records, forensics → accountability. Authenticity = genuine and verifiable."},{"id":"nss-131","mod":"nss","src":"Q131","wk":["1"],"off":false,"m":null,"t":"mcq","s":"In the lecture's examples, which has a MODERATE integrity requirement?","o":["hospital patient allergy information","an anonymous online poll","a web forum for registered users","student grade information","an authentication service for critical systems"],"a":2,"w":"Allergy (death) = high, forum (annoying) = moderate, poll (understood) = low."},{"id":"nss-132","mod":"nss","src":"Q132","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Every time a nurse opens a patient record, the system logs the nurse's ID and the time so investigators can see who viewed it. Which requirement?","o":["authenticity","availability","accountability","confidentiality","integrity"],"a":2,"w":"Who DID what, after the event → accountability."},{"id":"nss-133","mod":"nss","src":"Q133","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Before installing an update, a device checks the update is genuine and really from the manufacturer. Which requirement?","o":["accountability","authenticity","availability","traffic padding","confidentiality"],"a":1,"w":"Is it real, at the door → authenticity."},{"id":"nss-134","mod":"nss","src":"Q134","wk":["1"],"off":false,"m":null,"t":"mcq","s":"An attacker gets into a council's payroll system and quietly changes employees' bank account numbers, so their salaries go to the attacker. Which principle is primarily compromised?","o":["confidentiality","integrity","availability","nonrepudiation","traffic-flow confidentiality"],"a":1,"w":"Unauthorised modification (FIPS 199 integrity, slide 22). Method from Lab 01: go by the harm."},{"id":"nss-135","mod":"nss","src":"Q135","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"Know what data and systems you have and what business need they support\" is which of the 10 Steps?","o":["risk management","architecture and configuration","data security","asset management","logging and monitoring"],"a":3,"w":"Know WHAT you have → asset management."},{"id":"nss-136","mod":"nss","src":"Q136","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"Design your systems to be able to detect and investigate incidents\" is which of the 10 Steps?","o":["incident management","logging and monitoring","vulnerability management","engagement and training","risk management"],"a":1,"w":"Detect and investigate → logging and monitoring. Incident management is planning the response in advance."},{"id":"nss-137","mod":"nss","src":"Q137","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"Plan your response to cyber incidents in advance\" is which of the 10 Steps?","o":["logging and monitoring","data security","risk management","supply chain security","incident management"],"a":4,"w":"Planning the response = incident management."},{"id":"nss-138","mod":"nss","src":"Q138","wk":["1"],"off":false,"m":null,"t":"mcq","s":"MOVEit (2023) and SolarWinds (2020) both came in through third-party software. Which of the 10 Steps most directly addresses this?","o":["supply chain security","asset management","engagement and training","data security","identity and access management"],"a":0,"w":"Collaborate with your suppliers and partners. The section was added in the refresh."},{"id":"nss-139","mod":"nss","src":"Q139","wk":["1"],"off":false,"m":null,"t":"mcq","s":"\"Control who and what can access your systems and data\" is which of the 10 Steps?","o":["architecture and configuration","data security","identity and access management","asset management","risk management"],"a":2,"w":"Who and what can access → identity and access management (CAF principle B2 covers the same area)."},{"id":"nss-140","mod":"nss","src":"Q140","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Who is the refreshed 10 Steps guidance mainly aimed at?","o":["board members","home users","government ministers","small businesses only","security professionals and technical staff in medium and large organisations"],"a":4,"w":"Boards use the separate Cyber Security Board Toolkit (2019)."},{"id":"nss-141","mod":"nss","src":"Q141","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The NCSC is part of:","o":["GCHQ","NIST","ISOC","the IETF","ITU-T"],"a":0,"w":"The UK's national cyber security authority, part of GCHQ. Its predecessor was CESG."},{"id":"nss-142","mod":"nss","src":"Q142","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A \"structured set of guidelines\", like a blueprint or roadmap, is called a:","o":["standard","certification","policy","framework","mechanism"],"a":3,"w":"Guideline = recommended. Framework = a structured set of guidelines. Standard = specific, more rigid criteria."},{"id":"nss-143","mod":"nss","src":"Q143","wk":["1"],"off":false,"m":null,"t":"mcq","s":"Which of these is a certification?","o":["ISO 27001","NCSC 10 Steps","NCSC CAF","FIPS 199","RFC 4949"],"a":0,"w":"\"You can't be CAF certified.\" ISO 27001 is the certification."},{"id":"nss-144","mod":"nss","src":"Q144","wk":["1"],"off":false,"m":null,"t":"mcq","s":"A water company's monitoring team spots unusual logins to a control system at 3am. Which CAF objective is this activity under?","o":["A: managing security risk","B: protecting against cyber attack","C: detecting cyber security events","D: minimising the impact of incidents","none, CAF only covers policy"],"a":2,"w":"Spotting unusual or malicious behaviour = detecting (C, \"Catch\")."},{"id":"nss-145","mod":"nss","src":"Q145","wk":["1"],"off":false,"m":null,"t":"mcq","s":"The two CAF profiles are:","o":["low and high","basic and advanced","public and private","baseline and enhanced","achieved and not achieved"],"a":3,"w":"Baseline is foundational; enhanced is for higher-risk organisations."},{"id":"nss-146","mod":"nss","src":"Q146","wk":["1","2"],"off":false,"m":null,"t":"mcq","s":"An IT team installs security updates on all its servers every month, from the day each server is set up until it's retired. Which of the 10 Steps is this?","o":["architecture and configuration","vulnerability management","incident management","asset management","engagement and tra
